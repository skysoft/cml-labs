lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 3.1. Troubleshootinglab met 5 fouten:
    routeringstabellen vergelijken met het ontwerp.'
  notes: |-
    # Lab 3.1.3 - Het verkeer neemt de verkeerde weg

    **Leerdoel (CCNA 200-301 v2.0, 3.1):** een routeringstabel interpreteren om de next hop van een pakket te bepalen (routeringsprotocol, prefix/masker, administratieve afstand, metric en default route).

    ## Scenario
    Een groothandel heeft een hoofdkantoor (HQ), een filiaal (FILIAAL) en een serverruimte (DC). Na een drukke onderhoudsnacht komen er klachten binnen. Alle routers zijn bereikbaar en alle buren zijn op, maar het verkeer gaat niet zoals het ontwerp voorschrijft.

    **Er zitten 5 fouten in dit lab.** Je vindt ze door de routeringstabellen te vergelijken met het ontwerp hieronder.

    ## Klachten
    1. Op het filiaal werkt internet niet. Op het hoofdkantoor wel.
    2. De nieuwe server SRV2 (10.33.50.200) is voor niemand bereikbaar. SRV1 werkt wel.
    3. Videobellen tussen filiaal en hoofdkantoor hapert. De provider van de 4G-backup ziet verkeer over de backupverbinding, terwijl de glasvezel gewoon werkt.
    4. Bestanden openen op de servers gaat vanaf het hoofdkantoor traag.
    5. Het filiaal test IPv6. De servers zijn vanaf het filiaal niet bereikbaar via IPv6, vanaf het hoofdkantoor wel.

    ## Ontwerp
    | Verbinding | Netwerk | Protocol | Bedoeling |
    |---|---|---|---|
    | HQ E0/1 - FILIAAL E0/1 (glasvezel) | 10.33.255.0/30 | OSPF, cost 10 | hoofdverbinding HQ - filiaal |
    | HQ E0/2 - DC E0/1 | 10.33.255.8/30 | OSPF, cost 10 | hoofdverbinding HQ - servers |
    | FILIAAL E0/2 - DC E0/2 (straalverbinding) | 10.33.255.4/30 | OSPF, cost 50 | alleen reserve |
    | HQ E1/0 - BACKUP4G - FILIAAL E0/3 (4G) | 10.33.254.0/29 | EIGRP 33 | alleen als de glasvezel uitvalt: EIGRP-routes krijgen op HQ en FILIAAL AD **200** |
    | HQ E0/3 - ISP | 203.0.113.0/30 | statische default route | **enige** uitgang naar internet; HQ geeft de default route door in OSPF |

    | Netwerk | IPv4 | IPv6 | Waar |
    |---|---|---|---|
    | LAN hoofdkantoor | 10.33.10.0/24 | 2001:db8:33:10::/64 | HQ E0/0 (PC1 .11) |
    | LAN filiaal | 10.33.20.0/24 | 2001:db8:33:20::/64 | FILIAAL E0/0 (PC2 .11) |
    | Servers | 10.33.50.0/24 | 2001:db8:33:50::/64 | **alleen** in DC (SRV1 .10, SRV2 .200) |

    Gewenste paden: HQ ↔ filiaal over de glasvezel, HQ ↔ servers direct, filiaal ↔ servers via HQ (10 + 10 is lager dan 50), internet voor iedereen via HQ.

    De routers ISP en BACKUP4G zijn van de providers: bekijken mag, aanpassen niet. De fouten zitten op HQ, FILIAAL en DC.

    ## Inloggen
    - Routers: console, geen wachtwoord.
    - PC's en servers (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    Wacht na het starten ongeveer twee minuten tot OSPF en EIGRP hun buren hebben gevonden.

    ## Opdracht
    1. Breng de huidige paden in kaart met `traceroute` vanaf de PC's en servers en met de routeringstabellen van HQ, FILIAAL en DC.
    2. Zoek en herstel de 5 fouten. Herstel elke fout met zo min mogelijk wijzigingen. Houd een **foutenlog** bij:

    | # | Router | Wat zag je in de routeringstabel? | Oorzaak | Oplossing (commando's) | Hoe geverifieerd |
    |---|---|---|---|---|---|

    3. Toon na afloop met een traceroute aan dat elk gewenst pad uit het ontwerp klopt.

    ## Reflectie
    1. Bij welke fout gaf de **longest prefix match** de doorslag, bij welke de **administratieve afstand** en bij welke de **metric**?
    2. Bij één klacht werkte alles nog wel, alleen over de verkeerde weg. Waarom zijn zulke fouten in de praktijk lastig te vinden?

    Je docent bespreekt daarna je foutenlog.
