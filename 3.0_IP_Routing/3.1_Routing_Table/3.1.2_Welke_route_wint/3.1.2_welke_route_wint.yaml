lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 3.1. Onderzoekslab: longest prefix match,
    administratieve afstand en metric (incl. ECMP).'
  notes: |-
    # Lab 3.1.2 - Welke route wint?

    **Leerdoel (CCNA 200-301 v2.0, 3.1):** een routeringstabel interpreteren om de next hop van een pakket te bepalen (routeringsprotocol, prefix/masker, administratieve afstand, metric en default route).

    ## Scenario
    Het kantoor (KANTOOR) is op drie manieren verbonden met het datacenter (DC):
    - **Lijn A** en **lijn B**: twee directe lijnen waarover **OSPF** draait. Lijn B is als langzamer ingesteld.
    - Een **MPLS-verbinding** van een provider (router MPLS) waarover **EIGRP** draait.

    Daardoor kent KANTOOR veel bestemmingen op meer dan één manier. Jij zoekt uit welke route de router kiest, en waarom.

    Dit is een **onderzoekslab**: er zit niets kapot. Je voorspelt eerst, controleert daarna en doet dan een paar proeven waarbij je één ding verandert en kijkt wat er in de tabel gebeurt.

    ## De beslisregels van een router
    Een router kiest per pakket één regel uit zijn routeringstabel:
    1. **Longest prefix match**: de regel met het langste passende prefix wint, ongeacht de bron.
    2. Komt hetzelfde prefix uit meerdere bronnen, dan bepaalt de **administratieve afstand** (AD) welke route in de tabel komt.
    3. Heeft één bron meerdere paden naar hetzelfde prefix, dan wint de laagste **metric**. Zijn de metrics gelijk, dan komen alle paden in de tabel (**ECMP**, load balancing).

    ## Topologie
    | Apparaat | Interface | IPv4 | Opmerking |
    |---|---|---|---|
    | PC1 | eth0 | 10.32.10.11/24 | gateway 10.32.10.1 |
    | KANTOOR | E0/1 / E0/2 / E0/3 | 10.32.255.1 / 10.32.255.5 / 10.32.254.1 | lijn A / lijn B / MPLS |
    | DC | E0/1 / E0/2 / E0/3 | 10.32.255.2 / 10.32.255.6 / 10.32.254.5 | lijn A / lijn B / MPLS |
    | MPLS | E0/1 / E0/2 | 10.32.254.2 / 10.32.254.6 | provider |
    | SRV | eth0 | 10.32.60.10/24 en 10.32.60.200/24 | twee adressen op één server |

    DC heeft daarnaast nog twee interne netwerken (loopbacks); zoek die zelf op.

    ## Inloggen
    - Routers: console, geen wachtwoord.
    - PC1 en SRV (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    Wacht na het starten ongeveer twee minuten tot OSPF en EIGRP hun buren hebben gevonden.

    ## Opdrachten

    ### Deel 1 - Wat weet KANTOOR?
    1. Bekijk de routeringstabel van KANTOOR. Noteer per route: code, prefix, AD/metric en next hop.
    2. Welke route staat er naar 10.32.50.0/24? Die server wordt door DC zowel in OSPF als in EIGRP aangeboden. Toon met `show ip ospf database` (of `show ip ospf rib`) aan dat KANTOOR de OSPF-route wél kent. Waarom staat hij niet in de routeringstabel?
    3. Naar 10.32.60.0/24 zijn er twee OSPF-paden (lijn A en lijn B). Welk pad staat in de tabel? Bereken de metric van beide paden.

    ### Deel 2 - Voorspellen
    Voorspel voor elk adres welke regel KANTOOR gebruikt (prefix + code), de next hop en welke beslisregel (longest match, AD of metric) de doorslag geeft.

    | # | Bestemming | Regel | Next hop | Beslisregel |
    |---|---|---|---|---|
    | 1 | 10.32.60.10 | | | |
    | 2 | 10.32.60.200 | | | |
    | 3 | 10.32.50.1 | | | |
    | 4 | 10.40.7.1 | | | |
    | 5 | 10.40.0.1 | | | |
    | 6 | 8.8.8.8 | | | |

    ### Deel 3 - Controleren
    1. Controleer elke voorspelling op KANTOOR met `show ip route <adres>`. Let op de regel "Routing entry for …": dat is de regel die wint.
    2. Controleer de paden ook met `traceroute` vanaf KANTOOR en vanaf PC1. Aan het adres van de tweede hop zie je over welke lijn het pakket ging.
    3. Bestemming 4 en 5 liggen allebei in 10.40.0.0/16. Waarom gaat de ene via DC en de andere via de provider, terwijl EIGRP een lagere AD heeft dan OSPF?
    4. Bestemming 6 lukt niet. Is dat een fout? Wat doet DC met het pakket?

    ### Deel 4 - Proeven
    Voer de proeven één voor één uit. Bekijk na elke proef opnieuw de tabel en noteer wat er veranderde. Zet daarna de oude situatie terug, tenzij anders vermeld. De configuratiecommando's staan erbij, want configureren is hier niet het doel; het gaat om wat je in de tabel ziet.

    **Proef 1 - De MPLS-verbinding valt uit.** Stop in CML de link tussen KANTOOR E0/3 en MPLS (rechtermuisknop op de link, *Stop*). Wacht ongeveer 20 seconden.
    - Wat gebeurt er met de route naar 10.32.50.0/24? Welke bron neemt het over, en met welke AD?
    - Welke regel gebruikt KANTOOR nu voor 10.40.0.1? Lukt de ping nog?
    - Start de link daarna weer en controleer dat de oude situatie terugkomt.

    **Proef 2 - Gelijke kosten.** Maak lijn B net zo "goed" als lijn A:
    ```
    KANTOOR(config)# interface Ethernet0/2
    KANTOOR(config-if)# ip ospf cost 10
    ```
    - Hoeveel next hops staan er nu bij 10.32.60.0/24 en bij de default route?
    - Bekijk `show ip route 10.32.60.0`. Wat betekenen het sterretje en "traffic share count"?
    - Zet de cost daarna terug naar 20.

    **Proef 3 - De specifieke route verdwijnt.**
    ```
    KANTOOR(config)# no ip route 10.32.60.192 255.255.255.192 10.32.255.6
    ```
    - Welke regel gebruikt KANTOOR nu voor 10.32.60.200, en via welke lijn?
    - Zet de route daarna terug.

    **Proef 4 - De testomgeving gaat uit.**
    ```
    DC(config)# interface Loopback2
    DC(config-if)# shutdown
    ```
    - Welke regel gebruikt KANTOOR nu voor 10.40.7.1? Wat is de next hop?
    - Zet de interface daarna weer aan (`no shutdown`).

    ## Reflectie
    1. Zet de drie beslisregels in de juiste volgorde en geef bij elke regel een voorbeeld uit dit lab.
    2. Een collega zegt: "EIGRP heeft een lagere AD, dus al het verkeer naar 10.40.0.0/16 gaat via de provider." Klopt dat? Leg uit.
    3. Waarom vergelijkt een router de metric van een OSPF-route nooit met die van een EIGRP-route?

    Je docent bespreekt daarna je antwoorden.
  title: Lab 3.1.2 - Welke route wint
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
