lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 3.1. Verkenningslab: routeringstabellen
    (IPv4 en IPv6) lezen en interpreteren.'
  notes: |-
    # Lab 3.1.1 - De kaart van het netwerk

    **Leerdoel (CCNA 200-301 v2.0, 3.1):** een routeringstabel interpreteren om de next hop van een pakket te bepalen (routeringsprotocol, prefix/masker, administratieve afstand, metric en default route).

    ## Scenario
    Je bent net begonnen als netwerkbeheerder bij een bedrijf met een hoofdkantoor (HQ) en twee vestigingen (NOORD en ZUID). Je voorganger heeft het netwerk werkend achtergelaten, maar zonder documentatie. De enige "kaart" die je hebt, zijn de **routeringstabellen** van de routers.

    Dit is een **verkenningslab**: er zit niets kapot en je hoeft niets te configureren. Je leest, interpreteert en voorspelt.

    Wat je vooraf weet:
    - HQ en NOORD wisselen routes uit met **OSPF**.
    - HQ en ZUID wisselen routes uit met **EIGRP** (een Cisco-protocol; je hoeft het niet te kunnen configureren, alleen te herkennen).
    - HQ is via de ISP verbonden met het **echte internet** (testadres 8.8.8.8).

    ## Topologie
    | Apparaat | Interface | IPv4 | IPv6 |
    |---|---|---|---|
    | PC1 | eth0 | 10.31.10.11/24 | 2001:db8:31:10::11/64 |
    | PC2 | eth0 | 10.31.20.11/24 | 2001:db8:31:20::11/64 |
    | PC3 | eth0 | 10.31.30.11/24 | 2001:db8:31:30::11/64 |
    | HQ | E0/0 / E0/1 / E0/2 / E0/3 | zie `show ip interface brief` | |

    De rest van de adressen zoek je zelf op; dat is onderdeel van de opdracht.

    ## Inloggen
    - Routers: console, geen wachtwoord.
    - PC's (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    Wacht na het starten ongeveer twee minuten tot alle routeringsprotocollen hun buren hebben gevonden.

    ## Opdrachten

    ### Deel 1 - De legenda
    1. Bekijk de routeringstabel van HQ. Leg in eigen woorden uit wat de codes **C, L, S, S\*, O, O E2, D** en **D EX** betekenen. Welke van deze codes zie je op HQ, NOORD en ZUID?
    2. Waarom staat er bij elk verbonden netwerk een **C**- én een **L**-regel? Welke prefixlengte heeft de L-regel en waarom?
    3. Vul de tabel met standaardwaarden voor de **administratieve afstand** (AD) in: verbonden, statisch, EIGRP (intern), OSPF, RIP, EIGRP (extern). Welke waarden kun je in de tabellen van dit lab terugvinden?

    ### Deel 2 - De tabel van HQ ontleden
    Vul voor **elke** IPv4-route in de tabel van HQ een regel in (sla de L-regels over):

    | Code | Netwerk | Prefixlengte | Masker (decimaal) | AD | Metric | Next hop | Uitgaande interface |
    |---|---|---|---|---|---|---|---|

    Beantwoord daarna:
    1. Bovenaan staat "10.0.0.0/8 is variably subnetted, … subnets, … masks". Wat betekent dat? Welke maskers kom je tegen?
    2. Bij welke routes ontbreekt een metric of is die 0? Waarom?
    3. De OSPF-route naar 10.31.20.0/24 heeft een andere metric dan die naar 10.31.21.0/26. Verklaar het verschil. (Tip: een Ethernet-interface op deze routers telt als 10 Mbit/s.)
    4. Kun je de metric van de EIGRP-route vergelijken met die van een OSPF-route? Waarom wel of niet?

    ### Deel 3 - De gateway of last resort
    1. Wat is de gateway of last resort van **HQ**, **NOORD** en **ZUID**? Noteer per router de code van de default route.
    2. Leg per router uit hoe hij aan zijn default route komt: zelf ingesteld of geleerd, en van wie?
    3. Wat zou er met een pakket naar 8.8.8.8 gebeuren op een router **zonder** gateway of last resort?

    ### Deel 4 - Eén route in detail
    1. Bekijk op HQ de details van de route naar 10.31.20.0 (`show ip route 10.31.20.0`). Zoek op: de bron (Known via), de afstand, de metric, het type, de next hop en hoe lang geleden de route is geleerd.
    2. Doe hetzelfde op NOORD voor 10.31.30.0. Wat betekent "type extern 2" en waarom heeft deze route bij NOORD een ander type dan bij HQ?
    3. Bekijk op ZUID de route naar 10.31.20.0. Welke AD heeft deze route? Vergelijk die met de AD van de EIGRP-route naar 10.31.30.0 op HQ en verklaar het verschil.

    ### Deel 5 - De IPv6-tabel
    1. Bekijk de IPv6-tabel van HQ (`show ipv6 route`). Welke codes kom je tegen en welke AD's horen erbij?
    2. Waarom heeft een L-regel bij IPv6 de prefixlengte /128?
    3. Wat is de route naar **FF00::/8** en waarom staat die er?
    4. Wat is de next hop van de OSPFv3-route naar 2001:db8:31:20::/64? Is dat een globaal adres of een link-local adres? Wat is het verschil met de statische route naar 2001:db8:31:30::/64?

    ### Deel 6 - De next hop bepalen
    Voorspel voor elk bestemmingsadres welke regel HQ gebruikt, met welke next hop en via welke interface. Controleer je voorspelling daarna op HQ met `show ip route <adres>` en, waar dat kan, met `traceroute` vanaf PC1.

    | Bestemming | Regel (netwerk/prefix + code) | Next hop | Interface |
    |---|---|---|---|
    | 10.31.21.40 | | | |
    | 10.31.21.100 | | | |
    | 10.31.30.11 | | | |
    | 192.168.31.1 | | | |
    | 8.8.8.8 | | | |
    | 10.31.99.1 | | | |
    | 2001:db8:31:20::11 | | | |
    | 2001:db8:f00d::1 | | | |

    Bij sommige adressen antwoordt `show ip route <adres>` met **% Subnet not in table**. Wat betekent dat, en welke regel gebruikt HQ dan toch?

    ## Reflectie
    1. 10.31.21.40 en 10.31.21.100 liggen dicht bij elkaar. Waarom volgen ze toch een verschillende regel?
    2. Een router kent een bestemming via OSPF en via EIGRP. Welke kiest hij en waarom maakt de metric daarbij niet uit?
    3. Wat is het voordeel van de default route op NOORD en ZUID ten opzichte van een route naar elk internetnetwerk?

    Je docent bespreekt daarna je antwoorden.
  title: Lab 3.1.1 - De kaart van het netwerk
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
