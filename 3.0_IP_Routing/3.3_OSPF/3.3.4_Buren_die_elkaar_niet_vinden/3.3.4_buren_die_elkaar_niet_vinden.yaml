lab:
  description: CCNA 200-301 v2.0 - leerdoel 3.3. Troubleshootinglab met 7 fouten in
    OSPFv2/OSPFv3-adjacencies.
  notes: |-
    # Lab 3.3.4 - Buren die elkaar niet vinden

    **Leerdoel (CCNA 200-301 v2.0, 3.3):** single-area OSPFv2 en OSPFv3 troubleshooten: neighbor adjacencies, point-to-point, broadcast (DR/BDR) en router-ID.

    ## Scenario
    Een groothandel heeft het netwerk tussen het hoofdkantoor (HQ) en vier vestigingen (NOORD, ZUID, OOST en WEST) omgezet naar OSPF voor IPv4 én IPv6. Na het weekend werkt bijna niets meer buiten het hoofdkantoor. Alle kabels zitten goed en alle interfaces zijn up.

    **Er zitten 7 fouten in dit lab.** Alle fouten zitten in de OSPF-configuratie of in instellingen die een OSPF-adjacency beïnvloeden. Authenticatie wordt niet gebruikt.

    ## Klachten
    1. Het LAN van NOORD is vanaf het hoofdkantoor niet bereikbaar, via IPv4 noch via IPv6.
    2. Het LAN van ZUID is vanaf het hoofdkantoor niet bereikbaar, via IPv4 noch via IPv6.
    3. De netwerken van OOST en WEST zijn vanaf het hoofdkantoor niet bereikbaar, via IPv4 noch via IPv6.
    4. Geen enkele vestiging kan het internet bereiken (IPv4: 8.8.8.8, IPv6: 2001:db8:f00d::1).

    ## Ontwerp
    - Eén OSPF-proces (1) voor IPv4 en één OSPFv3-proces (1) voor IPv6, alles in **area 0**, configuratie per interface.
    - Router-ID's (voor v2 en v3 gelijk): HQ **1.1.1.1**, NOORD **2.2.2.2**, ZUID **3.3.3.3**, OOST **4.4.4.4**, WEST **5.5.5.5**.
    - Links HQ-NOORD en HQ-ZUID: network type **point-to-point** (v2 en v3), standaardtimers, MTU 1500.
    - Segment OOST/WEST (switch): broadcast. **HQ is DR** (prioriteit 100 voor v2 en v3); OOST en WEST hebben prioriteit 0 (mogen nooit DR of BDR worden).
    - LAN-interfaces zijn passief. HQ geeft zijn default route door (v2 en v3).

    | Verbinding / netwerk | IPv4 | IPv6 |
    |---|---|---|
    | HQ E0/1 - NOORD E0/1 | 10.34.255.0/30 | 2001:db8:34:ff01::/64 |
    | HQ E0/2 - ZUID E0/1 | 10.34.255.4/30 | 2001:db8:34:ff02::/64 |
    | Segment (HQ E1/0 .1, OOST .2, WEST .3) | 10.34.100.0/24 | 2001:db8:34:100::/64 |
    | LAN HQ / NOORD / ZUID | 10.34.10.0/24 / 10.34.20.0/24 / 10.34.30.0/24 | 2001:db8:34:10/20/30::/64 |
    | LAN OOST / WEST (Loopback1) | 10.34.40.0/24 / 10.34.50.0/24 | 2001:db8:34:40/50::/64 |
    | HQ E0/3 - ISP | 198.51.100.32/30 | 2001:db8:ffff:34::/64 |

    Hosts: PC1 (HQ), PC2 (NOORD) en PC3 (ZUID) hebben adres .11 / ::11 in hun LAN. De ISP-router is van de provider: bekijken mag, aanpassen niet.

    ## Inloggen
    - Routers: console, geen wachtwoord.
    - PC's (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Opdracht
    1. Breng per router de OSPF-buren in kaart, voor v2 én v3: welke buren zijn er, in welke state, en welke ontbreken?
    2. Zoek en herstel de 7 fouten. Houd een **foutenlog** bij:

    | # | Router | v2/v3 | Symptoom (state, log, tabel) | Oorzaak | Oplossing (commando's) | Hoe geverifieerd |
    |---|---|---|---|---|---|---|

    3. Toon na afloop aan dat alle adjacencies uit het ontwerp er zijn (met de juiste rol op het segment) en dat alle LAN's en het internet bereikbaar zijn.

    ## Reflectie
    1. Bij welke fout zag je de buur wel, maar kwam hij niet in FULL? In welke state bleef hij hangen en waarom juist daar?
    2. Welke fouten waren alleen via een logmelding of een detail in `show ip ospf interface` / `show ipv6 ospf interface` te vinden?

    Je docent bespreekt daarna je foutenlog.
