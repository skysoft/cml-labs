lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 3.3. Configuratielab OSPFv3: router-ID,
    interfaceconfiguratie, passive, DR/BDR, point-to-point, default route.'
  notes: |-
    # Lab 3.3.3 - Dezelfde kaart in OSPFv3

    **Leerdoel (CCNA 200-301 v2.0, 3.3):** single-area OSPFv3 voor IPv6 configureren: neighbor adjacencies, point-to-point, broadcast (DR/BDR) en router-ID.

    ## Scenario
    Een campusnetwerk werkt **alleen met IPv6**. R1, R2 en R3 zitten samen op een **backbone-segment** (een switch). R3 heeft een point-to-point-link naar de vestiging BRANCH. R1 is de internetrouter en heeft al een default route naar de ISP (gesimuleerd internet: **2001:db8:f00d::1**).

    Er draait nog geen routeringsprotocol. Jij configureert **OSPFv3 in area 0**.

    Dit is een **configuratielab**: er zit niets kapot.

    ## Topologie
    | Apparaat | Interface | IPv6 | Opmerking |
    |---|---|---|---|
    | R1 | E0/0 / E0/1 | 2001:db8:33:10::1/64 / 2001:db8:33:100::1/64 | LAN (PC1 ::11) / backbone |
    | R1 | E0/2 | 2001:db8:ffff:33::2/64 | naar ISP |
    | R2 | E0/0 / E0/1 | 2001:db8:33:20::1/64 / 2001:db8:33:100::2/64 | LAN (PC2 ::11) / backbone |
    | R3 | E0/1 / E0/2 | 2001:db8:33:100::3/64 / 2001:db8:33:fe01::1/64 | backbone / naar BRANCH |
    | BRANCH | E0/0 / E0/1 | 2001:db8:33:40::1/64 / 2001:db8:33:fe01::2/64 | LAN (PC4 ::11) / naar R3 |

    Elke router heeft een IPv4-adres op Loopback0 (10.255.33.x). Dat is alleen nodig om de router te laten opstarten; het netwerk zelf gebruikt geen IPv4. De ISP-router is niet van jou: bekijken mag, aanpassen niet.

    ## Inloggen
    - Routers: console, geen wachtwoord.
    - PC's (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Opdrachten
    Gebruik overal OSPFv3-proces **1** en **area 0**.

    ### Deel 1 - Router-ID's
    1. OSPFv3 gebruikt een router-ID in IPv4-formaat (32 bits). Waar haalt een router dat vandaan als je niets instelt?
    2. Configureer op R1, R2 en R3 het OSPFv3-proces met de router-ID's **1.1.1.1**, **2.2.2.2** en **3.3.3.3**.
    3. **Proef op BRANCH:** verwijder eerst het IPv4-adres van Loopback0, zodat BRANCH geen enkel IPv4-adres meer heeft. Maak daarna het OSPFv3-proces aan, zonder router-ID. Welke melding geeft IOS? Los het op met router-ID **4.4.4.4**.

    ### Deel 2 - OSPFv3 op de interfaces
    1. Zet OSPFv3 aan op alle interfaces van R1, R2, R3 en BRANCH, behalve de link naar de ISP. Bij OSPFv3 bestaat er geen `network`-commando: hoe dan wel?
    2. Zorg dat de LAN-interfaces geen hello's versturen, terwijl de LAN's wel worden geadverteerd.
    3. Bekijk `show ipv6 ospf neighbor`. Welke informatie staat er, en wat valt op aan de manier waarop de buren worden aangeduid?

    ### Deel 3 - DR/BDR op het backbone-segment
    1. **Voorspel** welke router DR en welke BDR wordt op het backbone-segment. Controleer met `show ipv6 ospf interface Ethernet0/1`.
    2. Het ontwerp wil **R1** als DR (de internetrouter) en **R2** als BDR. Pas de prioriteiten aan en zorg dat de rollen ook echt veranderen. Welke stappen waren nodig, en waarom?
    3. Werkt de DR/BDR-verkiezing in OSPFv3 anders dan in OSPFv2?

    ### Deel 4 - Point-to-point
    1. Zet de link R3 - BRANCH op network type point-to-point (aan beide kanten). Wat verandert er in `show ipv6 ospf neighbor`?
    2. Zou je het backbone-segment ook op point-to-point kunnen zetten? Waarom niet?

    ### Deel 5 - Default route en verificatie
    1. Laat R1 zijn default route via OSPFv3 doorgeven.
    2. Bekijk `show ipv6 route ospf` op BRANCH. Welke next hop-adressen zie je, en waarom zijn dat geen globale adressen?
    3. Test vanaf PC4 naar PC1, PC2 en 2001:db8:f00d::1.

    ## Reflectie
    1. Noem drie verschillen tussen het configureren van OSPFv2 en OSPFv3.
    2. Waarom moest je op BRANCH een router-ID instellen en op R1 t/m R3 eigenlijk niet?
    3. Welke OSPF-onderdelen zijn in v2 en v3 precies hetzelfde gebleven?

    Je docent bespreekt daarna je antwoorden.
  title: Lab 3.3.3 - Dezelfde kaart in OSPFv3
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
