lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 3.3. Configuratielab OSPFv2: router-ID,
    network/interface, passive, point-to-point, default route.'
  notes: |-
    # Lab 3.3.1 - Drie vestigingen, één area

    **Leerdoel (CCNA 200-301 v2.0, 3.3):** single-area OSPFv2 configureren: neighbor adjacencies, point-to-point, broadcast (DR/BDR) en router-ID.

    ## Scenario
    Een bedrijf heeft drie locaties (HQ, NOORD en ZUID) die in een driehoek met elkaar verbonden zijn. Alle interfaces hebben een adres, maar er draait nog **geen routeringsprotocol**. HQ heeft al een default route naar de ISP (echt internet, testadres 8.8.8.8) en doet NAT.

    Jij configureert **OSPFv2 in area 0**, zodat alle locaties elkaar en het internet kunnen bereiken, ook als er een link uitvalt.

    Dit is een **configuratielab**: er zit niets kapot.

    ## Topologie
    | Apparaat | Interface | IPv4 | Opmerking |
    |---|---|---|---|
    | HQ | E0/0 | 172.16.10.1/24 | LAN (PC1 .11) |
    | HQ | E0/1 / E0/2 | 172.16.255.1/30 / 172.16.255.5/30 | naar NOORD / naar ZUID |
    | HQ | E0/3 | 198.51.100.30/30 | naar ISP (198.51.100.29) |
    | NOORD | E0/0 | 172.16.20.1/24 | LAN (PC2 .11) |
    | NOORD | E0/1 / E0/2 | 172.16.255.2/30 / 172.16.255.9/30 | naar HQ / naar ZUID |
    | NOORD | Loopback1 | 10.255.0.2/32 | beheeradres |
    | ZUID | E0/0 | 172.16.30.1/24 | LAN (PC3 .11) |
    | ZUID | E0/1 / E0/2 | 172.16.255.6/30 / 172.16.255.10/30 | naar HQ / naar NOORD |

    De ISP-router is van de provider: bekijken mag, aanpassen niet. De link naar de ISP hoort **niet** in OSPF.

    ## Inloggen
    - Routers: console, geen wachtwoord.
    - PC's (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Opdrachten
    Gebruik overal OSPF-proces **1** en **area 0**.

    ### Deel 1 - Het router-ID
    1. Een OSPF-router kiest zijn router-ID in een vaste volgorde. Schrijf die volgorde op.
    2. **Voorspel** voor HQ, NOORD en ZUID welk router-ID ze krijgen als je OSPF start zonder iets in te stellen.
    3. Start op alle drie de routers alleen het OSPF-proces (nog geen netwerken) en controleer je voorspelling (`show ip protocols` of `show ip ospf`).
    4. Stel nu de router-ID's handmatig in: HQ **1.1.1.1**, NOORD **2.2.2.2**, ZUID **3.3.3.3**. Bekijk de logmelding (`show logging | include OSPF`). Is het nieuwe router-ID meteen in gebruik? Wat gebeurt er volgens de melding met buren die al FULL zijn? (Op oudere IOS-versies werd het nieuwe router-ID pas actief na `clear ip ospf process`; dat kom je in veel lesmateriaal nog tegen.)
    5. Waarom is een handmatig router-ID in de praktijk beter dan een automatisch gekozen?

    ### Deel 2 - OSPF aanzetten
    Zet OSPF aan op alle interfaces binnen het bedrijf (LAN's en links), op **twee verschillende manieren**:
    1. Op **HQ** met `network`-regels. Gebruik per interface een zo precies mogelijke wildcard.
    2. Op **NOORD** per interface (interfaceconfiguratie).
    3. Op **ZUID** met één enkele `network`-regel die alle bedrijfsinterfaces in één keer dekt.
    4. Hoort het beheeradres van NOORD (Loopback1) in OSPF? Zet het erin, zodat het vanaf HQ te pingen is.

    ### Deel 3 - Buren
    1. Bekijk `show ip ospf neighbor` op alle routers. Welke states zie je? Noteer van elke buur het router-ID, de state en de rol (DR/BDR/DROTHER).
    2. Waarom is er op een link met maar twee routers toch een DR en een BDR?
    3. Noem vier voorwaarden waaraan twee routers moeten voldoen om buren te worden.
    4. Zorg dat er op de **LAN's** geen OSPF-hello's meer worden verstuurd, terwijl het LAN wel wordt geadverteerd. Controleer met `show ip ospf interface brief` en de tabel.

    ### Deel 4 - Point-to-point
    1. Zet het network type van de drie **routerlinks** op point-to-point (aan beide kanten).
    2. Wat verandert er in `show ip ospf neighbor` en in `show ip ospf interface` voor die links?
    3. Waarom is point-to-point de betere keuze voor een link tussen twee routers?

    ### Deel 5 - De default route verspreiden
    1. NOORD en ZUID hebben nog geen route naar internet. Laat **HQ** zijn default route via OSPF aan de andere routers doorgeven.
    2. Controleer de tabellen van NOORD en ZUID (welke code heeft de default route?) en test vanaf PC2 en PC3 naar 8.8.8.8.

    ### Deel 6 - Verificatie en een uitval
    1. Test PC1, PC2 en PC3 onderling. Welke OSPF-routes heeft HQ, en met welke cost?
    2. Zet op **NOORD** en **ZUID** de interface naar elkaar (E0/2) uit. Wat gebeurt er met de buren en de routes? Kunnen PC2 en PC3 elkaar nog bereiken? Over welk pad?
    3. Zet de interfaces weer aan en controleer dat de buren weer FULL worden.

    ## Reflectie
    1. Wat zijn de voor- en nadelen van `network`-regels tegenover OSPF per interface?
    2. Wat is het verschil tussen een passieve interface en een interface die helemaal niet in OSPF zit?
    3. Waarom wordt de link naar de ISP niet in OSPF opgenomen?

    Je docent bespreekt daarna je antwoorden.
  title: Lab 3.3.1 - Drie vestigingen, een area
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
