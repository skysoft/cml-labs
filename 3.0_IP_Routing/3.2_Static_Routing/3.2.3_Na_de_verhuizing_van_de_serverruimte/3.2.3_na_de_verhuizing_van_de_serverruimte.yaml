lab:
  description: CCNA 200-301 v2.0 - leerdoel 3.2. Troubleshootinglab met 6 fouten in
    statische routes (IPv4 en IPv6).
  notes: |-
    # Lab 3.2.3 - Na de verhuizing van de serverruimte

    **Leerdoel (CCNA 200-301 v2.0, 3.2):** statische routering voor IPv4 en IPv6 troubleshooten: default route, netwerkroute, hostroute en floating static.

    ## Scenario
    Een architectenbureau heeft zijn servers verhuisd naar een nieuwe serverruimte (DC) en meteen het filiaal opnieuw aangesloten. Een externe partij heeft alle statische routes ingevoerd. Sindsdien komen er klachten binnen.

    **Er zitten 6 fouten in dit lab.** Alle fouten zitten in de statische routes.

    ## Klachten
    1. Vanaf het hoofdkantoor en het filiaal is de tekenserver SRV2 (10.23.50.140) onbereikbaar. SRV1 (10.23.50.10) werkt wel.
    2. De provider van de hoofdlijn meldt dat de camerabeelden van de recorder in het filiaal (NVR, 10.23.20.50) over de glasvezel gaan. Die horen over de backuplijn.
    3. Collega's op het filiaal klagen over een wisselende snelheid bij het openen van bestanden vanaf het hoofdkantoor. De 4G-provider ziet bovendien gewoon kantoorverkeer over de backuplijn.
    4. Bij de failovertest vorige week (hoofdlijn eruit) had het filiaal geen internet en kon het het hoofdkantoor niet bereiken.
    5. De servers in DC kunnen geen updates downloaden van internet.
    6. Het hoofdkantoor test IPv6: de servers zijn via IPv6 niet bereikbaar. Het filiaal is via IPv6 wel bereikbaar.

    ## Ontwerp
    | Bestemming | Router | Route |
    |---|---|---|
    | Internet | HQ | default route naar ISP 198.51.100.25 |
    | Internet en hoofdkantoor | FILIAAL | default route via de hoofdlijn; **reserve-default (AD 200) via de backuplijn** |
    | Internet en overige netwerken | DC | default route naar HQ (via de link HQ-DC) |
    | Servers 10.23.50.0/24 en 2001:db8:23:50::/64 | HQ | via DC |
    | LAN filiaal 10.23.20.0/24 | HQ | via de hoofdlijn; **reserve (AD 200) via de backuplijn** |
    | NVR 10.23.20.50 | HQ | **altijd** via de backuplijn (hostroute) |
    | LAN hoofdkantoor en filiaal | DC | via HQ |

    | Verbinding | IPv4 | IPv6 |
    |---|---|---|
    | HQ E0/1 - DC E0/1 | 10.23.255.0/30 | 2001:db8:23:ff01::/64 |
    | HQ E0/2 - FILIAAL E0/1 (hoofdlijn) | 10.23.255.4/30 | 2001:db8:23:ff02::/64 |
    | HQ E1/0 - FILIAAL E0/2 (backuplijn, 4G) | 10.23.255.8/30 | - |
    | HQ E0/3 - ISP | 198.51.100.24/30 | - |

    | Netwerk | IPv4 | IPv6 | Hosts |
    |---|---|---|---|
    | LAN hoofdkantoor | 10.23.10.0/24 | 2001:db8:23:10::/64 | PC1 .11 / ::11 |
    | LAN filiaal | 10.23.20.0/24 | 2001:db8:23:20::/64 | PC2 .11 / ::11, NVR .50 |
    | Servers (DC) | 10.23.50.0/24 | 2001:db8:23:50::/64 | SRV1 .10 / ::10, SRV2 .140 / ::140 |

    **Failover testen:** in CML merkt een router niet dat een link is gestopt (de interface blijft up). Simuleer de uitval van de hoofdlijn daarom door op **HQ E0/2 én FILIAAL E0/1** `shutdown` te geven. Zet ze daarna weer aan.

    De ISP-router is van de provider: bekijken mag, aanpassen niet.

    ## Inloggen
    - Routers: console, geen wachtwoord.
    - PC's, NVR en servers (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Opdracht
    1. Zoek en herstel de 6 fouten. Herstel elke fout met zo min mogelijk wijzigingen. Houd een **foutenlog** bij:

    | # | Router | Symptoom | Oorzaak | Oplossing (commando's) | Hoe geverifieerd |
    |---|---|---|---|---|---|

    2. Voer na afloop de failovertest uit en toon aan dat het filiaal dan via de backuplijn bij het hoofdkantoor en op internet komt.

    ## Reflectie
    1. Bij welke fout stond de route wel in de configuratie, maar niet in de routeringstabel? Waarom niet?
    2. Welke fout zou je zonder failovertest nooit hebben gevonden? Wat leer je daaruit voor het beheer van reserveroutes?

    Je docent bespreekt daarna je foutenlog.
