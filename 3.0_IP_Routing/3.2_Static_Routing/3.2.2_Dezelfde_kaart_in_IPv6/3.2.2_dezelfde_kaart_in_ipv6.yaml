lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 3.2. Configuratielab IPv6: ::/0, netwerkroute
    met link-local next hop, hostroute en floating static achter OSPFv3.'
  notes: |-
    # Lab 3.2.2 - Dezelfde kaart in IPv6

    **Leerdoel (CCNA 200-301 v2.0, 3.2):** statische routering voor IPv6 configureren en troubleshooten: default route, netwerkroute, hostroute en floating static.

    ## Scenario
    Het hoofdkantoor (HQ) en de vestiging (VESTIGING) werken **alleen met IPv6**. Over de hoofdlijn draait al **OSPFv3**: de twee LAN's kennen elkaar al. Wat nog ontbreekt:
    - een uitgang naar internet via de ISP (gesimuleerd internet: **2001:db8:f00d::1**);
    - een route naar het servernetwerk van een **partnerbedrijf** (PARTNER). De link tussen HQ en PARTNER heeft geen globale adressen, alleen **link-local** adressen (HQ: FE80::1, PARTNER: FE80::99);
    - een hostroute voor de camerarecorder (CAM) over de **backuplijn** (4G met onbeperkt data), net als in lab 3.2.1;
    - reserveroutes over de backuplijn, voor als de hoofdlijn uitvalt.

    Dit is een **configuratielab**: er zit niets kapot.

    ## Topologie
    | Apparaat | Interface | IPv6 | Opmerking |
    |---|---|---|---|
    | PC1 | eth0 | 2001:db8:22:10::11/64 | LAN HQ |
    | PC2 | eth0 | 2001:db8:22:20::11/64 | LAN vestiging |
    | CAM | eth0 | 2001:db8:22:20::50/64 | camerarecorder |
    | PSRV | eth0 | 2001:db8:99:10::80/64 | server van de partner |
    | HQ | E0/1 / E0/2 | 2001:db8:22:ff01::1 / 2001:db8:22:ff02::1 | hoofdlijn (OSPFv3) / backuplijn |
    | HQ | E0/3 | 2001:db8:ffff:22::2/64 | naar ISP (2001:db8:ffff:22::1) |
    | HQ | E1/0 | FE80::1 (alleen link-local) | naar PARTNER (FE80::99) |
    | VESTIGING | E0/1 / E0/2 | 2001:db8:22:ff01::2 / 2001:db8:22:ff02::2 | hoofdlijn / backuplijn |
    | PARTNER | E0/1 | 2001:db8:99:10::1/64 | servernetwerk partner |

    ISP en PARTNER zijn niet van jou: bekijken mag, aanpassen niet. De routers hebben een IPv4-loopback; die is alleen nodig om de router te laten opstarten en speelt geen rol.

    ## Inloggen
    - Routers: console, geen wachtwoord.
    - PC's, CAM en PSRV (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**. Gebruik `ping` en `traceroute` met een IPv6-adres.

    Wacht na het starten ongeveer een minuut tot OSPFv3 zijn buur heeft gevonden.

    ## Opdrachten

    ### Deel 1 - Uitgangssituatie
    1. Bekijk `show ipv6 route` op HQ en VESTIGING. Welke routes zijn er al, en waar komen ze vandaan?
    2. Test vanaf PC1 naar PC2, naar 2001:db8:f00d::1 en naar PSRV. Verklaar de resultaten.
    3. Welk commando moet aan staan voordat een router überhaupt IPv6-pakketten doorstuurt? Controleer dat het op beide routers aan staat.

    ### Deel 2 - Default route
    1. Geef HQ een default route (`::/0`) naar de ISP, met het globale adres van de ISP als next hop.
    2. Bekijk daarna de tabel van **VESTIGING**. Er is een default route bijgekomen zonder dat je op VESTIGING iets hebt gedaan. Welke code heeft die route, en welke regel in de configuratie van HQ zorgt hiervoor?
    3. Test PC2 → 2001:db8:f00d::1.

    ### Deel 3 - Netwerkroute met een link-local next hop
    1. Configureer op HQ een route naar het serverblok van de partner (2001:db8:99:10::/64) met **alleen** het link-local adres van PARTNER als next hop. Welke foutmelding geeft IOS, en waarom?
    2. Configureer de route nu correct (fully specified).
    3. Test PC1 → PSRV en PC2 → PSRV. Waarom werkt het vanaf PC2 ook, terwijl VESTIGING geen route naar 2001:db8:99:10::/64 heeft?

    ### Deel 4 - Hostroute
    1. Zorg dat HQ verkeer naar alleen de camerarecorder (2001:db8:22:20::50) over de **backuplijn** stuurt.
    2. Toon met een traceroute vanaf PC1 naar CAM en naar PC2 aan dat de pakketten een andere lijn nemen.
    3. De route naar het vestigings-LAN komt uit OSPF (AD 110), de hostroute is statisch (AD 1). Is de AD de reden dat de hostroute wint? Leg uit.

    ### Deel 5 - Floating static achter OSPFv3
    1. Configureer reserveroutes over de backuplijn:
       - op HQ naar het vestigings-LAN (2001:db8:22:20::/64);
       - op VESTIGING een reserve-default route.
       Kies een administratieve afstand die **hoger** is dan die van OSPF.
    2. Waarom zou AD 100 hier niet werken? Wat zou er dan gebeuren?
    3. **Failovertest.** Stop in CML de link van de **hoofdlijn** (rechtermuisknop op de link, *Stop*). De interfaces blijven up, maar OSPFv3 merkt na de dead time (ongeveer 40 seconden) dat de buur weg is.
       - Volg op HQ met `show ipv6 ospf neighbor` en `show ipv6 route` wat er gebeurt.
       - Werkt PC2 → PC1 en PC2 → 2001:db8:f00d::1 nog? Over welke lijn?
       - Start de link weer en controleer dat de OSPF-routes terugkomen en de reserveroutes uit de tabel verdwijnen.
    4. Waar zie je de reserveroutes als ze niet actief zijn? (`show running-config | include ipv6 route`)

    ## Reflectie
    1. Wat zijn de verschillen tussen een statische IPv6-route en een statische IPv4-route? Noem er minstens twee.
    2. Waarom is een link-local next hop handig, maar ook lastiger?
    3. In lab 3.2.1 moest je voor de failovertest op beide routers een interface uitzetten. Waarom was dat hier niet nodig?

    Je docent bespreekt daarna je antwoorden.
  title: Lab 3.2.2 - Dezelfde kaart in IPv6
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
