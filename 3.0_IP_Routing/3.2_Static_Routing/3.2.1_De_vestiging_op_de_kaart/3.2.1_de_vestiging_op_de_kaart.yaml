lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 3.2. Configuratielab IPv4: netwerkroute,
    default route, hostroute en floating static.'
  notes: |-
    # Lab 3.2.1 - De vestiging op de kaart

    **Leerdoel (CCNA 200-301 v2.0, 3.2):** statische routering voor IPv4 configureren en troubleshooten: default route, netwerkroute, hostroute en floating static.

    ## Scenario
    Een bedrijf opent een nieuwe vestiging. De routers HQ en VESTIGING zijn al bekabeld en alle interfaces hebben een adres, maar er staat nog **geen enkele route** in. Er zijn twee lijnen tussen HQ en de vestiging:
    - de **hoofdlijn** (glasvezel), voor al het normale verkeer;
    - de **backuplijn** (4G met onbeperkt data), alleen als reserve, met één uitzondering: de **camerarecorder** (CAM, 10.21.20.50) stuurt zijn beelden altijd over de backuplijn, zodat de hoofdlijn niet volloopt.

    HQ is via de ISP verbonden met het **echte internet** (testadres 8.8.8.8). NAT op HQ is al geconfigureerd.

    Dit is een **configuratielab**: er zit niets kapot, je bouwt de routering zelf op.

    ## Topologie
    | Apparaat | Interface | IPv4 | Opmerking |
    |---|---|---|---|
    | PC1 | eth0 | 10.21.10.11/24 | gateway 10.21.10.1 |
    | PC2 | eth0 | 10.21.20.11/24 | gateway 10.21.20.1 |
    | CAM | eth0 | 10.21.20.50/24 | camerarecorder, gateway 10.21.20.1 |
    | HQ | E0/0 | 10.21.10.1/24 | LAN hoofdkantoor |
    | HQ | E0/1 | 10.21.255.1/30 | hoofdlijn |
    | HQ | E0/2 | 10.21.255.5/30 | backuplijn |
    | HQ | E0/3 | 198.51.100.22/30 | naar ISP (198.51.100.21) |
    | VESTIGING | E0/0 | 10.21.20.1/24 | LAN vestiging |
    | VESTIGING | E0/1 | 10.21.255.2/30 | hoofdlijn |
    | VESTIGING | E0/2 | 10.21.255.6/30 | backuplijn |

    De ISP-router is van de provider: bekijken mag, aanpassen niet.

    ## Inloggen
    - Routers: console, geen wachtwoord.
    - PC's en CAM (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Opdrachten
    Gebruik bij elke route een **next hop-adres**, tenzij de opdracht iets anders vraagt. Controleer na elke stap de routeringstabel en test met ping of traceroute.

    ### Deel 1 - Uitgangssituatie
    1. Bekijk de routeringstabellen van HQ en VESTIGING. Welke routes staan er al en waarom precies deze?
    2. Ping van PC1 naar PC2 en van PC2 naar 8.8.8.8. Verklaar het resultaat.

    ### Deel 2 - Netwerkroutes
    1. Zorg dat HQ het LAN van de vestiging kent, via de hoofdlijn.
    2. Zorg dat VESTIGING het LAN van het hoofdkantoor kent, via de hoofdlijn.
    3. Test PC1 ↔ PC2. Welke code, AD en metric hebben je routes in de tabel?

    ### Deel 3 - Default routes
    1. Geef HQ een default route naar de ISP.
    2. De vestiging heeft maar één uitgang: HQ. Vervang de netwerkroute van stap 2.2 **niet**, maar geef VESTIGING een default route via de hoofdlijn.
    3. Test vanaf PC2 naar 8.8.8.8. Wat is nu de gateway of last resort van beide routers?
    4. Is de netwerkroute van stap 2.2 op VESTIGING nu nog nodig? Leg uit.

    ### Deel 4 - Hostroute
    1. Zorg dat HQ verkeer naar **alleen de camerarecorder** (10.21.20.50) over de **backuplijn** stuurt. Al het andere verkeer naar de vestiging blijft over de hoofdlijn gaan.
    2. Toon met een traceroute vanaf PC1 naar CAM en naar PC2 aan dat beide pakketten een andere lijn nemen.
    3. Waarom wint de hostroute, terwijl de netwerkroute ook past?

    ### Deel 5 - Floating static routes
    1. Configureer **reserveroutes** over de backuplijn, die alleen actief worden als de hoofdlijn wegvalt:
       - op HQ naar het LAN van de vestiging;
       - op VESTIGING als reserve-default route.
       Gebruik administratieve afstand **200**.
    2. Staan de reserveroutes in de routeringstabel? Waar kun je ze wel terugvinden? (Tip: `show running-config | include ip route`.)
    3. **Failovertest.** In CML merkt een router niet dat een link is gestopt (de interface blijft up). Simuleer daarom de uitval van de hoofdlijn door op **beide** routers interface E0/1 uit te zetten.
       - Bekijk de tabellen. Welke routes zijn verdwenen en welke zijn erbij gekomen?
       - Werkt PC2 → PC1 en PC2 → 8.8.8.8 nog? Over welke lijn?
       - Zet E0/1 op beide routers weer aan en controleer dat de reserveroutes weer uit de tabel verdwijnen.
    4. Waarom zou het fout gaan als je maar op één router de interface uitzet? (Denk aan het terugverkeer.)

    ### Deel 6 - Next hop, uitgaande interface of allebei?
    1. Voeg op VESTIGING tijdelijk een default route toe die alleen een **uitgaande interface** gebruikt (E0/1), zonder next hop. Welke melding geeft IOS?
    2. Hoe ziet die route eruit in de tabel? Ping vanaf VESTIGING naar 8.8.8.8 en bekijk daarna de ARP-tabel. Wat valt op, en welk mechanisme op HQ maakt dit mogelijk?
    3. Verwijder de tijdelijke route weer.
    4. Wat is een **fully specified** statische route, en wanneer is die nodig?

    ## Reflectie
    1. Wanneer kies je voor een netwerkroute en wanneer voor een default route?
    2. Waarom kreeg de floating static AD 200 en niet bijvoorbeeld 1 of 255?
    3. Noem een nadeel van statische routering ten opzichte van een routeringsprotocol, dat je in deel 5 tegenkwam.

    Je docent bespreekt daarna je antwoorden.
  title: Lab 3.2.1 - De vestiging op de kaart
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
