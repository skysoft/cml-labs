lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 3.4. Onderzoekslab VRRP: status lezen,
    owner, preemption, failover en vergelijking met HSRP.'
  notes: |-
    # Lab 3.4.2 - VRRP naast HSRP

    **Leerdoel (CCNA 200-301 v2.0, 3.4):** de operationele status van First Hop Redundancy Protocols (HSRP en VRRP) interpreteren.

    ## Scenario
    Dezelfde opzet als in lab 3.4.1: twee routers (R1 en R2) die samen de gateway verzorgen. Dit keer zijn er **drie** LAN's:
    - **LAN-H** gebruikt **HSRP** (zoals in 3.4.1), ter vergelijking;
    - **LAN-V** gebruikt **VRRP**, met een apart virtueel adres;
    - **LAN-O** gebruikt **VRRP**, waarbij het virtuele adres gelijk is aan het echte adres van één van de routers.

    Alles is al geconfigureerd, en via EDGE is er **echt internet** (8.8.8.8). Dit is een **onderzoekslab**.

    ## Topologie
    | Netwerk | R1 | R2 | Virtueel IP (gateway) | Host |
    |---|---|---|---|---|
    | LAN-H 10.42.10.0/24 | E0/0 .2 | E0/0 .3 | 10.42.10.1 (HSRP groep 10) | PC1 .11 |
    | LAN-V 10.42.30.0/24 | E0/1 .2 | E0/1 .3 | 10.42.30.1 (VRRP groep 30) | PC3 .11 |
    | LAN-O 10.42.40.0/24 | E0/3 **.3** | E0/3 **.2** | 10.42.40.2 (VRRP groep 40) | PC4 .11 |
    | Uplink naar EDGE | E0/2 10.42.255.2/30 | E0/2 10.42.255.6/30 | - | - |

    ## Inloggen
    - Routers: console, geen wachtwoord.
    - PC's (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Opdrachten

    ### Deel 1 - De VRRP-status lezen
    1. Bekijk `show vrrp brief` op R1 en R2. Vul in:

    | LAN | Groep | Master | Backup | Virtueel IP | Prioriteit R1 / R2 | Owner? |
    |---|---|---|---|---|---|---|
    | LAN-V | | | | | | |
    | LAN-O | | | | | | |

    2. Bekijk `show vrrp` (uitgebreid). Zoek op: de state, het **virtuele MAC-adres**, de advertisement interval, de "master down interval" en of preemption aan staat.
    3. Hoe is het groepsnummer in het virtuele MAC-adres van VRRP verwerkt? Vergelijk het met het MAC-adres van HSRP-groep 10 (`show standby`).
    4. Preemption: in de configuratie van VRRP staat geen `preempt`, bij HSRP wel. Wat betekent dat? Controleer met `show vrrp`.

    ### Deel 2 - De owner
    1. Op LAN-O is het virtuele adres 10.42.40.2 gelijk aan het echte adres van R2. Welke prioriteit heeft R2 voor groep 40, en waarom? (Je hebt die nergens ingesteld.)
    2. Welke router is master voor LAN-O? Kan dat volgens de VRRP-regels ook anders?
    3. Bestaat zo'n "owner"-constructie ook bij HSRP?

    ### Deel 3 - Failover bij VRRP
    1. Start op PC3 een doorlopende ping naar 8.8.8.8. Zet op **R1** interface E0/1 (LAN-V) uit.
    2. Hoeveel pings gingen er verloren? Waarom zo weinig? Hoe lang zou het duren als R1 zou crashen in plaats van netjes de interface uit te zetten (kijk naar de "Master Down interval")? Vergelijk met de hold time van HSRP (lab 3.4.1).
    3. Zet E0/1 weer aan. Wordt R1 weer master? Waarom wel, zonder dat er `preempt` in de configuratie staat?
    4. Zet nu op **R2** interface E0/3 (LAN-O) uit en weer aan. Wat zie je bij groep 40 op R1 tijdens en na de storing?

    ### Deel 4 - HSRP en VRRP vergeleken
    Vul de tabel in op basis van wat je in dit lab en in lab 3.4.1 hebt gezien:

    | Kenmerk | HSRP | VRRP |
    |---|---|---|
    | Standaard (Cisco of open) | | |
    | Namen van de states (actief/reserve) | | |
    | Virtueel MAC-adres (formaat) | | |
    | Standaard hello/advertisement-interval | | |
    | Preemption standaard aan? | | |
    | Virtueel IP mag gelijk zijn aan een echt routeradres? | | |
    | Standaardprioriteit | | |

    ### Deel 5 - Load sharing
    1. Welke router stuurt het verkeer van elk van de drie LAN's naar buiten? Controleer met een traceroute vanaf PC1, PC3 en PC4.
    2. Waarom is dit een goede verdeling? Hoe zou je hetzelfde bereiken als alle LAN's HSRP gebruikten?

    ## Reflectie
    1. Een router meldt in `show vrrp brief` voor dezelfde groep "Master", en de andere router ook. Wat kan er aan de hand zijn?
    2. Waarom zou een bedrijf VRRP kiezen in plaats van HSRP?

    Je docent bespreekt daarna je antwoorden.
  title: Lab 3.4.2 - VRRP naast HSRP
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
