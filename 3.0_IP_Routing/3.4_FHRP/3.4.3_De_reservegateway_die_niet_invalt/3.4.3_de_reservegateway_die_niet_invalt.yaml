lab:
  description: CCNA 200-301 v2.0 - leerdoel 3.4. Troubleshootinglab met 5 fouten in
    HSRP/VRRP, gevonden door de status te interpreteren.
  notes: |-
    # Lab 3.4.3 - De reservegateway die niet invalt

    **Leerdoel (CCNA 200-301 v2.0, 3.4):** de operationele status van First Hop Redundancy Protocols (HSRP en VRRP) interpreteren.

    ## Scenario
    Een bureau heeft twee routers (R1 en R2) die samen de gateway verzorgen voor twee LAN's. Een externe partij heeft HSRP en VRRP ingericht. Bij de jaarlijkse failovertest ging het mis, en de monitoring laat vreemde dingen zien.

    **Er zitten 5 fouten in dit lab.** Alle fouten hebben te maken met de gatewayredundantie. Je vindt ze door de HSRP- en VRRP-status en de logs te interpreteren en te vergelijken met het ontwerp.

    ## Klachten
    1. De monitoring meldt voor LAN-B twee routers in de state **Master**.
    2. Op R2 verschijnen regelmatig logmeldingen over HSRP.
    3. Bij de failovertest (de uplink van R1 uitgezet met `shutdown` op R1 E0/2) had LAN-A geen of nauwelijks internet.
    4. De gebruiker van PC2 meldt dat hij als enige op LAN-A bij elke storing aan R1 zonder internet zit, ook als de rest van LAN-A gewoon werkt.

    ## Ontwerp
    | | LAN-A 10.43.10.0/24 | LAN-B 10.43.30.0/24 |
    |---|---|---|
    | Protocol | HSRP versie 1, groep **10** | VRRP groep **30** |
    | Virtueel IP (gateway van alle pc's) | **10.43.10.1** | **10.43.30.1** |
    | Actief / master | **R1** (prioriteit 110, preempt) | **R2** (prioriteit 110) |
    | Reserve | R2 (prioriteit 100, **preempt**) | R1 (prioriteit 100) |
    | Tracking | R1 volgt zijn uplink (E0/2); valt die weg, dan moet R2 het overnemen | - |
    | Echte adressen | R1 .2, R2 .3 | R1 .2, R2 .3 |
    | Hosts | PC1 .11, PC2 .12 | PC3 .11 |

    R1 en R2 zijn via hun uplink (E0/2) verbonden met EDGE, die toegang geeft tot het echte internet (8.8.8.8). R1, R2 en EDGE gebruiken OSPF; dat is correct en hoort niet bij de fouten.

    **Failovertest:** zet op R1 de uplink E0/2 uit (`shutdown`) en controleer of LAN-A via R2 het internet bereikt. Zet de uplink daarna weer aan.

    ## Inloggen
    - Routers: console, geen wachtwoord.
    - PC's (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Opdracht
    1. Zoek en herstel de 5 fouten. Houd een **foutenlog** bij:

    | # | Apparaat | Wat zag je (status, log, ARP, traceroute)? | Oorzaak | Oplossing (commando's) | Hoe geverifieerd |
    |---|---|---|---|---|---|

    2. Voer na afloop de failovertest uit en toon aan dat PC1 én PC2 via R2 het internet bereiken.

    ## Reflectie
    1. Welke fout was alleen tijdens de failovertest te zien, en niet in de normale situatie? Waarom?
    2. Welke `show`-uitvoer vond je het nuttigst om de fouten te vinden?

    Je docent bespreekt daarna je foutenlog.
  title: Lab 3.4.3 - De reservegateway die niet invalt
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
