lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 3.4. Onderzoekslab HSRP: status lezen,
    virtueel MAC (v1/v2), failover, preempt en tracking.'
  notes: |-
    # Lab 3.4.1 - Twee routers, één gateway

    **Leerdoel (CCNA 200-301 v2.0, 3.4):** de operationele status van First Hop Redundancy Protocols (HSRP en VRRP) interpreteren.

    ## Scenario
    Een kantoor heeft twee LAN's (LAN-A en LAN-B). Elk LAN is aangesloten op **twee routers** (R1 en R2). De pc's hebben maar **één** default gateway: een **virtueel** IP-adres dat via **HSRP** door één van beide routers wordt verzorgd. Valt die router uit, dan neemt de andere het over, zonder dat de pc's iets merken.

    HSRP is al volledig geconfigureerd, en via EDGE is er **echt internet** (testadres 8.8.8.8). Dit is een **onderzoekslab**: je leest de status, verklaart wat je ziet en doet proeven.

    ## Topologie
    | Netwerk | R1 | R2 | Virtueel IP (gateway) | Hosts |
    |---|---|---|---|---|
    | LAN-A 10.41.10.0/24 | E0/0 .2 | E0/0 .3 | 10.41.10.1 | PC1 .11, PC2 .12 |
    | LAN-B 10.41.20.0/24 | E0/1 .2 | E0/1 .3 | 10.41.20.1 | PC3 .11 |
    | Uplink naar EDGE | E0/2 10.41.255.2/30 | E0/2 10.41.255.6/30 | - | - |

    R1, R2 en EDGE gebruiken OSPF voor de routering; dat is niet het onderwerp van dit lab.

    ## Inloggen
    - Routers: console, geen wachtwoord.
    - PC's (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Opdrachten

    ### Deel 1 - De status lezen
    1. Bekijk `show standby brief` op R1 en R2. Vul per LAN in:

    | LAN | Groep | Active router | Standby router | Virtueel IP | Prioriteit R1 / R2 | Preempt R1 / R2 |
    |---|---|---|---|---|---|---|
    | LAN-A | | | | | | |
    | LAN-B | | | | | | |

    2. Bekijk `show standby` (uitgebreid) op R1. Zoek op: de state, het **virtuele MAC-adres** van beide groepen, de hello- en hold-time, en hoe lang geleden de laatste state-wijziging was.
    3. LAN-A gebruikt HSRP **versie 1**, LAN-B **versie 2**. Waaraan zie je dat in het virtuele MAC-adres? Hoe is het groepsnummer in het MAC-adres verwerkt?
    4. Waarom is R1 actief voor LAN-A en R2 voor LAN-B? Wat is het voordeel van deze verdeling?

    ### Deel 2 - Wat ziet de pc?
    1. Ping vanaf PC1 naar 8.8.8.8 en bekijk daarna de ARP-tabel van PC1 (`ip neigh`). Welk MAC-adres hoort bij de gateway 10.41.10.1?
    2. Doe een traceroute vanaf PC1 naar 8.8.8.8. Welk adres zie je als eerste hop: het virtuele of een echt adres? Welke router is het?
    3. Waarom gebruikt HSRP een virtueel MAC-adres en niet het MAC-adres van de actieve router?

    ### Deel 3 - De actieve router valt uit
    **A. Netjes uitzetten**
    1. Start op PC1 een doorlopende ping naar 8.8.8.8 (`ping 8.8.8.8`, stoppen met Ctrl+C).
    2. Zet op **R1** interface E0/0 (LAN-A) uit met `shutdown`. Hoeveel pings gingen er verloren? Wat zegt `show standby brief` op R2 nu?
    3. Zet E0/0 op R1 weer aan. Wat gebeurt er, en welke instelling zorgt daarvoor?

    **B. Een crash**
    1. Start opnieuw een doorlopende ping op PC1. **Stop** nu router R1 in CML (rechtermuisknop op R1, *Stop*): dat is alsof de stroom eraf gaat.
    2. Hoeveel pings gingen er nu verloren? Welke HSRP-timer bepaalt dat?
    3. Verklaar het verschil met A. (Tip: wat kan een router nog doen vlak voordat je een interface uitzet, en wat niet als hij crasht?)
    4. Start R1 weer in CML. Volg op R2 met `show logging | include HSRP` wat er gebeurt als R1 terug is.

    ### Deel 4 - Zonder preempt
    1. Zet op R1 preemption voor groep 10 uit (`no standby 10 preempt`). Herhaal deel 3.
    2. Welke state heeft R1 nu als hij terugkomt, ondanks zijn hogere prioriteit? Leg uit.
    3. Zet preemption weer aan. Wat gebeurt er direct?

    ### Deel 5 - Tracking
    1. Bekijk in `show standby` op R1 het onderdeel over **tracking**. Wat wordt er gevolgd, en met hoeveel daalt de prioriteit als het volgobject down gaat?
    2. Zet op **R1** de uplink (E0/2) uit. Hoe verandert de status op R1 en R2? Bereken de nieuwe prioriteit van R1.
    3. Waarom is dit nuttig? Wat zou er zonder tracking gebeuren met het verkeer van LAN-A?
    4. Waarom moet **R2** preemption aan hebben om hier het werk over te nemen?
    5. Zet de uplink weer aan en controleer dat R1 weer actief wordt.

    ## Reflectie
    1. Welke HSRP-states heb je in dit lab gezien? Welke states bestaan er nog meer, en wanneer zie je die?
    2. Een collega ziet in `show standby brief` bij beide routers "Active". Wat is er waarschijnlijk aan de hand?
    3. Hoe kun je met alleen `show`-commando's vaststellen welke router op dit moment het verkeer van een LAN naar buiten stuurt?

    Je docent bespreekt daarna je antwoorden.
  title: Lab 3.4.1 - Twee routers, een gateway
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
