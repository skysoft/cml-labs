      LAB 1.3.2 - STORING KANTOOR EN SERVERRUIMTE
      Adresplan:
       LAN-A 172.16.1.0/24 (GW R1 .1)  PC1 .11  PC2 .12  PC3 .13
       LAN-B 172.16.2.0/24 (GW R2 .1)  SRV1 .10  PC4 .20
       WAN   10.0.12.0/30  R1 .1 - R2 .2
