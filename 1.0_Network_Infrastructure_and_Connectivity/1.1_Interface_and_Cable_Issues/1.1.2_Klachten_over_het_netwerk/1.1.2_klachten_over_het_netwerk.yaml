lab:
  description: CCNA 200-301 v2.0 - leerdoel 1.1. Troubleshooting interfaces en kabels
    (5 fouten).
  notes: |-
    # Lab 1.1.2 - Klachten over het netwerk

    **Leerdoel (CCNA 200-301 v2.0, 1.1):** interface- en kabelproblemen diagnosticeren.

    ## Scenario
    Na een verbouwing zijn er bij de servicedesk meerdere meldingen binnengekomen. De monteurs hebben kabels verlegd, en de afdeling heeft zelf een switch in de vergaderzaal neergezet. In het netwerk zitten **5 fouten** op laag 1 en 2 (interface en kabel). Vind ze, los ze op en documenteer ze.

    ## Topologie (alles in VLAN 10, 10.12.10.0/24)
    | Apparaat | Poort | Hoort aangesloten op |
    |---|---|---|
    | R1 (gateway .1) | E0/0 | SW-KERN Gi0/0 |
    | SW-KERN (.2, IOSvL2) | Gi0/1 | SW-VERDIEPING Gi0/0 (uplink A) |
    | SW-KERN | Gi0/2 | SW-VERDIEPING Gi0/1 (reserve-uplink, kabel ligt er, poorten staan uit) |
    | SW-KERN | Gi0/3 | SW-MAGAZIJN E0/0 |
    | SW-VERDIEPING (.3, IOSvL2) | Gi0/2 | PC-VERD1 (.21) |
    | SW-VERDIEPING | Gi1/0 | PC-VERD2 (.22) |
    | SW-VERDIEPING | Gi1/1 | SW-ZAAL (afdelingsswitch), met daarachter PC-ZAAL (.23) |
    | SW-MAGAZIJN (.4, IOL-L2) | E0/1 / E0/2 | PC-MAG1 (.31) / PC-MAG2 (.32) |

    **SW-KERN en SW-VERDIEPING starten langzaam** (IOSvL2, ongeveer 5 minuten).

    **Over het applet `OPSTART-SVI`:** dit EEM-applet in de configuratie van de switches hoort bij de virtuele omgeving. Het zet de beheer-SVI na het opstarten aan. Het is geen fout; laat het staan.

    De afdelingsswitch SW-ZAAL is goedgekeurd: de poort ervoor hoort gewoon te werken.

    ## Inloggen
    - Switches en router: console, geen wachtwoord.
    - Pc's (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    **Een kabel omzetten:** in CML kun je een link verwijderen en een nieuwe link tekenen (ook terwijl het lab draait). Dat mag, maar je kunt een probleem vaak ook in de configuratie oplossen. Beschrijf wat je zou doen in een echt gebouw.

    ## Meldingen
    1. "Op de verdieping valt de verbinding steeds weg: pings naar de gateway gaan voor de helft verloren." (PC-VERD1)
    2. "PC-VERD2 heeft sinds de verbouwing helemaal geen netwerk."
    3. "In de vergaderzaal werkt niets." (PC-ZAAL)
    4. "PC-MAG1 in het magazijn heeft geen verbinding; PC-MAG2 naast hem wel."
    5. "De monitoring geeft steeds een waarschuwing over de verbinding tussen SW-KERN en het magazijn."

    ## Werkwijze
    Noteer per fout:
    | # | Apparaat/poort | Symptoom | Oorzaak | Oplossing | Hoe getest |
    |---|---|---|---|---|---|
    | 1 | | | | | |
    | 2 | | | | | |
    | 3 | | | | | |
    | 4 | | | | | |
    | 5 | | | | | |

    **Nuttige commando's:**
    - `show interfaces status`, `show interfaces status err-disabled`, `show ip interface brief`
    - `show interfaces <poort>` (let op duplex, speed en tellers), `show interfaces counters errors`
    - `show cdp neighbors`, `show mac address-table`
    - `show logging`
    - op een pc: `ping -c 20 10.12.10.1`, `ip link show eth0`

    **Tip bij melding 1:** in CML lopen de fouttellers (CRC, input errors) niet op zoals bij een echte kabel. Je ziet alleen het pakketverlies. Bepaal door gericht te testen **waar** het verlies zit: welke verbindingen gebruikt het verkeer, en vanaf welke switch is het verlies er wel en niet?

    ## Eindcontrole
    - Alle pc's pingen de gateway 10.12.10.1 twintig keer zonder verlies.
    - `show logging` geeft geen nieuwe duplex-meldingen meer.
    - Geen enkele poort staat nog err-disabled of onbedoeld uit.

    ## Reflectie
    1. Welke melding had in een echt gebouw ook in de tellers zichtbaar geweest, en in welke tellers?
    2. Welke fout zou je met een kabeltester hebben gevonden, en welke niet?

    Je docent bespreekt daarna je antwoorden.
  title: Lab 1.1.2 - Klachten over het netwerk
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
