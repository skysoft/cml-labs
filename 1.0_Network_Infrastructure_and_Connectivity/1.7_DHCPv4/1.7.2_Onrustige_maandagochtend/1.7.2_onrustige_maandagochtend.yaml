          hostname PC10
          USERNAME=cisco
          PASSWORD=cisco
          # standaard-DHCP-client van het image vervangen door een eigen aanvraag
          sed -i 's/iface eth0 inet dhcp/iface eth0 inet manual/' /etc/network/interfaces
          pkill udhcpc 2>/dev/null
          ip addr flush dev eth0
          ip link set dev eth0 up
          # DHCP-client na 90 s; zonder antwoord APIPA (169.254.0.0/16), net als Windows
          (sleep 90; udhcpc -i eth0 -n -q -t 10 -T 3 || ip addr add 169.254.$((RANDOM % 254 + 1)).$((RANDOM % 254 + 1))/16 dev eth0) &
