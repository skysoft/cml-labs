    rotation: 0
    text_bold: false
    text_content: |-
      LAB 1.7.2 - ONRUSTIGE MAANDAGOCHTEND
       R1 = gateway en DHCP-server voor alle VLAN's (trunk naar SW1)
       VLAN10 STAFF  172.17.10.0/24  PC10, PRN10 (vast .50)
       VLAN20 SALES  172.17.20.0/24  PC20
       VLAN30 GASTEN 172.17.30.0/24  GAST1-3
       DHCP-bereik per VLAN: .100 t/m .254, gateway .1
      Er zitten 3 fouten in dit netwerk. Vind ze, herstel ze
      en verifieer dat alle clients correct zijn ingesteld.
      Wacht na het starten ~2 minuten (clients vragen dan pas DHCP).
      Volledige opdracht: open de Lab Notes (tabblad Notes).
    text_font: monospace
    text_italic: false
    text_size: 12
    text_unit: pt
    thickness: 1
    type: text
    x1: -480.0
    y1: -330.0
    z_index: 1
