lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 1.7. Troubleshootlab: vind en herstel
    de storing zodat het netwerk weer overeenkomt met de documentatie.'
  notes: |-
    # Lab 1.7.2 - Onrustige maandagochtend

    **Leerdoel (CCNA 200-301 v2.0, 1.7):** DHCPv4-client, -server en -relay op IOS-apparaten troubleshooten.

    ## Scenario
    Router R1 routeert tussen drie VLAN's (router-on-a-stick) en is voor alle drie de **DHCP-server**. De netwerkprinter krijgt via een DHCP-reservering altijd hetzelfde adres. Op maandagochtend komen deze klachten binnen:
    - *PC20 (Sales):* "Ik heb wel een adres, maar ik kom nergens buiten mijn eigen afdeling."
    - *PC10 (Staff):* "Printen lukt niet meer, de printer staat niet op zijn vaste adres."
    - *Gasten:* "Eén van ons heeft geen netwerk, de anderen wel."

    De switch is correct geconfigureerd. Er zitten **3 fouten** in het netwerk.

    ## Ontwerp (klopt)
    | VLAN | Naam | Subnet | Gateway (R1) | DHCP-bereik | Clients |
    |---|---|---|---|---|---|
    | 10 | STAFF | 172.17.10.0/24 | E0/0.10 - 172.17.10.1 | .100 t/m .254 | PC10, PRN10 |
    | 20 | SALES | 172.17.20.0/24 | E0/0.20 - 172.17.20.1 | .100 t/m .254 | PC20 |
    | 30 | GASTEN | 172.17.30.0/24 | E0/0.30 - 172.17.30.1 | .100 t/m .254 | GAST1, GAST2, GAST3 |

    DNS-server voor alle pools: 8.8.8.8.

    Reservering: printer **PRN10** (MAC-adres 52:54:00:17:10:50) krijgt altijd **172.17.10.50**.

    ## Inloggen
    - R1 en SW1: console, geen wachtwoord.
    - Clients (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**. Gebruik `sudo` voor wijzigingen.
    - De clients vragen ongeveer 90 seconden na het opstarten een adres aan. Krijgen ze geen antwoord, dan kiezen ze (net als Windows) een 169.254.x.x-adres. Een nieuw adres aanvragen:
    ```
    sudo ip addr flush dev eth0 && sudo udhcpc -i eth0 -n -q
    ```

    ## Opdrachten

    ### Deel 1 - Documentatie analyseren
    1. Welke opties moet elke pool minimaal meegeven?
    2. Hoe herkent een IOS-DHCP-server een client voor een reservering (manual binding)? Welke twee manieren zijn er?

    ### Deel 2 - Baseline
    Noteer op elke client het IP-adres, het masker en de default gateway (`ip addr show eth0`, `ip route`). Ping vanaf elke client naar de eigen gateway en naar PC10.

    ### Deel 3 - Verkennen en vergelijken
    - R1: `show ip dhcp pool`, `show ip dhcp binding`, `show ip dhcp conflict`, `show ip dhcp server statistics`, `show running-config | section dhcp`
    - Debuggen kan met `debug ip dhcp server packet` (zet het daarna weer uit met `undebug all`).
    - Client: `ip link show eth0` (MAC-adres), `ip addr`, `ip route`

    ### Deel 4 - Fouten vinden en herstellen
    Noteer per fout: het symptoom, het commando waarmee je de fout vond, de oorzaak en de herstelcommando's. Vraag na elke wijziging op de betrokken client opnieuw een adres aan.

    Tip: een bestaande lease verwijder je op R1 met `clear ip dhcp binding <adres>` of `clear ip dhcp binding *`.

    ### Deel 5 - Verificatie
    - Elke client heeft een adres uit het juiste bereik, het juiste masker en de juiste gateway.
    - PRN10 heeft 172.17.10.50.
    - Alle clients kunnen elkaar pingen.

    ### Deel 6 - Reflectie
    1. Welke fouten heb je gevonden? Geef per fout het commando dat de doorslag gaf.
    2. Welke fout was het lastigst te vinden, en waarom?
    3. Waarom had maar één gast geen netwerk en de anderen wel?
    4. Hoe had deze storing voorkomen kunnen worden?

    Je docent bespreekt daarna nog een aantal verdiepingsvragen met je.
  title: Lab 1.7.2 - Onrustige maandagochtend
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
