annotations:
  - border_color: '#1F4E79'
    border_style: ''
    color: '#1F4E79'
    rotation: 0
    text_bold: false
    text_content: |-
      LAB 1.7.3 - FILIALEN ZONDER ADRES
       R-DC = centrale DHCP-server
       Filiaal 1 172.17.51.0/24 via R-BR1 (relay -> 10.71.1.1)
       Filiaal 2 172.17.52.0/24 via R-MID en R-BR2 (relay -> 10.71.2.1)
       Transit: 10.71.1.0/30, 10.71.2.0/30, 10.71.3.0/30
       DHCP-bereik per filiaal: .100 t/m .254, gateway .1
      Er zitten 3 fouten in dit netwerk. Vind ze, herstel ze
      en verifieer dat beide PC's een adres krijgen.
      Wacht na het starten ~2 minuten (PC's vragen dan pas DHCP).
      Volledige opdracht: open de Lab Notes (tabblad Notes).
