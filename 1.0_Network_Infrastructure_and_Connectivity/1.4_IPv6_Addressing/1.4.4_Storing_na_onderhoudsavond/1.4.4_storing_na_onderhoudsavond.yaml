      LAB 1.4.4 - STORING NA ONDERHOUDSAVOND
       LAN-A 2001:db8:4:a::/64  R1 ::1 (LL FE80::1)  PC1 ::11  PC2 ::12
       LAN-B 2001:db8:4:b::/64  R2 ::1 (LL FE80::1)  PC3 ::13  PC4 ::14
       WAN   2001:db8:4:ff::/64 R1 ::1 (FE80::1) - R2 ::2 (FE80::2)
       Hosts statisch, gateway = FE80::1
      Er zitten 3 fouten in dit netwerk. Vind ze, herstel ze
      en verifieer met een volledige pingmatrix.
      Volledige opdracht: open de Lab Notes (tabblad Notes).
      PC-login: cisco / cisco (sudo voor wijzigingen)
