    rotation: 0
    text_bold: false
    text_content: |-
      LAB 1.4.7 - ADRESPLAN NIEUWE VESTIGING
       Prefix van de vestiging: 2001:db8:acad::/48
       PC1 -- R1 -- R2 -- R3 -- PC3
                     |
                    PC2
       LAN's /64 (subnet-ID n0), links /127 uit :ffff::/64
       Zie de ontwerpregels in de Lab Notes
      Maak eerst het adresplan. Er zitten 3 fouten in dit
      netwerk. Vind ze, herstel ze en verifieer.
      Volledige opdracht: open de Lab Notes (tabblad Notes).
      Login PC's: cisco / cisco
    text_font: monospace
    text_italic: false
    text_size: 12
    text_unit: pt
    thickness: 1
    type: text
    x1: -460.0
    y1: -260.0
    z_index: 1
