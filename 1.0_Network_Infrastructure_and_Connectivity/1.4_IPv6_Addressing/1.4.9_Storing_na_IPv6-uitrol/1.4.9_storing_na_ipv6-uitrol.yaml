lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 1.4. Troubleshootlab: vind en herstel
    de storing zodat het netwerk weer overeenkomt met de documentatie.'
  notes: |-
    # Lab 1.4.9 - Storing na IPv6-uitrol

    **Leerdoel (CCNA 200-301 v2.0, 1.4):** IPv6-adresconfiguratie, -toewijzing en prefixgrootte troubleshooten.

    ## Scenario
    Een bedrijf met een hoofdkantoor (twee VLAN's achter R1, router-on-a-stick) en een filiaal (R2) werkte tot nu toe alleen met IPv4. Afgelopen week is IPv6 uitgerold: het netwerk is nu **dual-stack**. De IPv4-configuratie is ongewijzigd gebleven en werkt goed. Alle PC's krijgen hun IPv6-adres via SLAAC.

    Klachten na de uitrol:
    - *PC10 (Staff):* "IPv6 naar Sales en het filiaal werkt niet, IPv4 wel."
    - *PC20 (Sales):* "Ik heb geen IPv6-adres dat met 2001 begint."
    - *PC30 (filiaal):* "Ik heb ook geen IPv6-adres dat met 2001 begint."

    Er zitten **3 fouten** in het netwerk.

    ## Adresplan (de documentatie klopt)
    | Netwerk | IPv4 | IPv6 | Gateway (IPv4 / IPv6-adres router) |
    |---|---|---|---|
    | VLAN 10 Staff (R1 E0/0.10) | 192.168.10.0/24 | 2001:db8:9:10::/64 | 192.168.10.1 / 2001:db8:9:10::1 |
    | VLAN 20 Sales (R1 E0/0.20) | 192.168.20.0/24 | 2001:db8:9:20::/64 | 192.168.20.1 / 2001:db8:9:20::1 |
    | Filiaal (R2 E0/0) | 192.168.30.0/24 | 2001:db8:9:30::/64 | 192.168.30.1 / 2001:db8:9:30::1 |
    | WAN (R1 E0/1 - R2 E0/1) | 10.0.12.0/30 | 2001:db8:9:ff::/64 | R1 .1 / ::1, R2 .2 / ::2 |

    | Host | IPv4 | IPv6 |
    |---|---|---|
    | PC10 (VLAN 10) | 192.168.10.10/24 | SLAAC |
    | PC20 (VLAN 20) | 192.168.20.10/24 | SLAAC |
    | PC30 (filiaal) | 192.168.30.10/24 | SLAAC |

    Routing (statisch, IPv4 en IPv6 hetzelfde): R1 heeft een route naar het filiaal via R2, R2 heeft een default route naar R1.

    ## Inloggen
    - Routers en switch: console, geen wachtwoord.
    - PC's (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**. Gebruik `sudo` voor wijzigingen.

    ## Opdrachten

    ### Deel 1 - Documentatie analyseren
    Wat betekent dual-stack? Welke onderdelen van de configuratie van een router en een host moeten voor IPv6 apart geregeld worden, naast IPv4?

    ### Deel 2 - Baseline
    Maak twee pingmatrices tussen PC10, PC20 en PC30: één voor IPv4 en één voor IPv6. Gebruik voor IPv6 de adressen die de PC's werkelijk hebben, of ping de routeradressen uit het plan.

    ### Deel 3 - Verkennen en vergelijken
    Vergelijk per laag (IPv4 en IPv6) de werkelijke configuratie met het adresplan.
    - Router: `show ip interface brief`, `show ipv6 interface brief`, `show ipv6 interface <int>`, `show ip route`, `show ipv6 route`, `show ipv6 neighbors`, `show running-config`
    - PC: `ip -4 addr`, `ip -6 addr`, `ip -6 route`, `traceroute <bestemming>`

    Heb je iets aangepast op een router, zet dan op de PC de interface uit en weer aan. Daarbij verdwijnt de IPv4-default route, dus die moet je opnieuw zetten:
    ```
    sudo ip link set dev eth0 down && sudo ip link set dev eth0 up
    sudo ip route add default via <ipv4-gateway>
    ```

    ### Deel 4 - Fouten vinden en herstellen
    Noteer per fout: het symptoom, het commando waarmee je de fout vond, de oorzaak en de herstelcommando's.

    ### Deel 5 - Verificatie
    - De IPv4-pingmatrix is nog steeds volledig OK.
    - Alle PC's hebben een SLAAC-adres uit het juiste /64.
    - De IPv6-pingmatrix is volledig OK.

    ### Deel 6 - Reflectie
    1. Welke fouten heb je gevonden? Geef per fout het commando dat de doorslag gaf.
    2. Welke fout was het lastigst te vinden, en waarom?
    3. Werkte alles meteen nadat je één fout had opgelost, of kwam er daarna een nieuw probleem aan het licht? Leg uit.
    4. Hoe had deze storing voorkomen kunnen worden?

    Je docent bespreekt daarna nog een aantal verdiepingsvragen met je.
  title: Lab 1.4.9 - Storing na IPv6-uitrol
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
