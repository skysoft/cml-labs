      LAB 1.4.1 - MAGAZIJN ONBEREIKBAAR
      Adresplan (alles /64):
       LAN-A 2001:db8:1:a::/64  R1 ::1  PC1 ::10  PC2 ::20
       LAN-B 2001:db8:1:b::/64  R2 ::1  PC3 ::30  PC4 :1::40
       WAN   2001:db8:1:ff::/64 R1 ::1 - R2 ::2
