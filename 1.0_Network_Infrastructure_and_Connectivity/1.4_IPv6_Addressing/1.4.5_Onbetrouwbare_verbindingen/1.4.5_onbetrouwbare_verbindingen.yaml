lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 1.4. Troubleshootlab: vind en herstel
    de storing zodat het netwerk weer overeenkomt met de documentatie.'
  notes: |-
    # Lab 1.4.5 - Onbetrouwbare verbindingen

    **Leerdoel (CCNA 200-301 v2.0, 1.4):** IPv6-adresconfiguratie, -toewijzing en prefixgrootte troubleshooten.

    ## Scenario
    Het kantoor-LAN 2001:db8:5:1::/64 hangt aan router R1 via switch SW1. Alle hosts zijn statisch geconfigureerd, met gateway FE80::1. Het adres 2001:db8:5:ffff::1 op R1 (Loopback1) staat voor "het internet".

    Na een migratie komen vage klachten binnen:
    - *PC1:* "Sommige collega's bereik ik wel, andere niet, en de fileserver doet raar."
    - *PC2 of PC3:* "Mijn netwerk werkt niet, maar mijn collega heeft nergens last van."
    - *Meerdere gebruikers:* "Het internet werkt helemaal niet meer."

    Er zitten **3 fouten** in het netwerk.

    ## Adresplan (de documentatie klopt)
    | Apparaat | Interface | IPv6-adres | Gateway |
    |---|---|---|---|
    | R1 | E0/0 (LAN) | 2001:db8:5:1::1/64, link-local FE80::1 | - |
    | R1 | Loopback1 ("internet") | 2001:db8:5:ffff::1/128 | - |
    | PC1 | eth0 | 2001:db8:5:1::11/64 | FE80::1 |
    | PC2 | eth0 | 2001:db8:5:1::12/64 | FE80::1 |
    | PC3 | eth0 | 2001:db8:5:1::13/64 | FE80::1 |
    | PC4 | eth0 | 2001:db8:5:1::14/64 | FE80::1 |
    | SRV1 | eth0 | 2001:db8:5:1::50/64 (alleen dit adres) | FE80::1 |

    Ieder apparaat heeft precies **één** global unicast-adres. Router Advertisements staan op R1 bewust uit, omdat alle hosts statisch zijn.

    ## Inloggen
    - R1 en SW1: console, geen wachtwoord.
    - PC's en server (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**. Gebruik `sudo` voor wijzigingen.

    ## Opdrachten

    ### Deel 1 - Documentatie analyseren
    Beschrijf hoe een IPv6-host controleert of een adres al in gebruik is voordat hij het gaat gebruiken. Welke berichten worden daarbij verstuurd, en naar welk adres?

    ### Deel 2 - Symptomen verzamelen
    Ping vanaf elke host naar 2001:db8:5:ffff::1, SRV1 en de andere hosts. Noteer per test OK of FAIL.

    ### Deel 3 - Verkennen en vergelijken
    Maak een tabel met per host: de global adressen, hun status, het MAC-adres en de switchpoort. Vergelijk die met het adresplan.
    - Host: `ip -6 addr show eth0` (let op de statusvlaggen achter elk adres), `ip -6 route`, `ip -6 neigh`, `ip link show eth0`
    - R1: `show ipv6 interface brief`, `show ipv6 interface e0/0`, `show ipv6 neighbors`, `show logging`, `show running-config`
    - SW1: `show mac address-table`, `show interfaces status`

    ### Deel 4 - Fouten vinden en herstellen
    Noteer per fout: het symptoom, het commando waarmee je de fout vond, de oorzaak en de herstelcommando's.

    Handige commando's:
    ```
    # Linux-host
    sudo ip -6 addr add|del <adres>/<prefix> dev eth0
    sudo ip -6 route add|del default via fe80::1 dev eth0
    sudo ip link set dev eth0 down && sudo ip link set dev eth0 up   # adressen opnieuw laten controleren
    # R1: adres opnieuw laten controleren
    interface Ethernet0/0
     shutdown
     no shutdown
    ```

    ### Deel 5 - Verificatie
    - Op geen enkel apparaat heeft een adres nog een foutstatus.
    - Alle hosts kunnen elkaar, SRV1 en 2001:db8:5:ffff::1 pingen.
    - Ieder apparaat heeft precies het adres uit het adresplan.

    ### Deel 6 - Reflectie
    1. Welke fouten heb je gevonden? Geef per fout het commando dat de doorslag gaf.
    2. Welke fout was het lastigst te vinden, en waarom?
    3. Was de fout steeds op hetzelfde apparaat zichtbaar? Waar hangt dat van af?
    4. Hoe had deze storing voorkomen kunnen worden?

    Je docent bespreekt daarna nog een aantal verdiepingsvragen met je.
  title: Lab 1.4.5 - Onbetrouwbare verbindingen
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
