    text_content: |-
      LAB 1.4.3 - NIEUWE WERKPLEKKEN ZONDER ADRES
       LAN-A 2001:db8:3:a::/64  R1 ::1  PC1, PC2 via SLAAC
       LAN-B 2001:db8:3:b::/64  R1 ::1  PC3 via SLAAC
       LAN-C 2001:db8:3:c::/64  R2 ::1  PC4 via SLAAC
       Link  2001:db8:3:ff::/64 R1 ::1 - R2 ::2
      Er zitten 3 fouten in dit netwerk. Vind ze, herstel ze
      en verifieer dat elke PC een geldig adres heeft.
      Volledige opdracht: open de Lab Notes (tabblad Notes).
      Login PC's: cisco / cisco (sudo voor wijzigingen)
