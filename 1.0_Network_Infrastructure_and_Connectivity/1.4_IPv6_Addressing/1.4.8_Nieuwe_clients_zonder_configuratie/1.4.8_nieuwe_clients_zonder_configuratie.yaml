lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 1.4. Troubleshootlab: vind en herstel
    de storing zodat het netwerk weer overeenkomt met de documentatie.'
  notes: |-
    # Lab 1.4.8 - Nieuwe clients zonder configuratie

    **Leerdoel (CCNA 200-301 v2.0, 1.4):** IPv6-adresconfiguratie, -toewijzing en prefixgrootte troubleshooten.

    ## Scenario
    Een bedrijf heeft twee locaties. De clients in dit lab zijn IOS-apparaten (CL1 t/m CL3) die zich als eindapparaat gedragen: ze routeren niet en halen hun configuratie automatisch op.

    - **LAN-A (R1):** clients krijgen hun adres **en** DNS-gegevens via **stateful DHCPv6** van R1. SLAAC is op dit LAN bewust uitgeschakeld.
    - **LAN-B (R2):** clients maken hun adres zelf via **SLAAC** en halen alleen de DNS-gegevens via **stateless DHCPv6** bij R2.

    Klachten:
    - *CL1 en CL2:* "Na het opstarten hebben we geen bruikbaar IPv6-adres."
    - *CL3:* "Ik heb wel een adres, maar geen DNS-server en geen domeinnaam."

    Er zitten **3 fouten** in het netwerk.

    ## Adresplan (de documentatie klopt)
    | Apparaat | Interface | IPv6-adres | Opmerking |
    |---|---|---|---|
    | R1 | E0/0 (LAN-A) | 2001:db8:8:a::1/64 | DHCPv6-server, stateful (M-flag) |
    | R1 | E0/1 (WAN) | 2001:db8:8:ff::1/64 | |
    | R2 | E0/1 (WAN) | 2001:db8:8:ff::2/64 | |
    | R2 | E0/0 (LAN-B) | 2001:db8:8:b::1/64 | SLAAC + DHCPv6-server, stateless (O-flag) |
    | CL1, CL2 | E0/0 | via DHCPv6 uit 2001:db8:8:a::/64 | LAN-A |
    | CL3 | E0/0 | via SLAAC uit 2001:db8:8:b::/64 | LAN-B |

    DHCPv6-gegevens voor beide LAN's:
    - DNS-server: 2001:db8:8:a::53
    - Domeinnaam: korrel.lan

    Routing: R1 heeft een statische route naar LAN-B, R2 heeft een default route naar R1.

    ## Inloggen
    - Alle apparaten: console, geen wachtwoord.

    ## Opdrachten

    ### Deel 1 - Documentatie analyseren
    Leg uit wat de M-flag en de O-flag in een Router Advertisement betekenen. Welke combinatie hoort bij LAN-A en welke bij LAN-B?

    ### Deel 2 - Symptomen
    Noteer op elke client de uitvoer van `show ipv6 interface brief`, `show ipv6 interface e0/0` en `show ipv6 dhcp interface`. Ping vanaf elke client naar de gateway en naar de andere clients.

    ### Deel 3 - Verkennen en vergelijken
    Verzamel van elk apparaat de werkelijke configuratie en vergelijk die met het adresplan.
    - Router: `show ipv6 interface <int>` (let op de RA-gegevens), `show ipv6 dhcp pool`, `show ipv6 dhcp binding`, `show ipv6 dhcp interface`, `show running-config`, `show ipv6 route`
    - Client: `show ipv6 interface brief`, `show ipv6 dhcp interface`, `show ipv6 route`
    - Debuggen kan met `debug ipv6 dhcp` (zet het debuggen daarna weer uit met `undebug all`).

    Een client opnieuw laten beginnen:
    ```
    interface Ethernet0/0
     shutdown
     no shutdown
    ```

    ### Deel 4 - Fouten vinden en herstellen
    Noteer per fout: het symptoom, het commando waarmee je de fout vond, de oorzaak en de herstelcommando's. Test na elke wijziging opnieuw.

    ### Deel 5 - Verificatie
    - CL1 en CL2 hebben een adres uit 2001:db8:8:a::/64 en zijn te zien in `show ipv6 dhcp binding` op R1.
    - Alle clients tonen in `show ipv6 dhcp interface` de DNS-server 2001:db8:8:a::53 en het domein korrel.lan.
    - Alle clients kunnen elkaar pingen.

    ### Deel 6 - Reflectie
    1. Welke fouten heb je gevonden? Geef per fout het commando dat de doorslag gaf.
    2. Welke fout was het lastigst te vinden, en waarom?
    3. Werkte alles meteen nadat je één fout had opgelost, of kwam er daarna een nieuw probleem aan het licht? Leg uit.
    4. Hoe had deze storing voorkomen kunnen worden?

    Je docent bespreekt daarna nog een aantal verdiepingsvragen met je.
  title: Lab 1.4.8 - Nieuwe clients zonder configuratie
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
