    text_bold: false
    text_content: |-
      LAB 1.4.8 - NIEUWE CLIENTS ZONDER CONFIGURATIE
       LAN-A 2001:db8:8:a::/64  R1 ::1  stateful DHCPv6 (CL1, CL2)
       LAN-B 2001:db8:8:b::/64  R2 ::1  SLAAC + stateless DHCPv6 (CL3)
       WAN   2001:db8:8:ff::/64 R1 ::1 - R2 ::2
       DNS 2001:db8:8:a::53, domein korrel.lan
       CL1-CL3 = IOS-apparaten als client (geen routing)
      Er zitten 3 fouten in dit netwerk. Vind ze, herstel ze
      en verifieer dat alle clients volledig geconfigureerd zijn.
      Volledige opdracht: open de Lab Notes (tabblad Notes).
