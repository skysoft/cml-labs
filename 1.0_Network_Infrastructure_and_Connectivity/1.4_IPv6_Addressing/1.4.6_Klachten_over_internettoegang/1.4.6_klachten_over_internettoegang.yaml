      LAB 1.4.6 - KLACHTEN OVER INTERNETTOEGANG
       Bedrijfsprefix van ISP: 2001:db8:6::/48
       LAN-A 2001:db8:6:a::/64  PC1 (SLAAC), SRV-WEB ::80
       LAN-B 2001:db8:6:b::/64  PC2 (SLAAC)
       LAN-C 2001:db8:6:c::/64  PC3 (SLAAC)
       WAN 2001:db8:ffff:6::/64  ISP ::1 - R1 ::2
       "Internet": INET-PC 2001:db8:ffff:100::10
      Er zitten 3 fouten in dit netwerk. Vind ze, herstel ze
      en verifieer internettoegang in beide richtingen.
      Volledige opdracht: open de Lab Notes (tabblad Notes).
      Login hosts: cisco / cisco (sudo voor wijzigingen)
