lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 1.3. Troubleshootlab: vind en herstel
    de storing zodat het netwerk weer overeenkomt met de documentatie.'
  notes: |-
    # Lab 1.3.9 - Storing na opschoonactie

    **Leerdoel (CCNA 200-301 v2.0, 1.3):** IPv4-adresconfiguratie, -toewijzing en subnetting troubleshooten.

    ## Scenario
    Multilayer switch MLS1 verbindt vier afdelingen, elk in een eigen VLAN, en routeert zelf tussen de VLAN's. Er is geen aparte router. De gateway van elk VLAN is een SVI (`interface VlanX`) op MLS1.

    Na een "opschoonactie" van de configuratie werkt alleen HR nog goed:
    - *PC20 (IT):* "Ik bereik mijn gateway niet."
    - *PC30 (Finance):* "Ik bereik mijn gateway ook niet."
    - *PC40 (Guest):* "Niets werkt, zelfs de netwerkkaart lijkt geen verbinding te hebben."

    Er zitten **3 fouten** in het netwerk.

    ## Adresplan (de documentatie klopt)
    | VLAN | Naam | Subnet | SVI (gateway) | Poort | Host |
    |---|---|---|---|---|---|
    | 10 | HR | 10.10.10.0/24 | Vlan10 - 10.10.10.1 | E0/0 | PC10 - 10.10.10.10 |
    | 20 | IT | 10.10.20.0/24 | Vlan20 - 10.10.20.1 | E0/1 | PC20 - 10.10.20.10 |
    | 30 | FINANCE | 10.10.30.0/24 | Vlan30 - 10.10.30.1 | E0/2 | PC30 - 10.10.30.10 |
    | 40 | GUEST | 10.10.40.0/24 | Vlan40 - 10.10.40.1 | E0/3 | PC40 - 10.10.40.10 |

    Op MLS1 staat `ip routing` aan en VTP staat in **transparent**-modus.

    ## Inloggen
    - MLS1: console, geen wachtwoord.
    - PC's (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**. Gebruik `sudo` voor wijzigingen.

    ## Opdrachten

    ### Deel 1 - Documentatie analyseren
    Bereken voor elk subnet uit het adresplan het netwerkadres, het bruikbare bereik en het broadcastadres.

    ### Deel 2 - Baseline
    Ping vanaf elke PC naar de eigen gateway en naar PC10. Noteer OK of FAIL.

    ### Deel 3 - Verkennen en vergelijken
    Verzamel de werkelijke configuratie van MLS1 en de PC's, en vergelijk die met het adresplan.
    - MLS1: `show ip interface brief`, `show running-config`, `show vlan brief`, `show interfaces status`, `show interfaces <int> switchport`, `show ip route`
    - PC: `ip addr show eth0`, `ip route`

    ### Deel 4 - Fouten vinden en herstellen
    Noteer per fout: het symptoom, het commando waarmee je de fout vond, de oorzaak en de herstelcommando's.

    ### Deel 5 - Verificatie
    - Alle gateways uit het adresplan zijn bereikbaar.
    - `show ip route connected` toont alle vier de afdelingsnetwerken.
    - Alle PC's kunnen elkaar pingen.

    ### Deel 6 - Reflectie
    1. Welke fouten heb je gevonden? Geef per fout het commando dat de doorslag gaf.
    2. Welke fout was het lastigst te vinden, en waarom?
    3. Klopte de klacht van de gebruiker van PC40? Hoe heb je dat gecontroleerd?
    4. Hoe had deze storing voorkomen kunnen worden?

    Je docent bespreekt daarna nog een aantal verdiepingsvragen met je.
  title: Lab 1.3.9 - Storing na opschoonactie
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
