lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 1.3. Troubleshootlab: vind en herstel
    de storing zodat het netwerk weer overeenkomt met de documentatie.'
  notes: |-
    # Lab 1.3.7 - Gebruikers zonder netwerk

    **Leerdoel (CCNA 200-301 v2.0, 1.3):** IPv4-adresconfiguratie, -toewijzing en subnetting troubleshooten.

    ## Scenario
    Een bedrijf heeft twee locaties: LAN-A bij R1 en LAN-B bij R2. Alle PC's krijgen hun adres automatisch. Router R1 is de centrale DHCP-server voor beide locaties, en R2 stuurt de DHCP-verzoeken uit LAN-B door naar R1 (DHCP-relay).

    Na een onderhoudsbeurt melden **alle** gebruikers dat ze geen netwerk hebben. Op hun PC staat een adres dat begint met **169.254**.

    De PC's in dit lab gedragen zich zoals Windows-PC's.

    Er zitten **3 fouten** in het netwerk.

    ## Adresplan (de documentatie klopt)
    | Apparaat | Interface | IP-adres | Prefix | Opmerking |
    |---|---|---|---|---|
    | R1 | E0/0 (LAN-A) | 10.1.10.1 | /24 | DHCP-server |
    | R1 | E0/1 (WAN) | 10.255.12.1 | /30 | |
    | R2 | E0/1 (WAN) | 10.255.12.2 | /30 | |
    | R2 | E0/0 (LAN-B) | 10.1.20.1 | /24 | DHCP-relay naar 10.255.12.1 |
    | PC1, PC2 | eth0 | DHCP | /24 | LAN-A |
    | PC3, PC4 | eth0 | DHCP | /24 | LAN-B |

    DHCP-afspraken:
    | Pool | Netwerk | Uitgedeeld bereik | Default gateway |
    |---|---|---|---|
    | LAN-A | 10.1.10.0/24 | .100 t/m .254 | 10.1.10.1 |
    | LAN-B | 10.1.20.0/24 | .100 t/m .254 | 10.1.20.1 |

    ## Inloggen
    - Routers: console, geen wachtwoord.
    - PC's (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**. Gebruik `sudo` voor wijzigingen.

    ## Opdrachten

    ### Deel 1 - Documentatie analyseren
    Bereken voor elk subnet uit het adresplan het netwerkadres, het bruikbare bereik en het broadcastadres. Welke adressen deelt de DHCP-server volgens de afspraken wel en niet uit?

    ### Deel 2 - Symptomen
    Noteer op elke PC de uitvoer van `ip addr show eth0` en `ip route`. Probeer vanaf elke PC de eigen gateway te pingen.

    ### Deel 3 - Verkennen en vergelijken
    Verzamel van elk apparaat de werkelijke configuratie en vergelijk die met het adresplan en de DHCP-afspraken.
    - Router: `show ip interface brief`, `show running-config`, `show ip route`, `show ip dhcp pool`, `show ip dhcp binding`
    - Debuggen kan ook, bijvoorbeeld met `debug ip dhcp server events` en `debug ip dhcp server packet`. Zet het debuggen daarna weer uit met `undebug all`.

    Een nieuw adres aanvragen vanaf een PC:
    ```
    sudo ip addr flush dev eth0
    sudo udhcpc -i eth0 -n -q
    ```

    ### Deel 4 - Fouten vinden en herstellen
    Noteer per fout: het symptoom, het commando waarmee je de fout vond, de oorzaak en de herstelcommando's. Test na elke wijziging opnieuw.

    ### Deel 5 - Verificatie
    - Alle vier de PC's hebben een adres uit het juiste bereik en de juiste default gateway.
    - `show ip dhcp binding` op R1 toont vier leases.
    - PC1 kan PC3 pingen.

    ### Deel 6 - Reflectie
    1. Welke fouten heb je gevonden? Geef per fout het commando dat de doorslag gaf.
    2. Welke fout was het lastigst te vinden, en waarom?
    3. Werkte alles meteen nadat je één fout had opgelost, of kwam er daarna een nieuw probleem aan het licht? Leg uit.
    4. Hoe had deze storing voorkomen kunnen worden?

    Je docent bespreekt daarna nog een aantal verdiepingsvragen met je.
  title: Lab 1.3.7 - Gebruikers zonder netwerk
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
