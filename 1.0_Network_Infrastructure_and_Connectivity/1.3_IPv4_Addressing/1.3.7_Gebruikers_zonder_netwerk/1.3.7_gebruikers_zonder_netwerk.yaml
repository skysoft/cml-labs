    color: '#1F4E79'
    rotation: 0
    text_bold: false
    text_content: |-
      LAB 1.3.7 - GEBRUIKERS ZONDER NETWERK
       R1 = DHCP-server, R2 = DHCP-relay voor LAN-B
       LAN-A 10.1.10.0/24 (GW .1)  PC1, PC2 via DHCP
       LAN-B 10.1.20.0/24 (GW .1)  PC3, PC4 via DHCP
       WAN   10.255.12.0/30  R1 .1 - R2 .2
       DHCP-bereik per LAN: .100 t/m .254
      Er zitten 3 fouten in dit netwerk. Vind ze, herstel ze
      en verifieer dat alle PC's een juist adres krijgen.
      Volledige opdracht: open de Lab Notes (tabblad Notes).
      Login PC's: cisco / cisco (sudo voor wijzigingen)
