    rotation: 0
    text_bold: false
    text_content: |-
      LAB 1.3.5 - STORING NA WAN-MIGRATIE
       PC1 192.168.1.10 -- R1 .1 (192.168.1.0/24)
       R1 E0/1 10.0.0.1/30  <->  R2 E0/1 10.0.0.2/30
       R2 E0/2 10.0.0.4/31  <->  R3 E0/1 10.0.0.5/31
       PC3 192.168.3.10 -- R3 .1 (192.168.3.0/24)
      Er zitten 3 fouten in dit netwerk. Vind ze, herstel ze
      en verifieer met ping en traceroute van PC1 naar PC3.
      Volledige opdracht: open de Lab Notes (tabblad Notes).
      Login PC's: cisco / cisco
    text_font: monospace
    text_italic: false
    text_size: 12
    text_unit: pt
    thickness: 1
    type: text
    x1: -420.0
    y1: -250.0
    z_index: 1
