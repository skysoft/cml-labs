      LAB 1.3.1 - STORING KANTOOR EN MAGAZIJN
      Adresplan:
       LAN-A 192.168.10.0/26  (GW R1 .1)  PC1 .10  PC2 .40
       LAN-B 192.168.10.64/26 (GW R2 .65) PC3 .70  PC4 .100
