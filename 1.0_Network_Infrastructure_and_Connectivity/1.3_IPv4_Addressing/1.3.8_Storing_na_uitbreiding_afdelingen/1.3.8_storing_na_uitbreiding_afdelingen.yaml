lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 1.3. Troubleshootlab: vind en herstel
    de storing zodat het netwerk weer overeenkomt met de documentatie.'
  notes: |-
    # Lab 1.3.8 - Storing na uitbreiding afdelingen

    **Leerdoel (CCNA 200-301 v2.0, 1.3):** IPv4-adresconfiguratie, -toewijzing en subnetting troubleshooten.

    ## Scenario
    Een klein bedrijf heeft drie afdelingen, elk in een eigen VLAN op switch SW1. Router R1 routeert tussen de VLAN's via **router-on-a-stick**: één fysieke 802.1Q-trunk met een subinterface per VLAN.

    Onlangs zijn de afdelingen Sales en Printers toegevoegd. Sindsdien komen deze klachten binnen:
    - *PC10 (Staff):* "Ik bereik mijn gateway, maar niet de collega's van Sales en ook de printer niet."
    - *PC20 (Sales):* "Ik bereik helemaal niets, zelfs mijn gateway niet."
    - *PC30 (Printers):* "Geen verbinding met de gateway."

    Er zitten **3 fouten** in het netwerk.

    ## Adresplan (de documentatie klopt)
    | VLAN | Naam | Subnet | Gateway (R1 subinterface) | Host |
    |---|---|---|---|---|
    | 10 | STAFF | 192.168.10.0/24 | E0/0.10 - 192.168.10.1 | PC10 - 192.168.10.10 |
    | 20 | SALES | 192.168.20.0/24 | E0/0.20 - 192.168.20.1 | PC20 - 192.168.20.10 |
    | 30 | PRINTERS | 192.168.30.0/24 | E0/0.30 - 192.168.30.1 | PC30 - 192.168.30.30 |

    Switch SW1:
    | Poort | Modus | VLAN | Verbonden met |
    |---|---|---|---|
    | E0/0 | trunk (802.1Q) | 10, 20, 30 | R1 E0/0 |
    | E0/1 | access | 10 | PC10 |
    | E0/2 | access | 20 | PC20 |
    | E0/3 | access | 30 | PC30 |

    ## Inloggen
    - R1 en SW1: console, geen wachtwoord.
    - PC's (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**. Gebruik `sudo` voor wijzigingen.

    ## Opdrachten

    ### Deel 1 - Documentatie analyseren
    Bereken voor elk subnet uit het adresplan het netwerkadres, het bruikbare bereik en het broadcastadres. Teken de topologie met per link het VLAN, of bij een trunk de VLAN's.

    ### Deel 2 - Baseline
    Ping vanaf elke PC naar de eigen gateway en naar de andere twee PC's. Noteer OK of FAIL.

    ### Deel 3 - Verkennen en vergelijken
    Verzamel van elk apparaat de werkelijke configuratie en vergelijk die met het adresplan.
    - R1: `show ip interface brief`, `show running-config`, `show vlans`, `show ip route`
    - SW1: `show interfaces trunk`, `show vlan brief`, `show mac address-table`, `show running-config`
    - PC: `ip addr show eth0`, `ip route`, `ip neigh`

    ### Deel 4 - Fouten vinden en herstellen
    Noteer per fout: het symptoom, het commando waarmee je de fout vond, de oorzaak en de herstelcommando's.

    ### Deel 5 - Verificatie
    - Elke PC kan de eigen gateway pingen.
    - Alle PC's kunnen elkaar pingen.
    - `traceroute 192.168.30.30` vanaf PC10 toont één hop via 192.168.10.1.

    ### Deel 6 - Reflectie
    1. Welke fouten heb je gevonden? Geef per fout het commando dat de doorslag gaf.
    2. Welke fout was het lastigst te vinden, en waarom?
    3. Werkte alles meteen nadat je één fout had opgelost, of kwam er daarna een nieuw probleem aan het licht? Leg uit.
    4. Hoe had deze storing voorkomen kunnen worden?

    Je docent bespreekt daarna nog een aantal verdiepingsvragen met je.
  title: Lab 1.3.8 - Storing na uitbreiding afdelingen
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
