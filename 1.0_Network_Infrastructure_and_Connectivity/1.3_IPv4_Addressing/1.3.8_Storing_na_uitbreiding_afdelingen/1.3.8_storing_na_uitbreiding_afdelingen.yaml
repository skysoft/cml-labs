      LAB 1.3.8 - STORING NA UITBREIDING AFDELINGEN
       VLAN 10 STAFF    192.168.10.0/24  GW E0/0.10 .1  PC10 .10
       VLAN 20 SALES    192.168.20.0/24  GW E0/0.20 .1  PC20 .10
