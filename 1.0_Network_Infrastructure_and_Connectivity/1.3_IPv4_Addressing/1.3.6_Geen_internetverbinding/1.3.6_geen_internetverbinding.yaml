    text_bold: false
    text_content: |-
      LAB 1.3.6 - GEEN INTERNETVERBINDING
       Kantoor 172.20.10.0/24  (R1 .1)  PC1 .11  SRV-WEB .100
       Gasten  192.168.50.0/24 (R1 .1)  GUEST1 .20
       WAN 203.0.113.0/29: ISP .1, R1 .2 (PAT)
       SRV-WEB publiek: 203.0.113.3 (static NAT)
       "Internet": INET-PC 198.51.100.10
      Er zitten 3 fouten in dit netwerk. Vind ze, herstel ze
      en verifieer internettoegang in beide richtingen.
      Volledige opdracht: open de Lab Notes (tabblad Notes).
      Login hosts: cisco / cisco (sudo voor wijzigingen)
    text_font: monospace
    text_italic: false
    text_size: 12
    text_unit: pt
    thickness: 1
    type: text
    x1: -470.0
    y1: -270.0
    z_index: 1
