lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 4.5. Onderzoekslab remote access VPN:
    strongSwan-client naar een IOS IKEv2-headend, adres uit pool, NAT-T, split tunneling.'
  notes: |-
    # Lab 4.5.2 - Thuiswerken via de tunnel

    **Leerdoel (CCNA 200-301 v2.0, 4.5):** IPsec remote access- en site-to-site-VPN's beschrijven (protocollen en modes).

    ## Scenario
    Een medewerker werkt thuis op zijn laptop. Om bij de interne server (SRV, 10.82.10.10) te komen, start hij een **remote access VPN** naar de router van het hoofdkantoor (HQ). Op de laptop draait daarvoor VPN-clientsoftware (**strongSwan**, IKEv2 met pre-shared key). Het thuisnetwerk zit, zoals bij bijna iedereen, achter een router die **NAT** doet.

    De VPN is al ingericht. Dit is een **onderzoekslab**: je start de verbinding, bekijkt wat er gebeurt en vergelijkt het met de site-to-site-VPN uit lab 4.5.1.

    ## Topologie
    | Apparaat | Adres | Rol |
    |---|---|---|
    | LAPTOP | 192.168.1.10/24 (thuis) | VPN-client (strongSwan) |
    | THUISROUTER | 192.168.1.1 / 198.51.100.6 | thuisrouter met NAT |
    | INTERNET-R | 198.51.100.5 / 203.0.113.5 | "het internet" (met echt internet erachter) |
    | HQ | 203.0.113.6 / 10.82.10.1 | VPN-headend van het bedrijf |
    | SRV | 10.82.10.10/24 | intranetserver (poort 8080) |

    Na het starten installeert de laptop strongSwan via internet: wacht ongeveer **3 minuten**.

    **Labinstelling:** op HQ staat CEF uit (`no ip cef`). De virtuele router (IOL) stuurt anders doorgestuurd verkeer niet door de dynamische tunnel van een thuiswerker. Op echte apparatuur is dat niet nodig.

    ## Inloggen
    - Routers: console, geen wachtwoord.
    - LAPTOP en SRV (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**. De VPN-commando's op de laptop voer je uit met `sudo`.

    ## Opdrachten

    ### Deel 1 - Vóór de VPN
    1. Probeer vanaf de laptop de intranetserver te bereiken: `ping 10.82.10.10` en `wget -qO- http://10.82.10.10:8080`. Waarom lukt dat niet? (Kijk ook naar de routeringstabel van INTERNET-R.)
    2. Kan de laptop wel het internet op (`ping 8.8.8.8`)?

    ### Deel 2 - De VPN starten
    1. Start de verbinding op de laptop: `sudo swanctl --initiate --child bedrijf`. Lees de uitvoer: welke IKEv2-stappen (IKE_SA_INIT, IKE_AUTH) zie je?
    2. Bekijk `sudo swanctl --list-sas`. Welk **intern IP-adres** heeft de laptop gekregen, en van wie? Welke netwerken gaan door de tunnel?
    3. Bekijk op de laptop `ip addr` en `ip route show table 220`. Waar is het nieuwe adres gebleven, en welke route is erbij gekomen?
    4. Probeer de intranetserver opnieuw (ping en wget). Wat ziet SRV als bronadres?

    ### Deel 3 - De kant van het hoofdkantoor
    1. Bekijk op HQ `show crypto ikev2 sa` en `show crypto session`. Met welk IP-adres en welke poort is de laptop verbonden? Waarom is dat niet 192.168.1.10?
    2. Bekijk `show crypto ipsec sa`. Zoek de regel met **UDP-encapsulatie** / poort **4500**. Waarom gebruikt deze VPN NAT-T, en de VPN in lab 4.5.1 niet?
    3. Bekijk `show ip local pool` en `show ip interface brief | include Virtual`. Wat doet HQ met elke nieuwe thuiswerker?

    ### Deel 4 - Split tunneling
    1. Ping vanaf de laptop (met de VPN actief) naar 8.8.8.8 en doe een traceroute. Gaat dit verkeer door de tunnel of direct via de thuisrouter?
    2. Leg uit wat **split tunneling** is. Welke regel in de configuratie van de laptop (`/etc/swanctl/conf.d/bedrijf.conf`) en welke in die van HQ (`show running-config | section SPLIT|authorization policy`) bepalen dat?
    3. Noem een voordeel en een nadeel van split tunneling voor het bedrijf.

    ### Deel 5 - Verbreken
    1. Verbreek de verbinding: `sudo swanctl --terminate --ike bedrijf`. Wat gebeurt er op HQ met de sessie en met het virtuele interface?

    ### Deel 6 - Vergelijken
    | Kenmerk | Site-to-site (4.5.1) | Remote access (4.5.2) |
    |---|---|---|
    | Wie bouwt de tunnel op? | | |
    | Software op de pc van de gebruiker nodig? | | |
    | Wie krijgt een adres uit een pool? | | |
    | Achter NAT, dus NAT-T? | | |
    | Typisch aantal tunnels op het hoofdkantoor | | |

    | Kenmerk | IPsec remote access (zoals hier) | SSL/TLS-VPN (bijvoorbeeld Cisco Secure Client) |
    |---|---|---|
    | Protocol en poort | | |
    | Werkt via vrijwel elke firewall of hotspot? | | |
    | Clientloos via een browser mogelijk? | | |

    ## Reflectie
    1. Beschrijf in eigen woorden wat er gebeurt met een ping van de laptop naar SRV, vanaf het moment dat hij de laptop verlaat.
    2. Waarom kiezen veel bedrijven voor thuiswerkers voor een SSL/TLS-VPN en tussen vestigingen voor IPsec?

    Je docent bespreekt daarna je antwoorden.
  title: Lab 4.5.2 - Thuiswerken via de tunnel
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
