      - name: node.cfg
        content: |-
          hostname LAPTOP
          USERNAME=cisco
          PASSWORD=cisco
          # standaard-DHCP-client van het image uitschakelen (statische host)
          sed -i 's/iface eth0 inet dhcp/iface eth0 inet manual/' /etc/network/interfaces
          pkill udhcpc 2>/dev/null
          ip addr flush dev eth0
          ip link set dev eth0 up
          ip address add 192.168.1.10/24 dev eth0
          ip route add default via 192.168.1.1
          # VPN-client strongSwan via internet installeren en de verbinding 'bedrijf' klaarzetten
          echo "nameserver 8.8.8.8" > /etc/resolv.conf
          mkdir -p /etc/swanctl/conf.d
          cat > /etc/swanctl/conf.d/bedrijf.conf <<'EOF'
          connections {
            bedrijf {
              version = 2
              remote_addrs = 203.0.113.6
              vips = 0.0.0.0
              proposals = aes256-sha256-modp2048
              local {
                auth = psk
                id = laptop.korrel.lab
              }
              remote {
                auth = psk
                id = 203.0.113.6
              }
              children {
                bedrijf {
                  remote_ts = 10.82.10.0/24
                  esp_proposals = aes256-sha256
                  start_action = none
                }
              }
            }
          }
          secrets {
            ike-bedrijf {
              id-1 = laptop.korrel.lab
              id-2 = 203.0.113.6
              secret = "ThuisWerk2026"
            }
          }
          EOF
          (for i in $(seq 1 40); do apk add -q strongswan >/dev/null 2>&1 && break; sleep 10; done;
           ipsec start >/dev/null 2>&1; sleep 5; swanctl --load-all >/dev/null 2>&1) &
