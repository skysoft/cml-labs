          hostname R-AMS
          no ip domain lookup
          !
          crypto ikev2 proposal PROP-VESTIGING
           encryption aes-cbc-256
           integrity sha256
           group 14
          crypto ikev2 policy POL-VESTIGING
           proposal PROP-VESTIGING
          crypto ikev2 keyring SLEUTELS
           peer ANDERE-VESTIGING
            address 203.0.113.2
            pre-shared-key VpnLab2026
          crypto ikev2 profile PROF-VESTIGING
           match identity remote address 203.0.113.2 255.255.255.255
           authentication remote pre-share
           authentication local pre-share
           keyring local SLEUTELS
          !
          crypto ipsec transform-set TS-VESTIGING esp-aes 256 esp-sha256-hmac
           mode tunnel
          crypto ipsec profile IPSEC-VESTIGING
           set transform-set TS-VESTIGING
           set ikev2-profile PROF-VESTIGING
          !
          interface Ethernet0/0
           description LAN vestiging
           ip address 10.81.10.1 255.255.255.0
           no shutdown
          !
          interface Ethernet0/1
           description Internet
           ip address 198.51.100.2 255.255.255.252
           no shutdown
          !
          interface Tunnel0
           description VPN naar de andere vestiging (GRE over IPsec)
           ip address 172.16.0.1 255.255.255.252
           ip mtu 1400
           tunnel source Ethernet0/1
           tunnel destination 203.0.113.2
           tunnel protection ipsec profile IPSEC-VESTIGING
          !
          ip route 0.0.0.0 0.0.0.0 198.51.100.1
          ip route 10.81.20.0 255.255.255.0 Tunnel0
          !
          line con 0
           exec-timeout 0 0
           logging synchronous
          !
          end
