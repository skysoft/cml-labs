lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 4.5. Onderzoekslab site-to-site VPN:
    IKEv2 en IPsec-SA''s, ESP in een capture, tunnel mode tegenover transport mode,
    verkeerde PSK.'
  notes: |-
    # Lab 4.5.1 - Twee vestigingen, één tunnel

    **Leerdoel (CCNA 200-301 v2.0, 4.5):** IPsec remote access- en site-to-site-VPN's beschrijven (protocollen en modes).

    ## Scenario
    Een bedrijf heeft vestigingen in Amsterdam en Utrecht. De vestigingen zijn alleen via **internet** met elkaar verbonden. Daarom loopt het verkeer tussen de LAN's door een **site-to-site VPN**: een GRE-tunnel die door **IPsec** wordt beschermd (IKEv2, pre-shared key).

    Alles is al geconfigureerd. Dit is een **onderzoekslab**: je bekijkt hoe de VPN werkt en wat er over het internet gaat. Je hoeft IPsec niet te kunnen configureren; je moet het wel kunnen **beschrijven**.

    ## Topologie
    | Apparaat | Interface | Adres | Opmerking |
    |---|---|---|---|
    | PC-AMS | eth0 | 10.81.10.11/24 | LAN Amsterdam |
    | R-AMS | E0/0 / E0/1 / Tunnel0 | 10.81.10.1 / 198.51.100.2 / 172.16.0.1 | VPN-gateway Amsterdam |
    | INTERNET-R | E0/0 / E0/1 | 198.51.100.1 / 203.0.113.1 | "het internet" (kent de LAN's niet) |
    | R-UTR | E0/1 / E0/0 / Tunnel0 | 203.0.113.2 / 10.81.20.1 / 172.16.0.2 | VPN-gateway Utrecht |
    | PC-UTR | eth0 | 10.81.20.11/24 | LAN Utrecht |

    ## Inloggen
    - Routers: console, geen wachtwoord.
    - PC's (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Opdrachten

    ### Deel 1 - Werkt de VPN?
    1. Ping van PC-AMS naar PC-UTR en doe een traceroute. Welke hops zie je? Waarom zie je INTERNET-R niet?
    2. Bekijk de routeringstabel van INTERNET-R. Kent die router de LAN's 10.81.10.0/24 en 10.81.20.0/24? Hoe kan het verkeer er dan toch overheen?

    ### Deel 2 - IKE en de security associations
    1. Bekijk op R-AMS `show crypto ikev2 sa`. Wie zijn de peers? Welke versleuteling, integriteit (hash) en Diffie-Hellman-groep worden gebruikt? Wat is de status?
    2. IKE kent twee stappen: eerst een beveiligd beheerkanaal tussen de gateways (bij IKEv2: de **IKE SA**), daarna de afspraken voor het eigenlijke verkeer (de **IPsec SA's** of child SA's). Waarom die twee stappen?
    3. Bekijk `show crypto ipsec sa`. Zoek op:
       - de **SPI** van de inbound en outbound ESP-SA (waarom twee?);
       - de tellers `#pkts encaps` en `#pkts decaps`. Ping nog eens 10 keer en kijk opnieuw;
       - de regel `in use settings`: welke **mode** wordt gebruikt?
    4. Welk protocol bescherm je hier eigenlijk met IPsec: ICMP, IP of GRE? (Kijk bij `local ident` en `remote ident`, en bedenk wat Tunnel0 doet.)

    ### Deel 3 - Wat ziet het internet?
    1. Start in CML twee packet captures: één op de link **PC-AMS - R-AMS** en één op de link **R-AMS - INTERNET-R**. Ping van PC-AMS naar PC-UTR.
    2. Wat zie je in de eerste capture? En wat in de tweede? Welke protocolnaam en welke IP-adressen zie je op de internetlink?
    3. Kan iemand op het internet zien welke pc's met elkaar praten? Wat kan hij nog wel zien?

    ### Deel 4 - Tunnel mode tegenover transport mode
    1. Start een capture op de internetlink en ping vanaf PC-AMS met `ping -c 3 -s 100 10.81.20.11`. Noteer de **lengte** van één ESP-pakket, en ter vergelijking de lengte van hetzelfde ICMP-pakket op het LAN.
    2. Zet op **beide** routers de transform-set op transport mode:
       ```
       crypto ipsec transform-set TS-VESTIGING esp-aes 256 esp-sha256-hmac
        mode transport
       ```
       Wis daarna op R-AMS de bestaande SA's met `clear crypto session` en ping opnieuw.
    3. Wat zegt `in use settings` nu? Meet opnieuw de lengte van een ESP-pakket. Hoeveel bytes scheelt het? Je zou 20 bytes verwachten (een IP-header): waarom is het verschil net iets anders? (Tip: AES versleutelt in blokken van 16 bytes.)
    4. Teken voor beide modes het pakket: welke headers zitten er buiten en welke binnen de versleuteling?
    5. Zet beide routers weer terug op `mode tunnel` en wis de SA's opnieuw.

    ### Deel 5 - Een verkeerde sleutel
    1. Verander op **R-UTR** de pre-shared key in de keyring in `FouteSleutel`. Wis op R-AMS de SA's (`clear crypto session`) en ping opnieuw.
    2. Wat zie je in `show crypto ikev2 sa` en `show crypto session`? Zet op R-AMS `debug crypto ikev2 error` aan, ping opnieuw en bekijk `show logging | include IKEv2`. In welke stap van IKE gaat het mis: bij het afspreken van de algoritmen of bij het controleren van de identiteit? Zet de debug daarna weer uit (`undebug all`).
    3. Zet de juiste sleutel (`VpnLab2026`) terug, wis op R-AMS opnieuw de sessie (`clear crypto session`) en controleer dat de tunnel weer opkomt (`show crypto session`: UP-ACTIVE).

    ### Deel 6 - Theorie
    | Onderwerp | Uitleg |
    |---|---|
    | ESP tegenover AH: wat beschermen ze, en welke werkt niet achter NAT? | |
    | Tunnel mode tegenover transport mode: wanneer gebruik je welke? | |
    | IKEv1 tegenover IKEv2: belangrijkste verschil | |
    | NAT-T: wat is het en welke poort? | |
    | Waarom GRE over IPsec, en niet alleen IPsec? (Denk aan multicast en routeringsprotocollen.) | |

    ## Reflectie
    1. Beschrijf in je eigen woorden wat er met een ping van PC-AMS naar PC-UTR gebeurt, van vertrek tot aankomst.
    2. Waarom heet dit een **site-to-site**-VPN? Wat zou er anders zijn bij een VPN voor één thuiswerker? (Dat zie je in lab 4.5.2.)

    Je docent bespreekt daarna je antwoorden.
  title: Lab 4.5.1 - Twee vestigingen, een tunnel
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
