lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 4.2. Configuratielab: router als SCP-server
    (AAA-voorwaarden), software uploaden, verify /md5, geen SFTP-server op IOS.'
  notes: |-
    # Lab 4.2.2 - De router als bestandsserver

    **Leerdoel (CCNA 200-301 v2.0, 4.2):** configuratie- en softwarebestanden van netwerkapparaten beheren met veilige bestandsoverdracht (SFTP/SCP).

    ## Scenario
    De leverancier heeft een nieuwe softwareversie voor R1 uitgebracht. Je wilt het bestand vanaf de beheer-pc naar de router kopiëren, en controleren dat het onderweg niet is beschadigd. Ook wil je de configuratie van R1 direct vanaf de beheer-pc kunnen ophalen.

    Dit keer is de router de **server**: de beheer-pc maakt de verbinding.

    SSH werkt al op R1, met de gebruiker **beheer** (wachtwoord **Beheer2026**, privilege 15).

    ## Topologie
    | Apparaat | Interface | IPv4 |
    |---|---|---|
    | R1 | E0/0 | 10.62.10.1/24 |
    | BEHEER-PC | eth0 | 10.62.10.50/24 |

    Op BEHEER-PC staat in `~/software` de nieuwe versie `iol-update-17.18.03.bin` met de releasenotes van de leverancier (`RELEASENOTES.txt`).

    ## Inloggen
    - R1: console, geen wachtwoord.
    - BEHEER-PC (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    **Tip voor SCP vanaf Linux:** nieuwe OpenSSH-versies gebruiken voor `scp` standaard het SFTP-protocol, en dat kent IOS niet als server. Gebruik daarom `scp -O` (het klassieke SCP-protocol). Bij het ophalen van `system:running-config` heb je ook `-T` nodig, omdat IOS een andere bestandsnaam terugstuurt dan je vroeg. Voorbeeld:
    `scp -O -T beheer@10.62.10.1:system:running-config r1.cfg`

    ## Opdrachten

    ### Deel 1 - De SCP-server aanzetten
    1. Probeer vanaf BEHEER-PC de running-config van R1 op te halen (zie de tip). Welke melding geeft de router?
    2. Zet op R1 de SCP-server aan en probeer het opnieuw. Bekijk het bestand op de pc.
    3. Bekijk op R1 de log (`show logging | include SSH`). Welke regels zie je bij een SCP-overdracht?
    4. In veel (oudere) documentatie staat dat de SCP-server **AAA** nodig heeft, met lokale exec-autorisatie. Deze IOS XE-versie accepteert ook `login local` op de vty-lijnen, zolang de gebruiker **privilege 15** heeft. Als het netwerk wel AAA gebruikt (zoals in lab 4.1.2), welke method list moet er dan in elk geval zijn voor SCP?

    ### Deel 2 - De nieuwe software uploaden
    1. Bekijk op R1 welke bestandssystemen er zijn en hoeveel ruimte er vrij is. Op welk bestandssysteem zet je de nieuwe software? (In IOL heet dat `unix:`; op een echte router `flash:` of `bootflash:`.)
    2. Kopieer `iol-update-17.18.03.bin` met SCP naar R1.
    3. Controleer met `dir` of het bestand er staat en of de grootte klopt.

    ### Deel 3 - Is het bestand onbeschadigd?
    1. Bereken op R1 de MD5-hash van het bestand.
    2. Vergelijk die met de waarde in `RELEASENOTES.txt` en met `md5sum` op de pc. Waarom is deze stap belangrijk voordat je een nieuwe softwareversie activeert?
    3. Wat zou je doen als de hash niet klopt?

    ### Deel 4 - SFTP?
    1. Probeer vanaf BEHEER-PC met `sftp beheer@10.62.10.1` verbinding te maken. Wat gebeurt er?
    2. Wat concludeer je over SFTP op IOS? Hoe gebruik je SFTP dan wel met een Cisco-router? (Denk aan lab 4.2.1.)

    ### Deel 5 - Activeren (theorie) en opruimen
    1. Bekijk `show version`. Vanaf welk bestand is deze router opgestart?
    2. Op een echte router activeer je een nieuwe image met `boot system`, `copy running-config startup-config` en `reload`. Schrijf de commando's op voor deze nieuwe versie (op `flash:`). Waarom bewaar je de oude image nog even?
    3. In IOL kun je niet van een andere image opstarten. Verwijder het bestand weer van R1.

    ## Reflectie
    1. Welke voorwaarden moeten er op een IOS-router zijn voordat de SCP-server werkt? Noem ze allemaal.
    2. Waarom is het verstandig om de SCP-server na gebruik weer uit te zetten?

    Je docent bespreekt daarna je antwoorden.
  title: Lab 4.2.2 - De router als bestandsserver
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
