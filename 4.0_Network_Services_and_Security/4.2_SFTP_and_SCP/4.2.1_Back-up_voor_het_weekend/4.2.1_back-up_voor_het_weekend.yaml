        content: |-
          hostname BACKUP-SRV
          USERNAME=cisco
          PASSWORD=cisco
          # standaard-DHCP-client van het image uitschakelen (statische host)
          sed -i 's/iface eth0 inet dhcp/iface eth0 inet manual/' /etc/network/interfaces
          pkill udhcpc 2>/dev/null
          ip addr flush dev eth0
          ip link set dev eth0 up
          ip address add 10.61.10.100/24 dev eth0
          ip route add 10.61.1.1 via 10.61.10.1
          ip route add 10.61.2.2 via 10.61.10.2
          # back-upaccount voor de routers: backup / Backup2026
          adduser -D -s /bin/sh backup
          echo 'backup:Backup2026' | chpasswd
          mkdir -p /home/backup/configs && chown -R backup:backup /home/backup
          # een kleine configuratiewijziging die je in deel 4 terugzet op R1
          cat > /home/backup/configs/R1-wijziging.cfg <<'EOF'
          interface Loopback9
           description Toegevoegd vanaf de back-upserver
           ip address 10.61.99.1 255.255.255.255
          !
          banner motd ^Router R1 - configuratie hersteld vanaf BACKUP-SRV^
          end
          EOF
          chown backup:backup /home/backup/configs/R1-wijziging.cfg
