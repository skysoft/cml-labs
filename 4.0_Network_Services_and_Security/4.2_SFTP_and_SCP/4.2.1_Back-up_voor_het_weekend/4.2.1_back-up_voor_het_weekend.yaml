lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 4.2. Configuratielab: router als SCP/SFTP-client,
    back-up en herstel (merge) van configuraties.'
  notes: |-
    # Lab 4.2.1 - Back-up voor het weekend

    **Leerdoel (CCNA 200-301 v2.0, 4.2):** configuratie- en softwarebestanden van netwerkapparaten beheren met veilige bestandsoverdracht (SFTP/SCP).

    ## Scenario
    Voor het onderhoudsweekend wil de beheerder van elke router een back-up van de configuratie op de back-upserver. Vroeger ging dat met TFTP; dat mag niet meer, want alles gaat dan onversleuteld over het netwerk. Voortaan gebruik je **SCP** en **SFTP**, die allebei over SSH werken.

    In dit lab is de router de **client**: hij kopieert bestanden naar en van de server.

    ## Topologie
    | Apparaat | Interface | IPv4 |
    |---|---|---|
    | R1 | E0/0 / Loopback0 | 10.61.10.1/24 / 10.61.1.1 |
    | R2 | E0/0 / Loopback0 | 10.61.10.2/24 / 10.61.2.2 |
    | BACKUP-SRV | eth0 | 10.61.10.100/24 (OpenSSH: SCP en SFTP) |

    Op de server staat het account **backup** (wachtwoord **Backup2026**) met de map `/home/backup/configs`.

    ## Inloggen
    - Routers: console, geen wachtwoord.
    - BACKUP-SRV (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco** (om de bestanden te bekijken: `sudo ls -l /home/backup/configs`).

    ## Opdrachten

    ### Deel 1 - Voorbereiding
    1. Bekijk `show file systems` op R1. Welke bestandssystemen zijn er, en welke hebben het type **network**? Op welk bestandssysteem staat de startup-config?
    2. In dit lab draait IOS als IOL (een softwareversie in Docker). Daardoor is er geen `flash:` maar `unix:`. Hoe heet dit bestandssysteem op een echte router of switch?
    3. Zorg dat R1 en R2 hun SSH-verkeer (dus ook SCP en SFTP) versturen vanaf **Loopback0**.

    ### Deel 2 - Back-up met SCP
    1. Kopieer op R1 de **running-config** met SCP naar de server, als `/home/backup/configs/R1-running.cfg`. Gebruik het account backup. IOS vraagt om bevestiging van het adres, de bestandsnaam en het wachtwoord.
    2. Doe hetzelfde voor R2.
    3. Controleer op de server of de bestanden er zijn en bekijk de inhoud van één ervan. Klopt hij met de configuratie van de router?

    ### Deel 3 - Back-up met SFTP
    1. Kopieer op R1 de **startup-config** met SFTP naar de server, als `R1-startup.cfg`. Wat valt je op aan de grootte, vergeleken met R1-running.cfg? Verklaar.
    2. Voer `copy running-config startup-config` (of `write memory`) uit en herhaal stap 1.
    3. Met `ip sftp username` en `ip sftp password` kun je de inloggegevens in de configuratie zetten, zodat je ze niet meer hoeft te typen. Waarom is dat in de praktijk een slecht idee?

    ### Deel 4 - Terugzetten
    1. Op de server staat een klein bestand `R1-wijziging.cfg`. Bekijk de inhoud op de server.
    2. Kopieer dit bestand met SCP naar de **running-config** van R1.
    3. Is de configuratie van R1 nu **vervangen** of **samengevoegd** (merge)? Toon dat aan. Wat gebeurde er met bestaande instellingen?
    4. Hoe zou je een volledige configuratie wél laten vervangen in plaats van samenvoegen? (Noem twee manieren.)

    ### Deel 5 - Veilig tegenover onveilig
    1. Vul de tabel in:

    | Protocol | Transport/poort | Versleuteld? | Authenticatie? | Bestandsbeheer (ls, rm)? |
    |---|---|---|---|---|
    | TFTP | | | | |
    | FTP | | | | |
    | SCP | | | | |
    | SFTP | | | | |

    2. (Optioneel) Start in CML een packet capture op de link van R1 en herhaal deel 2. Kun je de configuratie in de pakketten lezen?

    ## Reflectie
    1. Waarom gebruik je voor een back-up liever een vast bronadres (Loopback0)?
    2. Wat is het verschil tussen een back-up van de running-config en van de startup-config? Wanneer heb je welke nodig?

    Je docent bespreekt daarna je antwoorden.
  title: Lab 4.2.1 - Back-up voor het weekend
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
