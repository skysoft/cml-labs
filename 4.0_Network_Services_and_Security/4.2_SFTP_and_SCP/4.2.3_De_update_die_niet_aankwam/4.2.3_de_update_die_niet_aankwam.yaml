    configuration:
      - name: node.cfg
        content: |-
          hostname BEHEER-PC
          USERNAME=cisco
          PASSWORD=cisco
          # standaard-DHCP-client van het image uitschakelen (statische host)
          sed -i 's/iface eth0 inet dhcp/iface eth0 inet manual/' /etc/network/interfaces
          pkill udhcpc 2>/dev/null
          ip addr flush dev eth0
          ip link set dev eth0 up
          ip address add 10.63.10.50/24 dev eth0
          # nieuwe softwareversie (lab: 1 MB testbestand) en de releasenotes van de leverancier
          mkdir -p /home/cisco/software
          { yes CCNA-LAB-IMAGE-17.18.03 | head -c 524288; printf X; yes CCNA-LAB-IMAGE-17.18.03 | head -c 524287; } > /home/cisco/software/iol-update-17.18.03.bin
          cat > /home/cisco/software/RELEASENOTES.txt <<'EOF'
          Bestand : iol-update-17.18.03.bin
          Grootte : 1048576 bytes
          MD5     : e4dcdc3ace602467bb22b3b230007ad8
          EOF
          chown -R cisco:cisco /home/cisco/software
          # het origineel van de leverancier (de mirror), alleen-lezen
          mkdir -p /srv/leverancier
          yes CCNA-LAB-IMAGE-17.18.03 | head -c 1048576 > /srv/leverancier/iol-update-17.18.03.bin
          cp /home/cisco/software/RELEASENOTES.txt /srv/leverancier/
          chmod -R a+rX,go-w /srv/leverancier
