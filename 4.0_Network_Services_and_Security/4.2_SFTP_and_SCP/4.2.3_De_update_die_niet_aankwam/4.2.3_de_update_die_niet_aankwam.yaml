lab:
  description: CCNA 200-301 v2.0 - leerdoel 4.2. Troubleshootinglab met 5 fouten rond
    SCP en de software-upgradeprocedure.
  notes: |-
    # Lab 4.2.3 - De update die niet aankwam

    **Leerdoel (CCNA 200-301 v2.0, 4.2):** configuratie- en softwarebestanden van netwerkapparaten beheren met veilige bestandsoverdracht (SFTP/SCP).

    ## Scenario
    Vier vestigingsrouters (R1 t/m R4) moeten een nieuwe softwareversie krijgen. Een collega heeft de routers als SCP-server ingericht en het bestand op de beheer-pc gezet, maar het uploaden lukt op geen enkele router. Jij neemt het over.

    **Er zitten 5 fouten in dit lab.** Vier zitten in de configuratie van de routers; één zit niet in een configuratie, maar je vindt hem als je de upgradeprocedure correct volgt.

    ## Klachten
    - De upload naar R1, R2 en R3 mislukt.
    - Op R4 lukt zelfs geen SSH-verbinding.

    ## Ontwerp
    | Onderdeel | Ontwerp (voor R1 t/m R4) |
    |---|---|
    | Beheertoegang | alleen SSH versie 2 op de vty-lijnen |
    | Account | **beheer** / **Beheer2026**, privilege **15** |
    | AAA | `aaa new-model`, login `default` lokaal, **exec-autorisatie** `default` lokaal, console via method list CONSOLE (none) |
    | Bestandsoverdracht | SCP-server **aan** |
    | Software | `iol-update-17.18.03.bin` naar `unix:` (op echte apparatuur `flash:`) |

    **Upgradeprocedure:**
    1. upload het bestand met SCP;
    2. controleer met `verify /md5` dat de hash gelijk is aan die in de releasenotes van de leverancier;
    3. klopt de hash niet, dan installeer je het bestand **nooit**: verwijder het van de router en haal het opnieuw op uit de map van de leverancier, `/srv/leverancier` op BEHEER-PC;
    4. pas na een geslaagde controle zou je de router opnieuw opstarten met de nieuwe versie (in dit lab niet mogelijk).

    ## Topologie
    | Apparaat | IPv4 |
    |---|---|
    | R1 / R2 / R3 / R4 | 10.63.10.1 / .2 / .3 / .4 |
    | BEHEER-PC | 10.63.10.50 (software in `~/software`) |

    ## Inloggen
    - Routers: console (noodtoegang, direct beheerdersniveau).
    - BEHEER-PC (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    **Tip:** gebruik vanaf Linux `scp -O` (het klassieke SCP-protocol), bijvoorbeeld:
    `scp -O ~/software/iol-update-17.18.03.bin beheer@10.63.10.1:unix:iol-update-17.18.03.bin`

    ## Opdracht
    1. Zoek en herstel de 5 fouten. Houd een **foutenlog** bij:

    | # | Apparaat | Symptoom (melding, log) | Oorzaak | Oplossing | Hoe geverifieerd |
    |---|---|---|---|---|---|

    2. Toon na afloop aan dat de upload naar alle vier de routers werkt en dat het bestand op elke router de juiste MD5-hash heeft.

    ## Reflectie
    1. Welke fout zou in de praktijk het meeste schade kunnen aanrichten als je hem niet vindt? Waarom?
    2. Welke meldingen gaf de router zelf (log), en welke alleen de client?

    Je docent bespreekt daarna je foutenlog.
  title: Lab 4.2.3 - De update die niet aankwam
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
