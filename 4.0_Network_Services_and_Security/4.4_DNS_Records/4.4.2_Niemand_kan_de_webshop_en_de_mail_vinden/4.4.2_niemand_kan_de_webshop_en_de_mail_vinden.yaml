lab:
  description: CCNA 200-301 v2.0 - leerdoel 4.4. Troubleshootinglab met 6 fouten in
    DNS-records (A, AAAA, CNAME, MX, PTR, NS).
  notes: |-
    # Lab 4.4.2 - Niemand kan de webshop en de mail vinden

    **Leerdoel (CCNA 200-301 v2.0, 4.4):** problemen met DNS-records (A, AAAA, CNAME, MX, NS en PTR) diagnosticeren, zodat hosts, webapplicaties en mailservers op naam bereikbaar zijn.

    ## Scenario
    Bakkerij De Korrel heeft haar DNS-server opnieuw ingericht. Sindsdien regent het klachten. De servers zelf (web, mail, R&D) draaien gewoon en zijn op hun IP-adres bereikbaar.

    **Er zitten 6 fouten in dit lab.** Alle fouten zitten in de zonebestanden op **DNS1**.

    ## Klachten
    1. Op de kassa (PC2, alleen IPv4) laadt de website www.korrel.lab niet.
    2. Op de laptops (PC1, IPv4 en IPv6) laadt de website ook niet.
    3. De link naar de webshop (shop.korrel.lab) geeft "onbekende naam", ook bij collega's bij wie www wél werkt.
    4. Mail naar @korrel.lab komt niet aan, terwijl de mailserver draait.
    5. Een externe partij weigert onze mail: "de reverse DNS van 10.72.10.25 past niet bij de naam van de mailserver".
    6. De site van R&D, www.rd.korrel.lab, is onbereikbaar sinds de herinrichting.

    ## Ontwerp
    | Naam | Moet verwijzen naar |
    |---|---|
    | www.korrel.lab | WEB: 10.72.10.80 en 2001:db8:72:10::80 |
    | shop.korrel.lab | alias van www.korrel.lab |
    | mail voor korrel.lab | mail.korrel.lab (prioriteit 10), mail2.korrel.lab (prioriteit 20, reserve) |
    | mail.korrel.lab | MAIL: 10.72.10.25 en 2001:db8:72:10::25; de reverse lookup van beide adressen geeft mail.korrel.lab |
    | rd.korrel.lab | gedelegeerd aan DNS-RD (dns-rd.korrel.lab, 10.72.10.54), die gezaghebbend is voor rd.korrel.lab |

    ## Topologie (10.72.10.0/24 en 2001:db8:72:10::/64)
    | Apparaat | IPv4 | IPv6 |
    |---|---|---|
    | EDGE | .1 | ::1 |
    | PC1 | .11 | ::11 |
    | PC2 (kassa) | .12 | - (alleen IPv4) |
    | MAIL | .25 | ::25 |
    | DNS1 | .53 | ::53 |
    | DNS-RD | .54 | ::54 |
    | WEB | .80 | ::80 |

    Op DNS1 staan de zones in `/etc/bind/zones/`. Bewerk ze met `sudo vi` en laad ze daarna opnieuw met **`sudo dns-herlaad`**: dat controleert de zones en meldt fouten. Verhoog bij elke wijziging ook het serienummer in het SOA-record.

    DNS-RD is correct en pas je niet aan. Na het starten installeren de servers hun software via internet: wacht ongeveer **3 minuten**.

    ## Inloggen
    - EDGE: console, geen wachtwoord.
    - Alle Alpine-nodes: gebruiker **cisco** / wachtwoord **cisco**. Op PC1 en PC2 staan `dig` en `nslookup`.

    ## Opdracht
    1. Toon voor elke klacht eerst aan dat het een DNS-probleem is (werkt het op IP-adres wel?).
    2. Zoek en herstel de 6 fouten. Houd een **foutenlog** bij:

    | # | Klacht | Commando waarmee je het vond | Record (type) | Fout | Oplossing |
    |---|---|---|---|---|---|

    3. Toon na afloop met `dig` aan dat elke naam uit het ontwerp het juiste antwoord geeft, en dat de website (op PC1 en PC2), de webshop, de R&D-site en de mailserver op naam werken.

    ## Reflectie
    1. Welke fout gaf **NXDOMAIN**, welke **SERVFAIL** en welke een "gewoon" antwoord met de verkeerde inhoud?
    2. Waarom merkte PC2 de fout in het AAAA-record niet, en PC1 de fout in het A-record niet?

    Je docent bespreekt daarna je foutenlog.
