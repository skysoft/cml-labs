lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 4.4. Verkenningslab DNS: A, AAAA, CNAME,
    MX, NS en PTR opvragen en lezen, delegatie, recursie en cache.'
  notes: |-
    # Lab 4.4.1 - Het telefoonboek van het netwerk

    **Leerdoel (CCNA 200-301 v2.0, 4.4):** problemen met DNS-records (A, AAAA, CNAME, MX, NS en PTR) diagnosticeren, zodat hosts, webapplicaties en mailservers op naam bereikbaar zijn.

    ## Scenario
    Bakkerij De Korrel heeft een eigen domein: **korrel.lab**. De nameserver **DNS1** beheert dat domein en zoekt voor de medewerkers ook namen op internet op. De afdeling R&D beheert haar eigen subdomein **rd.korrel.lab** op een eigen nameserver (**DNS-RD**).

    Alles werkt. Dit is een **verkenningslab**: je leert de DNS-records lezen en opvragen, zodat je in lab 4.4.2 storingen kunt vinden.

    ## Topologie (alles in 10.71.10.0/24 en 2001:db8:71:10::/64)
    | Apparaat | IPv4 | IPv6 | Rol |
    |---|---|---|---|
    | EDGE | .1 | ::1 | router, internet |
    | PC1 | .11 | ::11 | werkplek (met `dig` en `nslookup`) |
    | MAIL | .25 | ::25 | mailserver (SMTP, poort 25) |
    | DNS1 | .53 | ::53 | gezaghebbend voor korrel.lab en de reverse-zones, en resolver voor het bedrijf |
    | DNS-RD | .54 | ::54 | gezaghebbend voor rd.korrel.lab |
    | WEB | .80 | ::80 | webserver (HTTP, poort 80) |

    Op DNS1 staan de zones in `/etc/bind/zones/` en de configuratie in `/etc/bind/named.conf.lab`. Bekijk ze met `sudo cat`.

    Na het starten installeren de servers hun software via internet: wacht ongeveer **3 minuten**.

    ## Inloggen
    - EDGE: console, geen wachtwoord.
    - Alle Alpine-nodes: gebruiker **cisco** / wachtwoord **cisco**.

    ## Opdrachten

    ### Deel 1 - Records opvragen
    Gebruik op PC1 `dig` (en vergelijk één keer met `nslookup`). Vul de tabel in:

    | Vraag | Commando | Antwoord | Recordtype |
    |---|---|---|---|
    | IPv4-adres van www.korrel.lab | | | |
    | IPv6-adres van www.korrel.lab | | | |
    | Waar wijst shop.korrel.lab naar? | | | |
    | Welke mailservers heeft korrel.lab, met welke prioriteit? | | | |
    | Welke nameserver is gezaghebbend voor korrel.lab? | | | |
    | Welke naam hoort bij 10.71.10.25? | | | |
    | Welke naam hoort bij 2001:db8:71:10::80? | | | |

    1. Wat is het verschil tussen het ANSWER-, AUTHORITY- en ADDITIONAL-deel in de uitvoer van `dig`?
    2. Wat betekent de vlag `aa` in het antwoord? Wanneer staat die er wel en wanneer niet?

    ### Deel 2 - Het zonebestand lezen
    1. Bekijk `/etc/bind/zones/korrel.lab.zone` op DNS1. Zoek elk record uit deel 1 op.
    2. Wat staat er in het SOA-record? Wat is de functie van het serienummer?
    3. Wat betekent `$TTL 3600`? Zoek de TTL terug in de uitvoer van `dig`.
    4. Waarom eindigen de namen achter NS, MX en CNAME met een punt?
    5. Bekijk de twee reverse-zones. Hoe is het IPv4-adres in de naam van de zone verwerkt, en hoe het IPv6-adres?

    ### Deel 3 - Op naam werken
    1. Haal vanaf PC1 de website op met `wget -qO- http://www.korrel.lab` en met `http://shop.korrel.lab`. Waarom werken beide?
    2. Controleer of de mailserver bereikbaar is: `nc -w 3 mail.korrel.lab 25`. Welke regel stuurt de server?
    3. Waarom vraagt een mailserver die mail wil afleveren bij korrel.lab eerst het MX-record op, en niet het A-record van korrel.lab?
    4. Wat gebeurt er met mail als `mail` onbereikbaar is? Waar dient `mail2` voor?

    ### Deel 4 - Delegatie (NS)
    1. Vraag `www.rd.korrel.lab` op via DNS1. Wie geeft uiteindelijk het antwoord?
    2. Vraag het **direct** aan DNS-RD: `dig @10.71.10.54 www.rd.korrel.lab`. Wat is het verschil in de vlaggen?
    3. Vraag aan DNS-RD een naam buiten rd.korrel.lab op (bijvoorbeeld `www.korrel.lab` of `cloudflare.com`). Wat antwoordt DNS-RD, en waarom?
    4. Bekijk in de zone van korrel.lab hoe het subdomein rd is gedelegeerd. Waarom staat er ook een A-record voor dns-rd (glue)?

    ### Deel 5 - Recursie en cache
    1. Vraag twee keer, met een paar seconden ertussen, `cloudflare.com` op via DNS1. Wat gebeurt er met de TTL en de "Query time"? Verklaar.
    2. Waar haalt DNS1 de antwoorden voor internetnamen vandaan? (Kijk in de configuratie bij `forwarders`.)

    ### Deel 6 - De router als DNS-client
    1. Bekijk op EDGE welke DNS-instellingen er zijn (`show running-config | include domain|name-server`).
    2. Ping vanaf EDGE naar `www` (zonder domeinnaam) en naar `www.korrel.lab`. Bekijk daarna `show hosts`. Wat zie je?
    3. Waarom zetten veel beheerders op routers `no ip domain lookup`, en wat is het nadeel daarvan?

    ## Reflectie
    1. Welke records heeft een mailserver nodig om mail te kunnen ontvangen en om zelf betrouwbaar mail te versturen?
    2. Een collega zegt: "De website is onbereikbaar, dus DNS is kapot." Hoe toon je met twee commando's aan of het een DNS-probleem is of niet?

    Je docent bespreekt daarna je antwoorden.
