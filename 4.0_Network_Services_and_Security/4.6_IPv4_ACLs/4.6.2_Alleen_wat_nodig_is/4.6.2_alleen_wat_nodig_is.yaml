lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 4.6. Configuratielab extended ACL''s:
    numbered en named, plaatsing, poorten, sequence numbers, remark, log en established.'
  notes: |-
    # Lab 4.6.2 - Alleen wat nodig is

    **Leerdoel (CCNA 200-301 v2.0, 4.6):** IPv4-access control lists configureren (standard, extended, numbered en named). Dit lab gaat over **extended** ACL's.

    ## Scenario
    Op het serverlan staan een webserver en een mailserver. Nu kunnen de medewerkers alles op die servers bereiken, ook SSH. Het beveiligingsbeleid wordt:

    | Van | Naar | Toegestaan |
    |---|---|---|
    | Medewerkers 10.92.10.0/24 | webserver 10.92.100.80 | http (80) en https (443) |
    | Medewerkers | mailserver 10.92.100.25 | smtp (25) |
    | Medewerkers | serverlan | ping (echo) |
    | Medewerkers | serverlan | **verder niets** (ook geen SSH) |
    | Beheer 10.92.30.0/24 | serverlan | alles |
    | Servers | medewerkers | alleen antwoorden op verbindingen die de medewerkers zelf opzetten |

    ## Topologie (router R1)
    | Interface | Netwerk | Hosts |
    |---|---|---|
    | E0/0 | Medewerkers 10.92.10.0/24 | PC1 .11 (luistert op poort 5000) |
    | E0/1 | Beheer 10.92.30.0/24 | PC-BEHEER .11 |
    | E0/2 | Servers 10.92.100.0/24 | WEB .80 (poorten 80, 443, 22), MAIL .25 (poorten 25, 22) |

    ## Inloggen
    - R1: console, geen wachtwoord.
    - Alle Alpine-nodes: gebruiker **cisco** / wachtwoord **cisco**.

    **Testen:**
    - `nc -w 2 <adres> <poort> </dev/null` toont de tekst van de dienst als de verbinding lukt, en blijft leeg als het verkeer wordt tegengehouden. (Bij poort 22 zie je de SSH-banner.)
    - Daarnaast `ping` en `traceroute`.

    ## Opdrachten

    ### Deel 1 - Uitgangssituatie en ontwerp
    1. Test vanaf PC1 alle poorten (80, 443, 25, 22) op WEB en MAIL, plus ping en traceroute naar WEB. Noteer de resultaten.
    2. Waarom kun je dit beleid **niet** met een standard ACL maken?
    3. Waar plaats je een extended ACL, en waarom daar? Op welk interface en in welke richting komt de ACL voor de medewerkers?

    ### Deel 2 - Een numbered extended ACL
    1. Maak ACL **110** volgens het beleid voor de medewerkers. Gebruik `host`, `eq` en de juiste protocollen (tcp, icmp).
    2. Plaats de ACL op het juiste interface, in de juiste richting.
    3. Test opnieuw alles uit deel 1. Klopt het met het beleid? Waarom werkt ping wel en traceroute niet? (Tip: welk protocol gebruikt `traceroute` op Linux?)
    4. Test vanaf PC-BEHEER: SSH naar WEB (`nc -w 2 10.92.100.80 22 </dev/null`). Werkt dat? Waarom wordt dit verkeer niet geblokkeerd?

    ### Deel 3 - Named, sequence numbers, remark en log
    1. Vervang ACL 110 door een named extended ACL **MEDEWERKERS-IN** met dezelfde regels. Gebruik sequence numbers in stappen van 10, en zet bovenaan een `remark`.
    2. Voeg aan het eind een expliciete regel toe die al het overige verkeer weigert, met `log`. Waarom kan dat handig zijn, terwijl de impliciete deny hetzelfde doet?
    3. Test SSH vanaf PC1 naar WEB, en bekijk `show logging | include SEC` en `show access-lists MEDEWERKERS-IN`. Wat vertellen de tellers?
    4. De webserver krijgt een beheerpagina op poort **8443**, en ook die moet voor de medewerkers bereikbaar zijn. Voeg een regel in met sequence number **25** (tussen 443 en smtp).

    ### Deel 4 - Terugverkeer en established
    1. Op PC1 luistert een dienst op poort 5000. Test vanaf WEB: `nc -w 2 10.92.10.11 5000 </dev/null`. Het lukt niet, terwijl er nog geen ACL aan de serverkant staat. Welke ACL houdt dit tegen, en welk pakket precies? (Kijk naar de tellers van MEDEWERKERS-IN.) Wat leer je hieruit over ACL's en antwoordverkeer?
    2. Haal MEDEWERKERS-IN **tijdelijk** van E0/0 af en test opnieuw vanaf WEB. Volgens het beleid mogen de servers geen verbindingen naar de medewerkers opzetten, maar nu lukt het wel.
    3. Maak een named extended ACL **SERVERS-IN** die vanaf het serverlan naar de medewerkers alleen toestaat:
       - TCP-verkeer van verbindingen die al bestaan (`established`);
       - ICMP echo-reply;
       en al het andere van servers naar medewerkers weigert. Verkeer van de servers naar andere bestemmingen blijft toegestaan.
    4. Plaats SERVERS-IN en test:
       - werkt web en mail vanaf PC1 nog?
       - lukt de verbinding van WEB naar PC1 poort 5000 nog?
    5. Zet MEDEWERKERS-IN weer terug op E0/0 en controleer dat alles volgens het beleid werkt.
    6. Wat doet `established` precies? Waarom is dit geen volwaardige firewall?

    ## Reflectie
    1. Wat is het belangrijkste verschil tussen standard en extended ACL's, en wat betekent dat voor de plaatsing?
    2. Hoeveel ACL's mag je per interface, per richting en per protocol plaatsen?
    3. Waarom moet je bij een ACL op een interface met een routeringsprotocol (bijvoorbeeld OSPF) extra opletten?

    Je docent bespreekt daarna je antwoorden.
  title: Lab 4.6.2 - Alleen wat nodig is
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
