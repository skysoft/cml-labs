lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 4.6. Configuratielab standard ACL''s:
    wildcards, numbered en named, plaatsing, sequence numbers, access-class.'
  notes: |-
    # Lab 4.6.1 - Wie mag bij de salarisadministratie?

    **Leerdoel (CCNA 200-301 v2.0, 4.6):** IPv4-access control lists configureren (standard, extended, numbered en named). Dit lab gaat over **standard** ACL's.

    ## Scenario
    Op het netwerk van een bedrijf kan nu iedereen overal bij, ook bij de **salarisserver**. Dat moet anders:
    - alleen de afdeling **HR** en de **beheer-pc** 10.91.30.11 mogen bij de salarisserver;
    - de **algemene server** (intranet) blijft voor iedereen bereikbaar;
    - de router zelf mag alleen vanaf het **beheer-LAN** via SSH beheerd worden.

    Je gebruikt hiervoor **standard** ACL's. Die kijken alleen naar het **bronadres** van een pakket.

    ## Topologie (router R1)
    | Interface | Netwerk | Hosts |
    |---|---|---|
    | E0/0 | HR 10.91.10.0/24 | PC-HR .11 |
    | E0/1 | Verkoop 10.91.20.0/24 | PC-VK .11, PC-ADVISEUR .50 |
    | E0/2 | Beheer 10.91.30.0/24 | PC-BEHEER .11 |
    | E0/3 | Algemene servers 10.91.100.0/24 | ALG-SRV .20 (poort 80) |
    | E1/0 | Salarisserver 10.91.110.0/24 | SAL-SRV .10 (poort 80) |

    R1 heeft SSH, met gebruiker **beheer** / **Beheer2026**.

    ## Inloggen
    - R1: console, geen wachtwoord.
    - Alle pc's en servers (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    **Testen:** `nc -w 2 <server> 80 </dev/null` toont de tekst van de server als je erbij mag, en blijft leeg als het verkeer wordt tegengehouden. Ping werkt ook.

    ## Opdrachten

    ### Deel 1 - Wildcard masks
    Schrijf de wildcard (en waar het kan het sleutelwoord `host` of `any`) voor:

    | Doel | Adres + wildcard |
    |---|---|
    | alleen 10.91.30.11 | |
    | het hele HR-netwerk 10.91.10.0/24 | |
    | alle netwerken 10.91.0.0 t/m 10.91.255.255 | |
    | alleen 10.91.20.0 t/m 10.91.20.63 | |
    | elk adres | |

    ### Deel 2 - Een numbered standard ACL
    1. Test eerst vanaf PC-HR, PC-VK en PC-BEHEER of je bij SAL-SRV en bij ALG-SRV komt. Noteer de uitgangssituatie.
    2. Maak ACL **10**: HR en de beheer-pc toestaan. Moet je ook een regel voor "de rest weigeren" maken? Waarom wel of niet?
    3. **Bewust verkeerd plaatsen:** zet ACL 10 **inkomend** op E0/1 (Verkoop). Test opnieuw vanaf PC-VK naar **beide** servers. Wat gaat er mis? Waarom is een standard ACL dicht bij de bron een slecht idee?
    4. Haal de ACL van E0/1 en zet hem op de juiste plek: zo dicht mogelijk bij de **bestemming**. Welk interface en welke richting? Test opnieuw vanaf alle pc's.
    5. Bekijk `show access-lists` en `show ip interface E1/0`. Wat zie je bij de tellers (matches)?
    6. Probeer met `no access-list 10 permit host 10.91.30.11` één regel te verwijderen. Bekijk daarna `show access-lists`. Wat is er gebeurd? Zet de ACL weer terug.

    ### Deel 3 - Named en bewerken met sequence numbers
    1. De externe salarisadviseur (PC-ADVISEUR, 10.91.20.50, op het Verkoop-LAN) moet ook bij de salarisserver. Vervang ACL 10 door een **named** standard ACL **SALARIS** met dezelfde regels, en zet die op dezelfde plek.
    2. Voeg de adviseur toe als regel met sequence number **15**, dus tussen de bestaande regels in. Bekijk de volgorde met `show access-lists SALARIS`.
    3. Voeg een `remark` toe die uitlegt waarvoor de ACL is.
    4. Test: PC-ADVISEUR mag bij SAL-SRV, PC-VK niet.
    5. Waarom is de **volgorde** van regels belangrijk? Geef een voorbeeld waarbij een regel nooit geraakt zou worden.

    ### Deel 4 - Beheertoegang tot de router
    1. Test vanaf PC-VK en PC-BEHEER: `ssh beheer@10.91.20.1` (of het eigen gateway-adres). Krijg je een wachtwoordprompt? (Je hoeft niet in te loggen; breek af met Ctrl+C.)
    2. Maak een named standard ACL **BEHEER-VTY** die alleen het beheer-LAN toestaat, en koppel die met `access-class` aan de vty-lijnen.
    3. Test opnieuw vanaf beide pc's. Wat is het verschil? Waarom is `access-class` beter dan een ACL op elk interface van de router?

    ## Reflectie
    1. Waarom staat een standard ACL bij voorkeur dicht bij de bestemming?
    2. Wat betekent de impliciete `deny any`, en waar zag je hem in dit lab aan het werk?
    3. Wat is het voordeel van een named ACL ten opzichte van een numbered ACL?

    Je docent bespreekt daarna je antwoorden.
  title: Lab 4.6.1 - Wie mag bij de salarisadministratie
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
