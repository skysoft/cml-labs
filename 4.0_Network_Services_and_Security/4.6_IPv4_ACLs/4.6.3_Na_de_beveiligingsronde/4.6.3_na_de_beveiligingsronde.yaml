    configuration:
      - name: ios_config.txt
        content: |-
          hostname R1
          no ip domain lookup
          ip domain name lab.local
          username beheer privilege 15 algorithm-type scrypt secret Beheer2026
          crypto key generate rsa modulus 2048
          ip ssh version 2
          !
          ip access-list standard BEHEER-VTY
           remark alleen het beheer-LAN mag de routers beheren
           permit 10.93.30.0 0.0.0.255
          !
          ip access-list extended VERKOOP-IN
           remark Verkoop: alleen web (http/https) naar WEB en ping
           5 deny ip 10.93.20.0 0.0.0.255 10.93.100.0 0.0.0.255
           10 permit tcp 10.93.20.0 0.0.0.255 host 10.93.100.80 eq 80
           20 permit tcp 10.93.20.0 0.0.0.255 host 10.93.100.80 eq 433
           30 permit icmp 10.93.20.0 0.0.0.255 any echo
          !
          interface Ethernet0/0
           description LAN HR
           ip address 10.93.10.1 255.255.255.0
           no shutdown
          !
          interface Ethernet0/1
           description LAN Verkoop
           ip address 10.93.20.1 255.255.255.0
           ip access-group VERKOOP-IN in
           no shutdown
          !
          interface Ethernet0/2
           description LAN Beheer
           ip address 10.93.30.1 255.255.255.0
           no shutdown
          !
          interface Ethernet0/3
           description Naar R2 (serverlocatie)
           ip address 10.93.255.1 255.255.255.252
           ip ospf network point-to-point
           no shutdown
          !
          router ospf 1
           router-id 1.1.1.1
           passive-interface Ethernet0/0
           passive-interface Ethernet0/1
           passive-interface Ethernet0/2
           network 10.93.0.0 0.0.255.255 area 0
          !
          line vty 0 4
           access-class BEHEER-VTY out
           login local
           transport input ssh
          !
          line con 0
           exec-timeout 0 0
           logging synchronous
          !
          end
