lab:
  description: CCNA 200-301 v2.0 - leerdoel 4.6. Troubleshootinglab met 6 fouten in
    standard/extended ACL's en hun plaatsing.
  notes: |-
    # Lab 4.6.3 - Na de beveiligingsronde

    **Leerdoel (CCNA 200-301 v2.0, 4.6):** IPv4-access control lists configureren (standard, extended, numbered en named).

    ## Scenario
    Een externe partij heeft in één avond het hele ACL-beleid ingevoerd op de vestigingsrouter (R1) en de router van de serverlocatie (R2). De volgende ochtend werkt er weinig meer, en een pentester heeft ook nog een bevinding.

    **Er zitten 6 fouten in dit lab.** Alle fouten zitten in de ACL's of in de manier waarop ze zijn toegepast. Routering (OSPF) en adressering zijn verder correct.

    ## Klachten
    1. De serverlocatie (achter R2) is vanaf de vestiging helemaal niet meer bereikbaar.
    2. HR kan niet bij de salarisserver.
    3. Verkoop kan de webshop niet bereiken, via http noch https.
    4. De pentester meldt: "Vanaf het HR-LAN krijg je een inlogprompt van R1."

    ## Ontwerp (het beveiligingsbeleid)
    | ACL | Router, interface, richting | Doel |
    |---|---|---|
    | **SALARIS** (standard) | R2 E0/2 (salarisserver), **out** | alleen HR (10.93.10.0/24) en de beheer-pc 10.93.30.11 mogen bij de salarisserver |
    | **VERKOOP-IN** (extended) | R1 E0/1 (Verkoop), **in** | Verkoop mag alleen http (80) en https (443) naar WEB 10.93.100.80, en pingen; verder niets |
    | **BEHEER-VTY** (standard) | vty-lijnen van R1 en R2, **access-class in** | alleen het beheer-LAN (10.93.30.0/24) mag via SSH op de routers |
    | **VAN-VESTIGING** (extended) | R2 E0/0 (link naar R1), **in** | alleen verkeer met als bron één van de drie vestigings-LAN's (10.93.10/20/30.0/24) toelaten, en daarnaast het **routeringsprotocol** (OSPF); al het andere weigeren en loggen |

    ## Topologie
    | Locatie | Netwerk | Hosts |
    |---|---|---|
    | R1 E0/0 | HR 10.93.10.0/24 | PC-HR .11 |
    | R1 E0/1 | Verkoop 10.93.20.0/24 | PC-VK .11 |
    | R1 E0/2 | Beheer 10.93.30.0/24 | PC-BEHEER .11 (beheer-pc), PC-STAGE .20 (stagiair) |
    | R1 E0/3 - R2 E0/0 | link 10.93.255.0/30 | OSPF area 0 |
    | R2 E0/1 | Servers 10.93.100.0/24 | WEB .80 (poort 80 en 443) |
    | R2 E0/2 | Salarisserver 10.93.110.0/24 | SAL-SRV .10 (poort 80) |

    ## Inloggen
    - Routers: console, geen wachtwoord.
    - Alle Alpine-nodes: gebruiker **cisco** / wachtwoord **cisco**.

    **Testen:**
    - `nc -w 2 <adres> <poort> </dev/null` (de dienst stuurt een tekst als de verbinding lukt).
    - Inlogprompt van een router: `ssh beheer@<adres>`. Een wachtwoordprompt betekent "toegelaten"; breek af met Ctrl+C.

    ## Opdracht
    1. Zoek en herstel de 6 fouten. Herstel elke fout met zo min mogelijk wijzigingen. Houd een **foutenlog** bij:

    | # | Router | ACL / interface | Symptoom | Oorzaak | Oplossing | Hoe geverifieerd |
    |---|---|---|---|---|---|---|

    2. Toon na afloop met tests aan dat **elke regel van het beleid** klopt. Laat dus ook zien wat **niet** mag: Verkoop en de stagiair-pc niet bij de salarisserver, Verkoop geen SSH naar WEB, HR en Verkoop geen inlogprompt op de routers.

    ## Reflectie
    1. Welke fout verborg een andere fout? Hoe merkte je dat?
    2. Welke fout zou je zonder tests van "wat níet mag" nooit gevonden hebben?

    Je docent bespreekt daarna je foutenlog.
  title: Lab 4.6.3 - Na de beveiligingsronde
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
