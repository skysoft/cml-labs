    border_style: ''
    color: '#1F4E79'
    rotation: 0
    text_bold: false
    text_content: |-
      LAB 4.6.3 - NA DE BEVEILIGINGSRONDE
       Er zitten 6 fouten in dit lab (ACL's en hun toepassing).
       R1: HR .10, Verkoop .20, Beheer .30 (10.93.x.0/24) - OSPF - R2: WEB 10.93.100.80, SAL-SRV 10.93.110.10
       ACL's: SALARIS, VERKOOP-IN, BEHEER-VTY, VAN-VESTIGING (zie het ontwerp)
      Test: nc -w 2 <adres> <poort> </dev/null
      Ontwerp en opdracht: open de Lab Notes (tabblad Notes).
      Login Alpine-nodes: cisco / cisco
    text_font: monospace
    text_italic: false
    text_size: 12
    text_unit: pt
    thickness: 1
    type: text
    x1: -820.0
    y1: -440.0
    z_index: 1
smart_annotations: []
nodes:
