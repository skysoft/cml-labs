          cat > /tmp/users.add <<'EOF'
          radadmin Cleartext-Password := "RadAdmin1"
                  Service-Type = NAS-Prompt-User,
                  Cisco-AVPair = "shell:priv-lvl=15"
          radoper Cleartext-Password := "RadOper1"
                  Service-Type = NAS-Prompt-User,
                  Cisco-AVPair = "shell:priv-lvl=1"
          EOF
          (for i in $(seq 1 40); do apk add -q freeradius >/dev/null 2>&1 && break; sleep 10; done;
           cat /tmp/clients.add >> /etc/raddb/clients.conf;
           cat /tmp/users.add /etc/raddb/mods-config/files/authorize > /tmp/authorize;
           cp /tmp/authorize /etc/raddb/mods-config/files/authorize;
           sed -i 's/^\(\s*auth = \)no/\1yes/' /etc/raddb/radiusd.conf;
