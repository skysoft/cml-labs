lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 4.1. Configuratielab: router als AAA-client
    met TACACS+ (R1) en RADIUS (R2), method lists met lokale fallback, autorisatie
    en accounting.'
  notes: |-
    # Lab 4.1.2 - Eén loket voor alle inlogs

    **Leerdoel (CCNA 200-301 v2.0, 4.1):** netwerkapparaten configureren met lokale gebruikersnamen en als **AAA-client (TACACS+ en RADIUS)** voor beheer.

    ## Scenario
    Met lokale accounts moet je op elke router elke gebruiker apart bijhouden. Daarom stapt het bedrijf over op centrale authenticatie:
    - **R1** gaat inloggen controleren via de **TACACS+-server**;
    - **R2** via de **RADIUS-server**.

    Op beide routers staat al een lokaal **noodaccount** (`nood`), SSH werkt al, en de vty-lijnen gebruiken nu nog de lokale database.

    **Jij configureert alleen de routers (de AAA-clients).** De servers staan kant-en-klaar en pas je niet aan; je mag er wel op inloggen om de logs te bekijken.

    ## Topologie
    | Apparaat | Adres | Rol |
    |---|---|---|
    | R1 | Loopback0 10.52.1.1 | AAA-client (TACACS+) |
    | R2 | Loopback0 10.52.2.2 | AAA-client (RADIUS) |
    | TACACS-SRV | 10.52.100.10 | TACACS+-server, TCP 49, key `tacacs123` |
    | RADIUS-SRV | 10.52.100.20 | FreeRADIUS, UDP 1812/1813, key `radius123` |
    | BEHEER-PC | 10.52.10.50 | beheer-pc (ssh-client) |
    | EDGE | - | verbindt alles en geeft de servers internet |

    De servers accepteren alleen verzoeken die afkomstig zijn van het **Loopback0-adres** van de router.

    | Account | Wachtwoord | Waar | Privilegeniveau |
    |---|---|---|---|
    | tacadmin / tacoper | TacAdmin1 / TacOper1 | TACACS-SRV | 15 / 1 |
    | radadmin / radoper | RadAdmin1 / RadOper1 | RADIUS-SRV | 15 / 1 |
    | nood | Nood2026 | lokaal op R1 en R2 | 15 |

    Na het starten installeren de servers hun software via internet. Dat duurt een paar minuten; wacht daarom ongeveer **5 minuten** voordat je gaat testen. Op TACACS-SRV staat de log in `/var/log/tacplus.log`, op RADIUS-SRV in `/var/log/radius/radius.log`.

    ## Inloggen
    - Routers: console (direct beheerdersniveau, zie hieronder).
    - Servers en BEHEER-PC (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**. Gebruik `sudo` om de serverlog te lezen.

    ## Opdrachten

    ### Deel 1 - Voorbereiding: de console beschermen
    Zodra je `aaa new-model` aanzet, gaan **alle** lijnen standaard de lokale database gebruiken, ook de console. In dit lab wil je dat de console altijd bereikbaar blijft (noodtoegang voor jou en je docent).
    1. Zet op R1 en R2 AAA aan en maak meteen een method list **CONSOLE** voor login-authenticatie met als methode **none**. Koppel die aan de console.
    2. In de praktijk gebruik je op de console meestal `local` in plaats van `none`. Waarom kiezen we hier voor `none`, en waarom is dat in productie geen goed idee?

    ### Deel 2 - R1 als TACACS+-client
    1. Definieer de TACACS+-server (naam TACSRV, adres en key) en zet hem in een servergroep **TACGROUP**.
    2. Zorg dat R1 zijn TACACS+-verkeer verstuurt vanaf **Loopback0**.
    3. Maak een method list **VTY** voor login-authenticatie: eerst TACGROUP, en alleen als die niet bereikbaar is de lokale database.
    4. Maak voor exec-autorisatie een method list **VTY** met dezelfde volgorde, zodat de server het privilegeniveau bepaalt.
    5. Zet accounting aan voor exec-sessies (start en stop) naar TACGROUP.
    6. Koppel de VTY-lijsten aan de vty-lijnen.

    ### Deel 3 - R2 als RADIUS-client
    1. Definieer de RADIUS-server (naam RADSRV, adres, authenticatie- en accountingpoort, key) en zet hem in een servergroep **RADGROUP**.
    2. Zorg dat R2 zijn RADIUS-verkeer verstuurt vanaf **Loopback0**.
    3. Maak op R2 dezelfde soort method lists **VTY** (authenticatie en exec-autorisatie), maar met RADGROUP.
    4. Koppel ze aan de vty-lijnen.

    ### Deel 4 - Testen
    1. Log vanaf BEHEER-PC met SSH in op R1 als **tacadmin** en als **tacoper**, en op R2 als **radadmin** en **radoper**. Controleer telkens `show privilege`. Waar komt het privilegeniveau vandaan?
    2. Kun je op R1 inloggen met **radadmin**? En met **nood**? Verklaar.
    3. Bekijk de serverlogs. Welke regels zie je bij een geslaagde inlog, een mislukte inlog en (bij TACACS+) bij autorisatie en accounting?
    4. Bekijk op de routers `show aaa servers` en `show tacacs`. Welke tellers zijn opgelopen?

    ### Deel 5 - De server valt uit
    1. Stop TACACS-SRV in CML (rechtermuisknop, *Stop*).
    2. Probeer op R1 in te loggen als **tacadmin** en als **nood**. Wat werkt er nog, en waarom?
    3. Start TACACS-SRV weer. (Na het starten duurt het weer even voordat de server werkt.) Kun je nu met nood inloggen? Leg het verschil uit tussen "server niet bereikbaar" en "server zegt nee".

    ### Deel 6 - Vergelijking
    | Kenmerk | TACACS+ | RADIUS |
    |---|---|---|
    | Transportprotocol en poort(en) | | |
    | Wat wordt er versleuteld? | | |
    | Authenticatie en autorisatie apart of samen? | | |
    | Geschikt voor commando-autorisatie? | | |
    | Typisch gebruik | | |

    ## Reflectie
    1. Waarom staat `local` áchter de servergroep in de method list en niet ervoor?
    2. Waarom laat je de router een vast bronadres (Loopback0) gebruiken voor AAA-verkeer?
    3. Wat betekent de A van accounting, en waarom is dat nuttig voor een beheerafdeling?

    Je docent bespreekt daarna je antwoorden.
