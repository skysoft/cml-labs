lab:
  description: CCNA 200-301 v2.0 - leerdoel 4.1. Troubleshootinglab met 5 fouten in
    de AAA-clientconfiguratie (TACACS+ en RADIUS).
  notes: |-
    # Lab 4.1.3 - Buitengesloten

    **Leerdoel (CCNA 200-301 v2.0, 4.1):** netwerkapparaten configureren met lokale gebruikersnamen en als AAA-client (TACACS+ en RADIUS) voor beheer.

    ## Scenario
    Een externe partij heeft drie routers aangesloten op de centrale AAA-servers. Sinds de oplevering klagen de beheerders dat ze niet (goed) op de routers kunnen inloggen.

    **Er zitten 5 fouten in dit lab.** Alle fouten zitten in de AAA- of beheerconfiguratie van de **routers**. De servers zijn correct en pas je niet aan; je mag er wel op inloggen om de logs te bekijken.

    ## Klachten
    1. Op **R1** komen de beheerders met hun TACACS+-account niet binnen. Met het noodaccount lukt het wel.
    2. Op **R2** duurt inloggen met een RADIUS-account erg lang en mislukt het daarna. Met het noodaccount lukt het pas na een flinke wachttijd.
    3. Op **R3** komt niemand meer binnen via SSH, ook niet met het noodaccount.

    ## Ontwerp
    | Onderdeel | Ontwerp |
    |---|---|
    | R1 en R3 | AAA-client van **TACACS-SRV** 10.53.100.10, TCP 49, key `tacacs123`, groep TACGROUP |
    | R2 | AAA-client van **RADIUS-SRV** 10.53.100.20, UDP **1812/1813**, key `radius123`, groep RADGROUP |
    | Bronadres AAA-verkeer | altijd **Loopback0** (de servers accepteren alleen de loopbackadressen 10.53.1.1, 10.53.2.2 en 10.53.3.3) |
    | Login (vty) | method list VTY: eerst de servergroep, **lokaal alleen als de server niet bereikbaar is** |
    | Exec-autorisatie (vty) | method list VTY: servergroep, dan lokaal. Het privilegeniveau komt van de server (beheerders krijgen 15) |
    | Accounting | TACACS+-routers: exec start-stop naar TACGROUP |
    | Console | method list CONSOLE (none): noodtoegang voor het lab |
    | Beheer | alleen SSH op de vty-lijnen |

    | Account | Wachtwoord | Waar | Privilegeniveau |
    |---|---|---|---|
    | tacadmin / tacoper | TacAdmin1 / TacOper1 | TACACS-SRV | 15 / 1 |
    | radadmin / radoper | RadAdmin1 / RadOper1 | RADIUS-SRV | 15 / 1 |
    | nood | Nood2026 | lokaal op elke router | 15 |

    Test vanaf **BEHEER-PC** (10.53.10.50) met `ssh <account>@10.53.N.N` naar het loopbackadres van de router. De servers installeren hun software na het starten via internet; wacht ongeveer **5 minuten**. Logs: TACACS-SRV `/var/log/tacplus.log`, RADIUS-SRV `/var/log/radius/radius.log` (lezen met `sudo`).

    ## Inloggen
    - Routers: console (noodtoegang, direct beheerdersniveau).
    - Servers en BEHEER-PC (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Opdracht
    1. Zoek en herstel de 5 fouten. Gebruik `show aaa servers`, `show tacacs`, `show running-config | section aaa|tacacs|radius|line`, `test aaa group …` en de serverlogs. Houd een **foutenlog** bij:

    | # | Router | Symptoom (log, teller, test) | Oorzaak | Oplossing (commando's) | Hoe geverifieerd |
    |---|---|---|---|---|---|

    2. Toon na afloop aan dat op elke router een beheerder met het juiste privilegeniveau binnenkomt, en dat het noodaccount werkt als de AAA-server uitvalt.

    ## Reflectie
    1. Bij welke fout gaf de serverlog de doorslag, en bij welke juist de router?
    2. Waarom is een method list zonder `local` op het einde gevaarlijk?

    Je docent bespreekt daarna je foutenlog.
  title: Lab 4.1.3 - Buitengesloten
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
