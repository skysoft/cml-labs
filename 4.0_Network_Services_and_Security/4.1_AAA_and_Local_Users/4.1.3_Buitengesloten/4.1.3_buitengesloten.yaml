    configuration:
      - name: node.cfg
        content: |-
          hostname TACACS-SRV
          USERNAME=cisco
          PASSWORD=cisco
          # standaard-DHCP-client van het image uitschakelen (statische host)
          sed -i 's/iface eth0 inet dhcp/iface eth0 inet manual/' /etc/network/interfaces
          pkill udhcpc 2>/dev/null
          ip addr flush dev eth0
          ip link set dev eth0 up
          ip address add 10.53.100.10/24 dev eth0
          ip route add default via 10.53.100.1
          echo "nameserver 8.8.8.8" > /etc/resolv.conf
          # --- TACACS+-server (lab): script, configuratie en starten ---
          mkdir -p /opt
          cat > /opt/tacplus.py <<'PYEOF'
          #!/usr/bin/env python3
          # Eenvoudige TACACS+-server (RFC 8907) voor CCNA-labs.
          # Ondersteunt: authenticatie (ASCII en PAP), exec-autorisatie (priv-lvl), accounting.
          # Configuratie: /etc/tacplus.conf   Log: /var/log/tacplus.log
          import hashlib
          import os
          import socket
          import struct
          import threading
          import time

          CONF = os.environ.get("TACPLUS_CONF", "/etc/tacplus.conf")
          LOG = os.environ.get("TACPLUS_LOG", "/var/log/tacplus.log")
          PORT = int(os.environ.get("TACPLUS_PORT", "49"))


          def log(msg):
              line = time.strftime("%Y-%m-%d %H:%M:%S ") + msg
              print(line, flush=True)
              with open(LOG, "a") as f:
                  f.write(line + "\n")


          def load():
              key, clients, users = "", [], {}
              for raw in open(CONF):
                  p = raw.split("#")[0].split()
                  if not p:
                      continue
                  if p[0] == "key":
                      key = p[-1]
                  elif p[0] == "client":
                      clients.append(p[1])
                  elif p[0] == "user":
                      users[p[1]] = (p[2], int(p[3]))
              return key, clients, users


          def crypt(hdr, body, key):
              sid, ver, seq = hdr[4:8], hdr[0], hdr[2]
              out, prev = b"", b""
              while len(out) < len(body):
                  prev = hashlib.md5(sid + key.encode() + bytes([ver, seq]) + prev).digest()
                  out += prev
              return bytes(a ^ b for a, b in zip(body, out))


          def recv_exact(c, n):
              data = b""
              while len(data) < n:
                  chunk = c.recv(n - len(data))
                  if not chunk:
                      raise EOFError
                  data += chunk
              return data


          def send(c, req_hdr, body, key):
              hdr = bytes([req_hdr[0], req_hdr[1], req_hdr[2] + 1, req_hdr[3] & 0x04]) + req_hdr[4:8] + struct.pack("!I", len(body))
              c.sendall(hdr + crypt(hdr, body, key))


          class BadKey(Exception):
              pass


          def authen_reply(status, msg="", flags=0):
              m = msg.encode()
              return struct.pack("!BBHH", status, flags, len(m), 0) + m


          def check_login(users, user, pw, nas):
              ok = user in users and users[user][0] == pw
              log(f"AUTHENTICATIE {'GESLAAGD' if ok else 'MISLUKT'}: gebruiker={user or '-'} router={nas}")
              return authen_reply(1 if ok else 2, "" if ok else "Ongeldige gebruikersnaam of wachtwoord")


          def handle(c, addr):
              nas = addr[0]
              key, clients, users = load()
              if clients and nas not in clients:
                  log(f"GEWEIGERD: {nas} staat niet als client in {CONF}; verbinding gesloten")
                  c.close()
                  return
              pending = {}
              try:
                  while True:
                      hdr = recv_exact(c, 12)
                      length = struct.unpack("!I", hdr[8:12])[0]
                      body = recv_exact(c, length)
                      if not hdr[3] & 0x01:
                          body = crypt(hdr, body, key)
                      sid = hdr[4:8]
                      ptype = hdr[1]
                      if ptype == 1 and hdr[2] == 1:  # authenticatie START
                          action, priv, atype, svc, ul, pl, rl, dl = body[:8]
                          if 8 + ul + pl + rl + dl != len(body) or not 1 <= atype <= 8:
                              raise BadKey
                          user = body[8:8 + ul].decode(errors="replace")
                          off = 8 + ul + pl + rl
                          data = body[off:off + dl].decode(errors="replace")
                          if atype == 2:  # PAP
                              send(c, hdr, check_login(users, user, data, nas), key)
                          else:  # ASCII-dialoog
                              pending[sid] = user
                              if user:
                                  send(c, hdr, authen_reply(5, "Password: ", 0x01), key)
                              else:
                                  send(c, hdr, authen_reply(4, "Username: "), key)
                      elif ptype == 1:  # authenticatie CONTINUE
                          uml, dl, flags = struct.unpack("!HHB", body[:5])
                          if 5 + uml + dl != len(body):
                              raise BadKey
                          msg = body[5:5 + uml].decode(errors="replace")
                          if not pending.get(sid):
                              pending[sid] = msg
                              send(c, hdr, authen_reply(5, "Password: ", 0x01), key)
                          else:
                              send(c, hdr, check_login(users, pending.pop(sid), msg, nas), key)
                      elif ptype == 2:  # autorisatie
                          meth, priv, atype, svc, ul, pl, rl, ac = body[:8]
                          lens = list(body[8:8 + ac])
                          if 8 + ac + ul + pl + rl + sum(lens) != len(body):
                              raise BadKey
                          off = 8 + ac
                          user = body[off:off + ul].decode(errors="replace")
                          off += ul + pl + rl
                          args = []
                          for n in lens:
                              args.append(body[off:off + n].decode(errors="replace"))
                              off += n
                          cmd = next((a.split("=", 1)[1] for a in args if a.startswith("cmd=")), "")
                          if user not in users:
                              log(f"AUTORISATIE GEWEIGERD: onbekende gebruiker={user} router={nas}")
                              reply = struct.pack("!BBHH", 0x10, 0, 0, 0)
                          elif cmd:
                              log(f"AUTORISATIE commando toegestaan: gebruiker={user} commando='{cmd}' router={nas}")
                              reply = struct.pack("!BBHH", 0x01, 0, 0, 0)
                          else:
                              lvl = f"priv-lvl={users[user][1]}".encode()
                              log(f"AUTORISATIE exec: gebruiker={user} {lvl.decode()} router={nas}")
                              reply = struct.pack("!BBHH", 0x01, 1, 0, 0) + bytes([len(lvl)]) + lvl
                          send(c, hdr, reply, key)
                      elif ptype == 3:  # accounting
                          flags, meth, priv, atype, svc, ul, pl, rl, ac = body[:9]
                          lens = list(body[9:9 + ac])
                          if 9 + ac + ul + pl + rl + sum(lens) != len(body):
                              raise BadKey
                          off = 9 + ac
                          user = body[off:off + ul].decode(errors="replace")
                          off += ul + pl + rl
                          args = []
                          for n in lens:
                              args.append(body[off:off + n].decode(errors="replace"))
                              off += n
                          kind = "START" if flags & 0x02 else "STOP" if flags & 0x04 else "UPDATE"
                          log(f"ACCOUNTING {kind}: gebruiker={user} router={nas} {' '.join(args)}")
                          send(c, hdr, struct.pack("!HHB", 0, 0, 1), key)
              except BadKey:
                  log(f"FOUT: pakket van {nas} niet te ontsleutelen, de shared key klopt niet; verbinding gesloten")
              except (EOFError, ConnectionResetError, OSError):
                  pass
              finally:
                  c.close()


          def main():
              s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              s.bind(("0.0.0.0", PORT))
              s.listen(16)
              log(f"TACACS+-server gestart op TCP-poort {PORT}")
              while True:
                  c, addr = s.accept()
                  threading.Thread(target=handle, args=(c, addr), daemon=True).start()


          if __name__ == "__main__":
              main()
          PYEOF
          cat > /etc/tacplus.conf <<'EOF'
          key = tacacs123
          client 10.53.1.1
          client 10.53.3.3
          user tacadmin TacAdmin1 15
          user tacoper TacOper1 1
          EOF
          # python3 installeren via internet (kan even duren na het opstarten) en de server starten
          (for i in $(seq 1 40); do apk add -q python3 >/dev/null 2>&1 && break; sleep 10; done; nohup python3 /opt/tacplus.py >/dev/null 2>&1 &) &
