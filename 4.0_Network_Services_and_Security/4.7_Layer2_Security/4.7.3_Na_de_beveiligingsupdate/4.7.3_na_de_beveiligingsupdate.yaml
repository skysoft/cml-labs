lab:
  description: CCNA 200-301 v2.0 - leerdoel 4.7. Troubleshooting laag-2-beveiliging
    (5 fouten).
  notes: |-
    # Lab 4.7.3 - Na de beveiligingsupdate

    **Leerdoel (CCNA 200-301 v2.0, 4.7):** laag-2-beveiligingsfuncties (DHCP snooping, DAI, port security, RA guard) **troubleshooten**.

    ## Scenario
    Een collega heeft gisteren de laag-2-beveiliging op twee switches ingericht. Sindsdien komen er klachten binnen. In de configuratie zitten **5 fouten**. Vind ze, los ze op en controleer dat de beveiliging daarna nog steeds werkt.

    ## Topologie
    | Switch | Poort | Apparaat | VLAN / netwerk |
    |---|---|---|---|
    | SW-A (IOSvL2) | Gi0/0 | trunk naar R-GW (gateway en DHCP-server) | 20 en 40 |
    | SW-A | Gi0/1 | PC1 (DHCP) | 20 kantoor, 10.73.20.0/24 |
    | SW-A | Gi0/2 | PC4 (DHCP) | 40 gasten, 10.73.40.0/24 |
    | SW-A | Gi0/3 | OUDE-TESTROUTER E0/0 | 40 |
    | SW-B (IOL-L2) | E0/0 | R-GW E0/1 | 30, 10.73.30.0/24 en 2001:db8:73:30::/64 |
    | SW-B | E0/1 | PC3 (.11) | 30 |
    | SW-B | E0/2 | OUDE-TESTROUTER E0/1 | 30 |
    | SW-B | E0/3 | flexplek: TELEFOON (.21) en PC5 (.22) via een doorlusaansluiting | 30 |

    De OUDE-TESTROUTER blijft aangesloten: de beveiliging moet hem tegenhouden.

    **SW-A start langzaam** (IOSvL2, ongeveer 5 minuten).

    ## Inloggen
    - Switches en routers: console, geen wachtwoord.
    - Pc's en telefoon (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    **Handige commando's op een pc:**
    - nieuw DHCP-adres aanvragen: `sudo ip addr flush dev eth0; sudo udhcpc -i eth0 -n -q`
    - IPv6-adressen verversen: `sudo ip -6 addr flush dev eth0 scope global; sudo ip -6 route flush default`, wacht daarna 20 seconden; bekijk met `ip -6 addr` en `ip -6 route`.

    ## Klachten
    1. "PC1 op kantoor krijgt helemaal geen IP-adres meer."
    2. "Gasten krijgen soms een adres in 192.168.1.0/24 en kunnen dan niets."
    3. "Op de flexplek werken de telefoon én de pc allebei niet, af en toe een minuutje wel."
    4. "PC3 in het IPv6-lab krijgt een vreemd IPv6-prefix en een andere router dan 2001:db8:73:30::1."

    Let op: als een klacht is opgelost, kan er een nieuwe tevoorschijn komen.

    ## Werkwijze
    Noteer per fout:
    | # | Switch | Symptoom | Oorzaak | Oplossing (commando's) | Hoe getest |
    |---|---|---|---|---|---|
    | 1 | | | | | |
    | 2 | | | | | |
    | 3 | | | | | |
    | 4 | | | | | |
    | 5 | | | | | |

    **Nuttige show-commando's:**
    - `show ip dhcp snooping`, `show ip dhcp snooping binding`, `show ip dhcp snooping statistics`
    - `show ip arp inspection`, `show ip arp inspection statistics`
    - `show port-security`, `show port-security interface ...`, `show interfaces status err-disabled`
    - `show ipv6 nd raguard policy`, `show running-config interface ...`
    - `show logging`

    ## Eindcontrole
    - PC1 en PC4 krijgen een adres van R-GW en kunnen hun gateway pingen.
    - De OUDE-TESTROUTER kan in VLAN 20 en 40 geen adressen meer uitdelen.
    - TELEFOON en PC5 werken allebei, en een derde apparaat op de flexplek wordt nog steeds geweigerd.
    - PC3 ziet alleen het prefix 2001:db8:73:30::/64 met R-GW als router.

    ## Reflectie
    Welke fout verborg een andere fout, en waarom?

    Je docent bespreekt daarna je antwoorden.
  title: Lab 4.7.3 - Na de beveiligingsupdate
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
