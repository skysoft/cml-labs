lab:
  description: CCNA 200-301 v2.0 - leerdoel 4.7. Configuratielab DHCP snooping en
    DAI (IOSvL2), RA guard (IOL-L2), storm control in theorie.
  notes: |-
    # Lab 4.7.2 - De vergeten testrouter

    **Leerdoel (CCNA 200-301 v2.0, 4.7):** laag-2-beveiligingsfuncties configureren: **DHCP snooping**, **Dynamic ARP Inspection**, **RA guard** (en storm control in theorie).

    ## Scenario
    Op twee vrije netwerkaansluitingen is een oude **testrouter** blijven hangen. Die deelt nog steeds IP-adressen uit (DHCP) en kondigt zichzelf aan als IPv6-router (Router Advertisements). Gebruikers krijgen daardoor soms een verkeerd adres of een verkeerde gateway. Met laag-2-beveiliging op de switches voorkom je dat zo'n apparaat, bedoeld of onbedoeld, het netwerk kan verstoren.

    Dit is een **configuratielab**. Er zijn twee switches:
    - **SW-A** (IOSvL2), VLAN 20 kantoor: DHCP snooping en DAI;
    - **SW-B** (IOL-L2), VLAN 30 IPv6-lab: RA guard.

    ## Topologie
    | Switch | Poort | Apparaat |
    |---|---|---|
    | SW-A | Gi0/0 | R-GW E0/0, de **echte** gateway en DHCP-server (10.72.20.1) |
    | SW-A | Gi0/1 / Gi0/2 | PC1 / PC2 (DHCP) |
    | SW-A | Gi0/3 | OUDE-TESTROUTER E0/0 (deelt 192.168.1.0/24 uit) |
    | SW-A | Gi1/0 | PRINTER, vast adres 10.72.20.50 |
    | SW-B | E0/0 | R-GW E0/1, gateway 10.72.30.1 / 2001:db8:72:30::1 |
    | SW-B | E0/1 | PC3 (10.72.30.11, IPv6 via SLAAC) |
    | SW-B | E0/2 | OUDE-TESTROUTER E0/1 (kondigt 2001:db8:72:99::/64 aan) |

    **SW-A start langzaam** (IOSvL2, ongeveer 5 minuten). Wacht tot de console reageert.

    ## Inloggen
    - Switches en routers: console, geen wachtwoord.
    - Pc's en printer (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    **Handige commando's op een pc:**
    - nieuw DHCP-adres aanvragen: `sudo ip addr flush dev eth0; sudo udhcpc -i eth0 -n -q`
    - adressen bekijken: `ip addr`
    - IPv6-adressen verversen: `sudo ip -6 addr flush dev eth0 scope global; sudo ip -6 route flush default`, wacht daarna 20 seconden.

    ## Opdrachten

    ### Deel 1 - Het probleem zien
    1. Vraag op PC1 en PC2 een paar keer een nieuw DHCP-adres aan. Welke adressen en welke servers zie je?
    2. Bekijk op PC3 de IPv6-adressen en de default route (`ip -6 route`). Welke prefixen en routers zie je?
    3. Leg uit waarom een apparaat dat DHCP of RA's verstuurt een risico is, ook als het niet kwaadwillend is.

    ### Deel 2 - DHCP snooping (SW-A)
    1. Zet DHCP snooping aan, globaal en voor VLAN 20.
    2. Welke poort moet **trusted** zijn, en waarom alleen die? Configureer dat.
    3. IOSvL2 voegt standaard optie 82 toe aan DHCP-verzoeken; de DHCP-server van R-GW is daar niet op ingericht. Schakel het invoegen van optie 82 uit.
    4. Vraag op PC1 en PC2 opnieuw een adres aan. Van wie komt het nu?
    5. Bekijk `show ip dhcp snooping binding` en `show ip dhcp snooping statistics`. Wat staat er in de binding-tabel, en waar gebruikt de switch die voor?
    6. Beperk het aantal DHCP-pakketten op de werkplekpoorten tot 10 per seconde. Tegen welk soort probleem helpt dat?

    ### Deel 3 - Dynamic ARP Inspection (SW-A)
    1. Zet DAI aan voor VLAN 20. Welke poort moet hier trusted zijn?
    2. Test vanaf PC1 en PC2 een ping naar de gateway, en vanaf de PRINTER. Wat werkt er nog, en wat niet? Bekijk `show ip arp inspection statistics vlan 20` en de log.
    3. Waarom wordt de printer tegengehouden, terwijl hij een "eerlijk" vast adres heeft?
    4. Los dit op met een **ARP-ACL** voor de printer (IP-adres en MAC-adres), gekoppeld aan DAI voor VLAN 20. Test opnieuw.
    5. Wat zou DAI doen als een apparaat in VLAN 20 zich met ARP voordoet als de gateway 10.72.20.1?

    ### Deel 4 - RA guard (SW-B)
    1. Maak een RA guard-policy **HOSTS** met de rol `host`, en koppel die aan de poorten waar geen router hoort te zitten.
    2. Ververs de IPv6-adressen op PC3. Welke prefixen en routers zie je nu?
    3. Waarom koppel je de policy niet aan E0/0?

    ### Deel 5 - Storm control (theorie)
    De switches in dit lab ondersteunen geen storm control, maar het staat wel in het leerdoel. Beantwoord met behulp van de documentatie of het lesmateriaal:
    1. Wat is een broadcaststorm, en hoe kan die ontstaan?
    2. Schrijf de configuratie voor een toegangspoort (bijvoorbeeld Gi1/0/5 op een Catalyst 9300) die broadcastverkeer boven **1%** van de bandbreedte begrenst, en bij overschrijding een melding stuurt (trap).
    3. Wat is het verschil tussen een drempel in procenten, in pps en in bps? Wat betekenen de twee waarden bij `level 1.00 0.50`?
    4. Wat is het verschil tussen de acties `shutdown` en `trap`? Wat gebeurt er zonder actie?

    ## Reflectie
    1. Welke volgorde moet je aanhouden: eerst DHCP snooping, dan DAI? Waarom?
    2. DHCP snooping, DAI en RA guard hebben allemaal "trusted" of "router"-poorten. Wat hebben die poorten gemeen?

    Je docent bespreekt daarna je antwoorden.
  title: Lab 4.7.2 - De vergeten testrouter
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
