lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 4.7. Configuratielab port security: maximum,
    sticky, violation-modes, errdisable recovery.'
  notes: |-
    # Lab 4.7.1 - Eén poort, één apparaat

    **Leerdoel (CCNA 200-301 v2.0, 4.7):** laag-2-beveiligingsfuncties configureren. Dit lab gaat over **port security**.

    ## Scenario
    In een kantoor kan iedereen een eigen apparaat op een vrije netwerkaansluiting zetten. Het beleid wordt:
    - op de werkplekken (E0/1 en E0/2) mag precies **één** apparaat werken: het apparaat dat er nu staat;
    - in de vergaderruimte (E0/3) hangt een klein switchje met maximaal **twee** apparaten;
    - een onbekend apparaat wordt geweigerd, en de beheerder wil dat merken.

    Dit is een **configuratielab** op switch SW1.

    ## Topologie (VLAN 10, 10.71.10.0/24)
    | Poort SW1 | Apparaat | IPv4 |
    |---|---|---|
    | E0/0 | R1 (gateway) | .1 |
    | E0/1 | PC-BALIE | .11 |
    | E0/2 | PC-KANTOOR | .12 |
    | E0/3 | klein switchje met LAPTOP1 (.21) en LAPTOP2 (.22) | |

    SW1 zelf heeft beheeradres .2.

    ## Inloggen
    - SW1 en R1: console, geen wachtwoord.
    - Pc's en laptops (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    **Een "ander apparaat" nabootsen:** in dit lab geef je een pc een ander MAC-adres:
    `sudo ip link set eth0 down; sudo ip link set eth0 address 52:54:00:12:34:56; sudo ip link set eth0 up`
    Daarna stuur je verkeer met `ping 10.71.10.1`.

    ## Opdrachten

    ### Deel 1 - Port security met sticky learning
    1. Zet port security aan op E0/1 en E0/2: maximaal één MAC-adres, dat de switch zelf leert en **onthoudt** (sticky).
    2. Ping vanaf beide pc's naar R1. Bekijk `show port-security`, `show port-security address` en de running-config van E0/1. Wat is er in de configuratie verschenen?
    3. Waarom is "sticky" handig voor een beheerder die tientallen werkplekken heeft?

    ### Deel 2 - Een onbekend apparaat (violation shutdown)
    1. Geef PC-BALIE een ander MAC-adres (zie boven) en ping naar R1.
    2. Wat gebeurt er met poort E0/1? Bekijk `show interfaces status`, `show port-security interface Ethernet0/1` en de log.
    3. Zet het originele MAC-adres terug (`ip link show eth0` vóór de wijziging noteren!). Werkt de poort dan vanzelf weer?
    4. Herstel de poort handmatig. Welke twee commando's heb je nodig?
    5. Configureer **errdisable recovery** voor port security met een interval van 60 seconden. Test opnieuw: wat gebeurt er nu na een overtreding?

    ### Deel 3 - Restrict en protect
    1. Zet de violation-mode van E0/2 op **restrict**. Herhaal de MAC-wissel op PC-KANTOOR. Wat gebeurt er met de poort, met het verkeer en met de teller "Security Violation Count"?
    2. Wat is het verschil met **protect**? Probeer het, en vergelijk de log en de tellers.
    3. Wanneer zou je welke mode kiezen?

    | Mode | Poort gaat dicht? | Verkeer van onbekend MAC | Log/SNMP-melding | Teller loopt op |
    |---|---|---|---|---|
    | shutdown | | | | |
    | restrict | | | | |
    | protect | | | | |

    ### Deel 4 - De vergaderruimte
    1. Configureer E0/3 voor maximaal **twee** MAC-adressen (sticky). Ping vanaf LAPTOP1 en LAPTOP2.
    2. Wat gebeurt er als er een derde apparaat bij komt? (Wissel op LAPTOP2 van MAC-adres om dat na te bootsen. Let op: het oude adres van LAPTOP2 blijft "bezet".)
    3. Hoe ruim je een geleerd sticky-adres op als een apparaat definitief vervangen wordt?

    ## Reflectie
    1. Port security weert apparaten op MAC-adres. Waarom is dat geen waterdichte beveiliging?
    2. Welke andere maatregel (uit leerdoel 4.1/4.7) zou je naast port security inzetten om te bepalen wie er op het netwerk mag?

    Je docent bespreekt daarna je antwoorden.
  title: Lab 4.7.1 - Een poort, een apparaat
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
