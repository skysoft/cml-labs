lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 4.3. Configuratielab: configureer PAT
    zodat het kantoor het internet op kan.'
  notes: |-
    # Lab 4.3.1 - Het kantoor online

    **Leerdoel (CCNA 200-301 v2.0, 4.3):** NAT/PAT configureren op IOS XE-routers.

    ## Scenario
    Een klein kantoor heeft een glasvezelaansluiting. De bedrijfsrouter EDGE krijgt zijn WAN-adres automatisch via DHCP van de provider (ISP). De ISP-router is verbonden met het **echte internet**; gebruik **8.8.8.8** als testadres.

    Het kantoor gebruikt privé-adressen (RFC 1918). De provider routeert die niet. Jouw taak: zorg dat alle kantoor-PC's via **PAT** (NAT overload) het internet op kunnen, vertaald naar het WAN-adres van EDGE.

    Alles behalve NAT is al correct geconfigureerd.

    ## Topologie en adressen
    | Apparaat | Interface | IP-adres | Opmerking |
    |---|---|---|---|
    | PC1 | eth0 | 192.168.31.11/24 | gateway 192.168.31.1 |
    | PC2 | eth0 | 192.168.31.12/24 | gateway 192.168.31.1 |
    | EDGE | E0/0 (LAN) | 192.168.31.1/24 | kantoorkant |
    | EDGE | E0/1 (WAN) | via DHCP van de ISP (100.64.31.0/29) | providerkant |
    | ISP | E0/1 | 100.64.31.1/29 | DHCP-server voor EDGE |
    | ISP | E0/2 | via DHCP | uplink naar het echte internet |

    De ISP-router is van de provider: je mag hem bekijken, maar niet aanpassen.

    Na het starten kan het tot ongeveer een minuut duren voordat EDGE zijn WAN-adres heeft. Duurt het langer, gebruik dan `renew dhcp Ethernet0/1`.

    ## Inloggen
    - Routers: console, geen wachtwoord.
    - PC's (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Opdrachten

    ### Deel 1 - Theorie
    1. Leg uit wat de begrippen **inside local**, **inside global**, **outside local** en **outside global** betekenen.
    2. Wat is het verschil tussen NAT en PAT? Waarom is PAT de standaard voor een kantoor met één publiek adres?
    3. Welke drie onderdelen heeft een PAT-configuratie op een IOS-router minimaal nodig?

    ### Deel 2 - Uitgangssituatie
    1. Welk WAN-adres heeft EDGE gekregen? (`show ip interface brief`, `show dhcp lease`)
    2. Ping vanaf EDGE naar 8.8.8.8. Werkt dat?
    3. Ping vanaf PC1 naar 8.8.8.8. Werkt dat? Leg uit waarom het verschil tussen 2 en 3 er is.

    ### Deel 3 - PAT configureren op EDGE
    Configureer op EDGE, zonder de ISP-router aan te passen:
    1. Geef elke interface van EDGE de juiste NAT-rol (inside of outside).
    2. Maak een **standaard-ACL** met de naam `NAT-KANTOOR` die precies het kantoornetwerk selecteert.
    3. Configureer PAT: het verkeer uit de ACL wordt vertaald naar het adres van de **WAN-interface** (overload).

    Tip: omdat het WAN-adres via DHCP komt, moet je naar de interface verwijzen en niet naar een vast adres.

    ### Deel 4 - Verificatie en analyse
    1. Ping vanaf PC1 en PC2 (tegelijk, bijvoorbeeld `ping -c 20 8.8.8.8`) naar 8.8.8.8.
    2. Bekijk op EDGE `show ip nat translations` en `show ip nat statistics`.
    3. Vul voor de vertalingen van PC1 en PC2 deze tabel in:

    | | Inside local | Inside global | Outside local | Outside global |
    |---|---|---|---|---|
    | PC1 | | | | |
    | PC2 | | | | |

    4. PC1 en PC2 gebruiken hetzelfde inside global-adres. Hoe houdt EDGE de verbindingen uit elkaar?
    5. Wis de vertalingen (`clear ip nat translation *`) en kijk wat er gebeurt met een lopende ping.

    ### Deel 5 - Reflectie
    1. Verwijder je NAT-regel en voer hem opnieuw in, maar nu **zonder** het woord `overload`. Bekijk daarna `show running-config | include ip nat inside source`. Wat valt je op, en werken beide PC's nog?
    2. Waarom is er in de vertalingstabel geen verschil tussen outside local en outside global?
    3. Waarom kan iemand op internet een kantoor-PC niet uit zichzelf bereiken, zelfs als hij het WAN-adres kent?

    Je docent bespreekt daarna je antwoorden.
  title: Lab 4.3.1 - Het kantoor online
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
