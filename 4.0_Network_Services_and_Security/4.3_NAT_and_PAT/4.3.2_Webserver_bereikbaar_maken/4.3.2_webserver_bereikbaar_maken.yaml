lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 4.3. Configuratielab: static NAT, static
    PAT (port forwarding) en PAT.'
  notes: |-
    # Lab 4.3.2 - Webserver bereikbaar maken

    **Leerdoel (CCNA 200-301 v2.0, 4.3):** NAT/PAT configureren op IOS XE-routers.

    ## Scenario
    Het bedrijf heeft van de provider het publieke blok **203.0.113.32/29** gekregen. Op het interne netwerk staan een webserver (SRV-WEB), een beheerhost (BEHEER) en een werkplek (PC1). Jouw taak:
    - De **webserver** moet van buitenaf bereikbaar zijn op een eigen publiek adres: **203.0.113.35** (static NAT).
    - De **beheerhost** moet via SSH bereikbaar zijn op het WAN-adres van EDGE, poort **2222** (static PAT / port forwarding naar poort 22).
    - Alle andere interne hosts gaan via **PAT** naar buiten op het WAN-adres van EDGE.

    INET-PC staat voor "een willekeurige computer op internet". De ISP-router is daarnaast verbonden met het **echte internet** (test: 8.8.8.8).

    Alles behalve NAT is al correct geconfigureerd.

    ## Adressen
    | Apparaat | Interface | IP-adres | Opmerking |
    |---|---|---|---|
    | SRV-WEB | eth0 | 192.168.32.10/24 | webserver (poort 80) |
    | BEHEER | eth0 | 192.168.32.20/24 | SSH-server (poort 22) |
    | PC1 | eth0 | 192.168.32.11/24 | werkplek |
    | EDGE | E0/0 (LAN) | 192.168.32.1/24 | gateway intern |
    | EDGE | E0/1 (WAN) | 203.0.113.34/29 | publiek WAN-adres |
    | ISP | E0/1 | 203.0.113.33/29 | gateway van EDGE |
    | ISP | E0/0 | 198.51.100.1/24 | netwerk van INET-PC |
    | INET-PC | eth0 | 198.51.100.10/24 | testcomputer op internet |

    Publieke adressen van het bedrijf: 203.0.113.34 (WAN/PAT), 203.0.113.35 (webserver), .36-.38 nog vrij.

    De ISP-router is van de provider: je mag hem bekijken, maar niet aanpassen.

    ## Inloggen
    - Routers: console, geen wachtwoord.
    - Hosts (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Opdrachten

    ### Deel 1 - Theorie
    1. Wat is het verschil tussen static NAT en static PAT (port forwarding)?
    2. Waarom heeft de webserver een vaste vertaling nodig, terwijl PC1 genoeg heeft aan PAT?
    3. Mag een static NAT-regel hetzelfde publieke adres gebruiken als de PAT-regel? En een port forward?

    ### Deel 2 - Uitgangssituatie
    1. Test vanaf INET-PC de webserver: `wget -qO- http://203.0.113.35`
    2. Test vanaf INET-PC de SSH-poort: `echo | nc -w 3 203.0.113.34 2222`
    3. Test vanaf PC1: `ping -c 3 8.8.8.8`

    ### Deel 3 - Configureren op EDGE
    1. Geef de interfaces de juiste NAT-rol.
    2. Configureer **static NAT** voor SRV-WEB naar 203.0.113.35.
    3. Configureer **static PAT**: TCP-poort 2222 op 203.0.113.34 wordt doorgestuurd naar TCP-poort 22 op BEHEER.
    4. Configureer **PAT** voor het hele interne netwerk naar het WAN-adres. Gebruik een standaard-ACL met de naam `NAT-INTERN`.

    ### Deel 4 - Verificatie en analyse
    1. Herhaal de tests uit deel 2. Bij de SSH-test moet een regel verschijnen die begint met `SSH-2.0`.
    2. Bekijk `show ip nat translations`. Welke regels zijn er al zonder dat er verkeer is geweest, en waarom?
    3. Vul voor de webservertest vanaf INET-PC de vier adresbegrippen in (inside local, inside global, outside local, outside global).
    4. Ping vanaf SRV-WEB naar 8.8.8.8. Met welk publiek adres gaat de webserver naar buiten: .34 of .35? Verklaar.

    ### Deel 5 - Reflectie
    1. Waarom kan INET-PC de webserver bereiken op .35, maar PC1 niet vanaf buiten (zonder eigen static regel)?
    2. Wat zou er gebeuren als je voor de port forward `udp` in plaats van `tcp` had gebruikt?
    3. Waarom moet de provider het blok 203.0.113.32/29 naar EDGE routeren om static NAT te laten werken?

    Je docent bespreekt daarna je antwoorden.
  title: Lab 4.3.2 - Webserver bereikbaar maken
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
