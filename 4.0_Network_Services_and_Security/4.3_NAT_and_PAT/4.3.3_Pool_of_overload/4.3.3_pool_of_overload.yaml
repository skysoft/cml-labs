lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 4.3. Configuratielab: dynamische NAT
    met een pool, uitputting van de pool, daarna PAT (overload) op een pool.'
  notes: |-
    # Lab 4.3.3 - Pool of overload?

    **Leerdoel (CCNA 200-301 v2.0, 4.3):** NAT/PAT configureren op IOS XE-routers.

    ## Scenario
    Het bedrijf heeft van de provider het publieke blok **203.0.113.40/29** gekregen. Voor het interne netwerk mogen de adressen **203.0.113.45 en 203.0.113.46** gebruikt worden. Een collega stelt voor om dynamische NAT met een pool te gebruiken: "elke pc krijgt dan gewoon een publiek adres". Jij gaat onderzoeken of dat een goed idee is.

    INET-PC staat voor "een willekeurige computer op internet". De ISP-router is daarnaast verbonden met het **echte internet** (test: 8.8.8.8).

    Alles behalve NAT is al correct geconfigureerd.

    ## Adressen
    | Apparaat | Interface | IP-adres | Opmerking |
    |---|---|---|---|
    | PC1 | eth0 | 192.168.33.11/24 | werkplek |
    | PC2 | eth0 | 192.168.33.12/24 | werkplek |
    | PC3 | eth0 | 192.168.33.13/24 | werkplek |
    | EDGE | E0/0 (LAN) | 192.168.33.1/24 | gateway intern |
    | EDGE | E0/1 (WAN) | 203.0.113.42/29 | publiek WAN-adres |
    | ISP | E0/1 | 203.0.113.41/29 | gateway van EDGE |
    | ISP | E0/0 | 198.51.100.1/24 | netwerk van INET-PC |
    | INET-PC | eth0 | 198.51.100.10/24 | testcomputer op internet |

    NAT-pool: **203.0.113.45 - 203.0.113.46** (masker 255.255.255.248).

    De ISP-router is van de provider: je mag hem bekijken, maar niet aanpassen.

    ## Inloggen
    - Routers: console, geen wachtwoord.
    - Hosts (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Opdrachten

    ### Deel 1 - Theorie
    1. Wat is het verschil tussen dynamische NAT (met een pool) en PAT?
    2. Hoeveel interne hosts kunnen tegelijk naar buiten met een pool van twee adressen zonder overload? En met overload?
    3. Wat gebeurt er met een pakket als de pool vol is?

    ### Deel 2 - Dynamische NAT configureren op EDGE
    1. Geef de interfaces de juiste NAT-rol.
    2. Maak een standaard-ACL `NAT-LAN` voor het interne netwerk.
    3. Maak een NAT-pool `PUBLIEK` met de adressen .45 t/m .46.
    4. Koppel de ACL aan de pool, **zonder** overload.

    ### Deel 3 - De pool raakt vol
    1. Ping achter elkaar vanaf PC1, PC2 en daarna PC3 naar 198.51.100.10 (`ping -c 3 198.51.100.10`).
    2. Welke pc's lukt het, en welke niet?
    3. Bekijk `show ip nat translations` en `show ip nat statistics`. Welke publieke adressen zijn gekoppeld aan welke pc? Zoek in de statistieken het aantal *misses* en leg uit wat dat betekent.
    4. Wacht een minuut en probeer PC3 opnieuw. Lukt het nu? Kijk in `show ip nat translations verbose` hoe lang een vertaling blijft bestaan.

    ### Deel 4 - Overload op de pool
    1. Maak de vertalingen leeg en pas de NAT-regel aan zodat de pool met **overload** wordt gebruikt. (Tip: IOS weigert soms een NAT-regel te wijzigen zolang er vertalingen actief zijn.)
    2. Ping vanaf alle drie de pc's naar 198.51.100.10 en naar 8.8.8.8.
    3. Bekijk `show ip nat translations`. Welk publiek adres gebruiken de pc's nu, en hoe houdt de router ze uit elkaar?

    ### Deel 5 - Reflectie
    1. Waarom werd PC3 in deel 3 niet vanzelf geholpen na een minuut?
    2. Noem een situatie waarin dynamische NAT zonder overload toch nuttig is.
    3. Wat is het verschil tussen `overload` op een pool en `overload` op een interface?

    Je docent bespreekt daarna je antwoorden.
  title: Lab 4.3.3 - Pool of overload?
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
