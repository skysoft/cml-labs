lab:
  description: CCNA 200-301 v2.0 - leerdoel 4.3. Troubleshootinglab NAT/PAT. Er zitten
    5 fouten in dit lab.
  notes: |-
    # Lab 4.3.4 - Klachten na providerwissel

    **Leerdoel (CCNA 200-301 v2.0, 4.3):** NAT/PAT configureren en troubleshooten op IOS XE-routers.

    ## Scenario
    Bouwbedrijf De Stenen Brug is overgestapt naar een nieuwe provider. Het bedrijf heeft een nieuw publiek blok **203.0.113.48/29** gekregen, dat de provider via de transportverbinding naar EDGE routeert. Een externe monteur heeft EDGE opnieuw geconfigureerd. Sinds de overstap komen er klachten binnen:
    - "Vanuit de werkplaats kom ik helemaal niet op internet."
    - "Op kantoor werkt internet soms bij één collega, maar de rest kan niet."
    - "Onze website is van buitenaf niet bereikbaar."
    - "Ik kan thuis niet meer via SSH op de beheerhost."

    De ISP-router speelt de provider. In dit lab mag je **alle** apparaten aanpassen (je belt als het ware met de provider).

    **Er zitten 5 fouten in dit lab.**

    ## Ontwerp (zo hoort het te werken)
    | Onderdeel | Ontwerp |
    |---|---|
    | Kantoor-LAN (EDGE E0/0) | 192.168.34.0/24, NAT inside |
    | Werkplaats-LAN (EDGE E0/2) | 192.168.35.0/24, NAT inside |
    | Transport EDGE - ISP (EDGE E0/1) | 100.64.34.0/30 (EDGE .2, ISP .1), NAT outside |
    | Internettoegang beide LAN's | PAT op pool `PUBLIEK` = 203.0.113.49 |
    | Webserver SRV-WEB 192.168.34.100 | static NAT naar 203.0.113.50 (poort 80) |
    | BEHEER 192.168.34.20 | SSH bereikbaar op 203.0.113.51, TCP-poort 2222 |
    | Provider (ISP) | routeert 203.0.113.48/29 naar 100.64.34.2 |

    ## Adressen
    | Apparaat | Interface | IP-adres |
    |---|---|---|
    | PC1 | eth0 | 192.168.34.11/24 |
    | BEHEER | eth0 | 192.168.34.20/24 |
    | SRV-WEB | eth0 | 192.168.34.100/24 |
    | PC2 (werkplaats) | eth0 | 192.168.35.11/24 |
    | EDGE | E0/0 / E0/2 / E0/1 | 192.168.34.1 / 192.168.35.1 / 100.64.34.2 |
    | ISP | E0/1 / E0/0 | 100.64.34.1 / 198.51.100.1 |
    | INET-PC | eth0 | 198.51.100.10/24 |

    INET-PC staat voor "een willekeurige computer op internet". Echt internet via de ISP: 8.8.8.8.

    ## Inloggen
    - Routers: console, geen wachtwoord.
    - Hosts (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Testcommando's
    - Internet: `ping -c 3 198.51.100.10` en `ping -c 3 8.8.8.8`
    - Website (vanaf INET-PC): `wget -qO- http://203.0.113.50`
    - SSH-poort (vanaf INET-PC): `echo | nc -w 3 203.0.113.51 2222` (verwacht: een regel die begint met `SSH-2.0`)
    - Op EDGE: `show ip nat translations`, `show ip nat statistics`, `show ip interface`, `show access-lists`

    ## Opdrachten
    1. Test alle klachten en noteer de symptomen.
    2. Zoek en herstel de 5 fouten. Houd een **foutenlog** bij:

    | # | Apparaat | Symptoom | Oorzaak | Oplossing (commando's) | Hoe geverifieerd |
    |---|---|---|---|---|---|
    | 1 | | | | | |
    | 2 | | | | | |
    | 3 | | | | | |
    | 4 | | | | | |
    | 5 | | | | | |

    3. Toon aan het eind met `show ip nat translations` aan dat alle onderdelen van het ontwerp werken.

    Je docent bespreekt daarna je foutenlog.
  title: Lab 4.3.4 - Klachten na providerwissel
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
