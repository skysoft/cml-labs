lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 2.2. Configuratielab: voice VLAN, poort
    naar een standalone AP (trunk) en naar een controller-based AP (access).'
  notes: |-
    # Lab 2.2.2 - Bellen en draadloos

    **Leerdoel (CCNA 200-301 v2.0, 2.2):** Layer 2-poortinstellingen configureren voor eindapparaten: VoIP-telefoon en wireless access points (standalone en controller-based).

    ## Scenario
    Fysiotherapiepraktijk In Beweging krijgt IP-telefonie en wifi. Op switch SW1 komen:
    - een **IP-telefoon** met de pc van de balie erachter (pc aangesloten op de telefoon);
    - een **standalone AP** (AP1) dat zelf twee SSID's uitzendt: *Personeel* (VLAN 10) en *Gasten* (VLAN 50); het beheeradres van AP1 zit in VLAN 40;
    - een **controller-based (lightweight) AP** (AP2) dat al het wifi-verkeer via een CAPWAP-tunnel naar de wireless controller WLC1 stuurt.

    Alle VLAN's bestaan al op SW1 en CORE. De uplink van SW1 naar CORE is klaar. CORE is de gateway (SVI's .1) voor alle VLAN's.

    ## VLAN's
    | VLAN | Naam | Subnet |
    |---|---|---|
    | 10 | PERSONEEL | 192.168.10.0/24 |
    | 40 | AP-BEHEER | 192.168.40.0/24 |
    | 45 | WLC | 192.168.45.0/24 |
    | 50 | GASTEN | 192.168.50.0/24 |
    | 99 | BEHEER (native uplink) | 192.168.99.0/24 |
    | 150 | VOICE | 192.168.150.0/24 |

    ## Poortenplan SW1
    | Poort | Apparaat | Ontwerp |
    |---|---|---|
    | E0/0 | uplink CORE | trunk (al klaar) |
    | E0/1 | IP-telefoon + PC1 | data-VLAN 10, voice VLAN 150, PortFast |
    | E0/2 | AP1 (standalone) | trunk, native VLAN 40, allowed 10,40,50, geen DTP, PortFast voor trunks |
    | E0/3 | AP2 (lightweight) | access VLAN 40, PortFast |

    | Apparaat | Adres(sen) |
    |---|---|
    | PC1 | 192.168.10.11 |
    | AP1 | beheer 192.168.40.11 (ongetagd); SSID Personeel 192.168.10.21 (VLAN 10); SSID Gasten 192.168.50.21 (VLAN 50) |
    | AP2 | 192.168.40.12 |
    | WLC1 | 192.168.45.10 (op CORE) |

    **Let op - beperkingen van CML:**
    - Er is geen IP-telefoon in CML: PC1 staat voor de pc achter de telefoon. Het voice VLAN controleer je met show-commando's.
    - Er is geen PoE in CML (de telefoon en de AP's krijgen in het echt stroom via de switch).
    - AP1 en AP2 zijn Linux-hosts die het verkeer van een AP nabootsen (AP1 met VLAN-subinterfaces `eth0.10` en `eth0.50`).

    ## Inloggen
    - Switches: console, geen wachtwoord.
    - Hosts (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Opdrachten

    ### Deel 1 - Theorie
    1. Een IP-telefoon en een pc delen één switchpoort. Hoe houdt de switch spraak- en dataverkeer uit elkaar? Wat is getagd en wat niet?
    2. Hoe weet een Cisco-telefoon welk voice VLAN hij moet gebruiken?
    3. Wat is het verschil tussen een standalone (autonomous) AP en een lightweight AP? Waar wordt het wifi-verkeer op het bekabelde netwerk gezet?
    4. Waarom heeft een standalone AP een trunk nodig, en een lightweight AP (local mode) niet? Wanneer heeft een lightweight AP toch een trunk nodig (tip: FlexConnect)?

    ### Deel 2 - Poort voor telefoon en pc (E0/1)
    1. Configureer E0/1 volgens het poortenplan.
    2. Controleer met `show interfaces Ethernet0/1 switchport` (*Access Mode VLAN* en *Voice VLAN*) en `show vlan brief`. In welke VLAN's staat E0/1?
    3. Ping vanaf PC1 naar 192.168.10.1.

    ### Deel 3 - Poort voor de standalone AP (E0/2)
    1. Configureer E0/2 volgens het poortenplan.
    2. Test vanaf AP1: `ping -c 2 192.168.40.1` (beheer), `ping -c 2 -I eth0.10 192.168.10.1` (SSID Personeel) en `ping -c 2 -I eth0.50 192.168.50.1` (SSID Gasten).
    3. Bekijk `show interfaces trunk` en `show spanning-tree interface Ethernet0/2 detail`.

    ### Deel 4 - Poort voor de lightweight AP (E0/3)
    1. Configureer E0/3 volgens het poortenplan.
    2. Test vanaf AP2 of hij de controller bereikt: `ping -c 3 192.168.45.10`.

    ### Deel 5 - Reflectie
    1. Waarom hoeven de VLAN's 10 en 50 niet op de poort van AP2 te staan, terwijl gebruikers op AP2 wel in die VLAN's terechtkomen?
    2. Wat gebeurt er met AP1 als de native VLAN op E0/2 op 1 blijft staan?
    3. Een AP met 802.3at (PoE+) krijgt op een 802.3af-poort te weinig stroom. Wat merk je dan in de praktijk?

    Je docent bespreekt daarna je antwoorden.
  title: Lab 2.2.2 - Bellen en draadloos
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
