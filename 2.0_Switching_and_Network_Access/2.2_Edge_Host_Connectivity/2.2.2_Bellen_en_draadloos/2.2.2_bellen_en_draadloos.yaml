nodes:
  - boot_disk_size: null
    configuration:
      - name: ios_config.txt
        content: |-
          hostname CORE
          no ip domain lookup
          vtp mode transparent
          ip routing
          !
          vlan 10
           name PERSONEEL
          vlan 40
           name AP-BEHEER
          vlan 45
           name WLC
          vlan 50
           name GASTEN
          vlan 99
           name BEHEER
          vlan 150
           name VOICE
          !
          interface Ethernet0/0
           description Trunk naar SW1
           switchport trunk encapsulation dot1q
           switchport trunk native vlan 99
           switchport trunk allowed vlan 10,40,50,99,150
           switchport mode trunk
           switchport nonegotiate
          !
          interface Ethernet0/1
           description WLC1
           switchport mode access
           switchport access vlan 45
           spanning-tree portfast
          !
          interface Ethernet0/2
           shutdown
          interface Ethernet0/3
           shutdown
          !
          interface Vlan1
           no ip address
           shutdown
          !
          interface Vlan10
           ip address 192.168.10.1 255.255.255.0
           no shutdown
          interface Vlan40
           ip address 192.168.40.1 255.255.255.0
           no shutdown
          interface Vlan45
           ip address 192.168.45.1 255.255.255.0
           no shutdown
          interface Vlan50
           ip address 192.168.50.1 255.255.255.0
           no shutdown
          interface Vlan99
           ip address 192.168.99.1 255.255.255.0
           no shutdown
          interface Vlan150
           ip address 192.168.150.1 255.255.255.0
           no shutdown
          !
          line con 0
           exec-timeout 0 0
           logging synchronous
          !
          end
