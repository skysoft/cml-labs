    text_content: |-
      LAB 2.2.2 - BELLEN EN DRAADLOOS (configuratielab)
       E0/1 telefoon + PC1: data VLAN 10, voice VLAN 150
       E0/2 AP1 standalone: trunk, native 40, SSID's VLAN 10 en 50
       E0/3 AP2 lightweight: access VLAN 40 -> WLC1 192.168.45.10
       CML: geen IP-telefoon en geen PoE (zie Notes)
      Volledige opdracht: open de Lab Notes (tabblad Notes).
      Login hosts: cisco / cisco
