lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 2.2. Configuratielab: trunk naar een
    hypervisor (virtuele machines in meerdere VLAN''s) en een LACP-port-channel naar
    een NAS.'
  notes: |-
    # Lab 2.2.3 - De serverkast

    **Leerdoel (CCNA 200-301 v2.0, 2.2):** Layer 2-poortinstellingen configureren voor eindapparaten (VLAN, port channel en LACP): virtualized hosts en network appliances.

    ## Scenario
    Accountantskantoor De Balans krijgt een eigen serverkast met switch SW-SRV. Daarop komen:
    - **HV1**, een hypervisor met de virtuele machines *VM-WEB* (VLAN 60) en *VM-TEST* (VLAN 61). Het beheeradres van de hypervisor zelf zit in VLAN 69 en gaat ongetagd over de kabel; de VM's gaan getagd.
    - **NAS1**, een opslagapparaat met **twee** netwerkkaarten, die samen een LACP-bundel (802.3ad) vormen. De NAS is al zo ingesteld; de switch nog niet.

    De uplink van SW-SRV naar CORE en alle VLAN's zijn al klaar. CORE is de gateway (SVI's .1) voor alle VLAN's. PC1 op CORE is een werkplek van een medewerker.

    ## VLAN's
    | VLAN | Naam | Subnet |
    |---|---|---|
    | 10 | KANTOOR | 192.168.10.0/24 |
    | 60 | VM-PRODUCTIE | 192.168.60.0/24 |
    | 61 | VM-TEST | 192.168.61.0/24 |
    | 69 | HV-BEHEER | 192.168.69.0/24 |
    | 70 | OPSLAG | 192.168.70.0/24 |
    | 99 | BEHEER (native uplink) | 192.168.99.0/24 |

    ## Poortenplan SW-SRV
    | Poort | Apparaat | Ontwerp |
    |---|---|---|
    | E0/0 | uplink CORE | trunk (al klaar) |
    | E0/1 | HV1 | trunk, native VLAN 69, allowed 60,61,69, geen DTP, PortFast voor trunks |
    | E0/2 - E0/3 | NAS1 (eth0 + eth1) | Port-channel 2, LACP active, `lacp rate fast`, access VLAN 70, PortFast |

    | Apparaat | Adres(sen) |
    |---|---|
    | HV1 | beheer 192.168.69.10 (ongetagd); VM-WEB 192.168.60.11 (VLAN 60); VM-TEST 192.168.61.11 (VLAN 61) |
    | NAS1 | 192.168.70.10 (bond0 over eth0 + eth1) |
    | PC1 | 192.168.10.11 (op CORE) |

    HV1 en NAS1 zijn Linux-hosts. De VM's op HV1 zijn nagebootst met VLAN-subinterfaces (`eth0.60`, `eth0.61`).

    ## Inloggen
    - Switches: console, geen wachtwoord.
    - Hosts (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Opdrachten

    ### Deel 1 - Theorie
    1. Waarom heeft een hypervisor meestal een trunk nodig? Wie doet aan de kant van de server het taggen?
    2. Wat is het voordeel van een LACP-bundel naar een NAS of server ten opzichte van één kabel? En ten opzichte van twee losse kabels?
    3. Wat doet `spanning-tree portfast trunk`, en waarom mag dat hier wel?

    ### Deel 2 - Uitgangssituatie
    1. Ping vanaf PC1 naar 192.168.69.10, 192.168.60.11 en 192.168.70.10.
    2. Bekijk op SW-SRV `show etherchannel summary` en `show lacp neighbor`. Stuurt de NAS al LACP-berichten?

    ### Deel 3 - Hypervisor (E0/1)
    1. Configureer E0/1 volgens het poortenplan.
    2. Ping vanaf PC1 naar het beheeradres van HV1 en naar beide VM's.
    3. Bekijk `show mac address-table interface Ethernet0/1`. In welke VLAN's zie je MAC-adressen van HV1?

    ### Deel 4 - NAS (E0/2 - E0/3)
    1. Configureer de bundel naar NAS1 volgens het poortenplan.
    2. Controleer met `show etherchannel summary` en `show lacp neighbor`. Wat is de *Dev ID* van de partner, en welke flags zie je?
    3. Ping vanaf PC1 naar NAS1.
    4. **Kabel eruit:** start op PC1 `ping 192.168.70.10` (zonder `-c`), stop in CML één van de twee links naar NAS1 (rechtsklik, *Stop*), en kijk wat er gebeurt. Bekijk `show etherchannel summary`. Start de link daarna weer.

    ### Deel 5 - Reflectie
    1. Wat zou er gebeuren als je op E0/2-3 `channel-group 2 mode on` gebruikt, terwijl de NAS LACP doet? En met `mode passive`?
    2. Een collega wil de NAS ook in VLAN 60 beschikbaar maken. Wat moet er aan beide kanten veranderen?

    Je docent bespreekt daarna je antwoorden.
  title: Lab 2.2.3 - De serverkast
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
