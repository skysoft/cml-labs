nodes:
  - boot_disk_size: null
    configuration:
      - name: ios_config.txt
        content: |-
          hostname CORE
          no ip domain lookup
          vtp mode transparent
          ip routing
          !
          vlan 10
           name KANTOOR
          vlan 60
           name VM-PRODUCTIE
          vlan 61
           name VM-TEST
          vlan 69
           name HV-BEHEER
          vlan 70
           name OPSLAG
          vlan 99
           name BEHEER
          !
          interface Ethernet0/0
           description Trunk naar SW-SRV
           switchport trunk encapsulation dot1q
           switchport trunk native vlan 99
           switchport trunk allowed vlan 60,61,69,70,99
           switchport mode trunk
           switchport nonegotiate
          !
          interface Ethernet0/1
           description PC1
           switchport mode access
           switchport access vlan 10
           spanning-tree portfast
          !
          interface Ethernet0/2
           shutdown
          interface Ethernet0/3
           shutdown
          !
          interface Vlan1
           no ip address
           shutdown
          interface Vlan10
           ip address 192.168.10.1 255.255.255.0
           no shutdown
          interface Vlan60
           ip address 192.168.60.1 255.255.255.0
           no shutdown
          interface Vlan61
           ip address 192.168.61.1 255.255.255.0
           no shutdown
          interface Vlan69
           ip address 192.168.69.1 255.255.255.0
           no shutdown
          interface Vlan70
           ip address 192.168.70.1 255.255.255.0
           no shutdown
          interface Vlan99
           ip address 192.168.99.1 255.255.255.0
           no shutdown
          !
          line con 0
           exec-timeout 0 0
           logging synchronous
          !
          end
    cpu_limit: null
    cpus: null
    data_volume: null
    hide_links: false
    id: n0
    image_definition: null
    label: CORE
    node_definition: ioll2-xe
    parameters: {}
    priority: null
    pyats:
      username: null
      password: null
      enable_password: null
    ram: null
    tags: []
    x: 0
    y: -250
    interfaces:
      - id: i0
        label: Loopback0
        mac_address: null
        type: loopback
      - id: i1
        label: Ethernet0/0
        mac_address: null
        type: physical
        slot: 0
      - id: i2
        label: Ethernet0/1
        mac_address: null
        type: physical
        slot: 1
      - id: i3
        label: Ethernet0/2
        mac_address: null
        type: physical
        slot: 2
      - id: i4
        label: Ethernet0/3
        mac_address: null
        type: physical
        slot: 3
  - boot_disk_size: null
    configuration:
      - name: ios_config.txt
        content: |-
          hostname SW-SRV
          no ip domain lookup
          vtp mode transparent
          no ip routing
          !
          vlan 60
           name VM-PRODUCTIE
          vlan 61
           name VM-TEST
          vlan 69
           name HV-BEHEER
          vlan 70
           name OPSLAG
          vlan 99
           name BEHEER
          !
          interface Ethernet0/0
           description Uplink CORE
           switchport trunk encapsulation dot1q
           switchport trunk native vlan 99
           switchport trunk allowed vlan 60,61,69,70,99
           switchport mode trunk
           switchport nonegotiate
          !
          interface Ethernet0/1
           description HV1 hypervisor
          !
          interface Ethernet0/2
           description NAS1 eth0
          !
          interface Ethernet0/3
           description NAS1 eth1
          !
          interface Vlan1
           no ip address
           shutdown
          !
          interface Vlan99
           description Beheer
           ip address 192.168.99.2 255.255.255.0
           no shutdown
          !
          ip default-gateway 192.168.99.1
          !
          line con 0
           exec-timeout 0 0
           logging synchronous
          !
          end
    cpu_limit: null
    cpus: null
    data_volume: null
    hide_links: false
    id: n1
    image_definition: null
    label: SW-SRV
    node_definition: ioll2-xe
    parameters: {}
    priority: null
    pyats:
      username: null
      password: null
      enable_password: null
    ram: null
    tags: []
    x: 0
    y: -80
    interfaces:
      - id: i0
        label: Loopback0
        mac_address: null
        type: loopback
      - id: i1
        label: Ethernet0/0
        mac_address: null
        type: physical
        slot: 0
      - id: i2
        label: Ethernet0/1
        mac_address: null
        type: physical
        slot: 1
      - id: i3
        label: Ethernet0/2
        mac_address: null
        type: physical
        slot: 2
      - id: i4
        label: Ethernet0/3
        mac_address: null
        type: physical
        slot: 3
  - boot_disk_size: null
    configuration:
      - name: node.cfg
        content: |-
          hostname PC1
          USERNAME=cisco
          PASSWORD=cisco
          # standaard-DHCP-client van het image uitschakelen (statische host)
          sed -i 's/iface eth0 inet dhcp/iface eth0 inet manual/' /etc/network/interfaces
          pkill udhcpc 2>/dev/null
          ip addr flush dev eth0
          ip link set dev eth0 up
          ip address add 192.168.10.11/24 dev eth0
          ip route add default via 192.168.10.1
    cpu_limit: null
    cpus: null
    data_volume: null
    hide_links: false
    id: n2
    image_definition: null
    label: PC1
    node_definition: alpine
    parameters: {}
    priority: null
    pyats:
      username: null
      password: null
      enable_password: null
    ram: null
    tags: []
    x: 250
    y: -250
    interfaces:
      - id: i0
        label: eth0
        mac_address: null
        type: physical
        slot: 0
  - boot_disk_size: null
    configuration:
      - name: node.cfg
        content: |-
          hostname HV1
          USERNAME=cisco
          PASSWORD=cisco
          # Hypervisor: beheer ongetagd, VM's als getagde VLAN's
          sed -i 's/iface eth0 inet dhcp/iface eth0 inet manual/' /etc/network/interfaces
          pkill udhcpc 2>/dev/null
          ip addr flush dev eth0
          ip link set dev eth0 up
          ip address add 192.168.69.10/24 dev eth0
          ip route add default via 192.168.69.1
          modprobe 8021q 2>/dev/null
          # VM-WEB: eigen routeringstabel en gateway, zoals een echte VM
          ip link add link eth0 name eth0.60 type vlan id 60
          ip link set dev eth0.60 up
          ip address add 192.168.60.11/24 dev eth0.60
          ip route del 192.168.60.0/24 dev eth0.60
          ip route add 192.168.60.0/24 dev eth0.60 table 60
          ip route add default via 192.168.60.1 dev eth0.60 table 60
          ip rule add from 192.168.60.11 table 60
          # VM-TEST
          ip link add link eth0 name eth0.61 type vlan id 61
          ip link set dev eth0.61 up
          ip address add 192.168.61.11/24 dev eth0.61
          ip route del 192.168.61.0/24 dev eth0.61
          ip route add 192.168.61.0/24 dev eth0.61 table 61
          ip route add default via 192.168.61.1 dev eth0.61 table 61
          ip rule add from 192.168.61.11 table 61
    cpu_limit: null
    cpus: null
    data_volume: null
    hide_links: false
    id: n3
    image_definition: null
    label: HV1
    node_definition: alpine
    parameters: {}
    priority: null
    pyats:
      username: null
      password: null
      enable_password: null
    ram: null
    tags: []
    x: -200
    y: 100
    interfaces:
      - id: i0
        label: eth0
        mac_address: null
        type: physical
        slot: 0
  - boot_disk_size: null
    configuration:
      - name: node.cfg
        content: |-
          hostname NAS1
          USERNAME=cisco
          PASSWORD=cisco
          # NAS met LACP-bundel (802.3ad) over eth0 en eth1
          sed -i 's/iface eth0 inet dhcp/iface eth0 inet manual/' /etc/network/interfaces
          pkill udhcpc 2>/dev/null
          ip addr flush dev eth0
          modprobe bonding 2>/dev/null
          ip link add bond0 type bond 2>/dev/null
          echo 802.3ad > /sys/class/net/bond0/bonding/mode
          echo 100 > /sys/class/net/bond0/bonding/miimon
          echo fast > /sys/class/net/bond0/bonding/lacp_rate
          ethtool -s eth0 speed 1000 duplex full
          ethtool -s eth1 speed 1000 duplex full
          ip link set eth0 down
          ip link set eth1 down
          ip link set eth0 master bond0
          ip link set eth1 master bond0
          ip link set bond0 up
          ip address add 192.168.70.10/24 dev bond0
          ip route add default via 192.168.70.1
    cpu_limit: null
    cpus: null
    data_volume: null
    hide_links: false
    id: n4
    image_definition: null
    label: NAS1
    node_definition: alpine
    parameters: {}
    priority: null
    pyats:
      username: null
      password: null
      enable_password: null
    ram: null
    tags: []
    x: 200
    y: 100
    interfaces:
      - id: i0
        label: eth0
        mac_address: null
        type: physical
        slot: 0
      - id: i1
        label: eth1
        mac_address: null
        type: physical
        slot: 1
