    color: '#1F4E79'
    rotation: 0
    text_bold: false
    text_content: |-
      LAB 2.2.5 - EINDLAB ZWEMBAD DE GOLFSLAG
       Er zitten 6 fouten in dit lab (op SW1 en SW-SRV).
       SW1: PC1+telefoon, printer, camera, AP1 standalone, AP2 lightweight
       SW-SRV: HV1 hypervisor (trunk), NAS1 (LACP Po2)
       CORE = gateway (SVI's .1), WLC1 192.168.45.10, EDGE = internet
      Ontwerp en opdracht: open de Lab Notes (tabblad Notes).
      Login hosts: cisco / cisco
    text_font: monospace
    text_italic: false
    text_size: 12
    text_unit: pt
    thickness: 1
    type: text
    x1: -760.0
    y1: -560.0
    z_index: 1
