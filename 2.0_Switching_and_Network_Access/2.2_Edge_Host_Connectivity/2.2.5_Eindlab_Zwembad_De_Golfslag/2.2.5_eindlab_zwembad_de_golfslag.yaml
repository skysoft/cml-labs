  - boot_disk_size: null
    configuration:
      - name: node.cfg
        content: |-
          hostname NAS1
          USERNAME=cisco
          PASSWORD=cisco
          # NAS met LACP-bundel (802.3ad) over eth0 en eth1
          sed -i 's/iface eth0 inet dhcp/iface eth0 inet manual/' /etc/network/interfaces
          pkill udhcpc 2>/dev/null
          ip addr flush dev eth0
          modprobe bonding 2>/dev/null
          ip link add bond0 type bond 2>/dev/null
          echo 802.3ad > /sys/class/net/bond0/bonding/mode
          echo 100 > /sys/class/net/bond0/bonding/miimon
          echo fast > /sys/class/net/bond0/bonding/lacp_rate
          ethtool -s eth0 speed 1000 duplex full
          ethtool -s eth1 speed 1000 duplex full
          ip link set eth0 down
          ip link set eth1 down
          ip link set eth0 master bond0
          ip link set eth1 master bond0
          ip link set bond0 up
          ip address add 192.168.70.10/24 dev bond0
          ip route add default via 192.168.70.1
