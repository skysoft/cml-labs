lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 2.2. Integraal eindlab eindapparaat-poorten:
    werkplek, printer, IoT, AP''s, hypervisor en NAS. Er zitten 6 fouten in dit lab.'
  notes: |-
    # Lab 2.2.5 - Eindlab Zwembad De Golfslag

    **Leerdoel (CCNA 200-301 v2.0, 2.2):** Layer 2-poortinstellingen voor eindapparaten (VLAN, port channel en LACP): desktop, printer, IoT, access points, VoIP, virtualized hosts en network appliances.

    ## Scenario
    Zwembad De Golfslag heeft een nieuw netwerk. De installateur heeft de switches SW1 (kantoor en hal) en SW-SRV (serverruimte) ingesteld en is vertrokken. Bij de oplevering blijkt:
    - "De camera bij de ingang is offline."
    - "De printer op kantoor is verdwenen."
    - "Gasten op het wifi van AP1 hebben geen internet; het personeel op AP1 wel."
    - "AP2 maakt geen verbinding met de wireless controller."
    - "De testserver (VM-TEST) is onbereikbaar; de webserver (VM-WEB) werkt wel."
    - "De NAS is onbereikbaar."

    **Er zitten 6 fouten in dit lab.** CORE en EDGE zijn correct; de fouten zitten op SW1 en SW-SRV.

    ## Ontwerp
    | VLAN | Naam | Subnet (gateway .1 op CORE) |
    |---|---|---|
    | 10 | PERSONEEL | 192.168.10.0/24 |
    | 20 | PRINTERS | 192.168.20.0/24 |
    | 30 | IOT | 192.168.30.0/24 |
    | 40 | AP-BEHEER | 192.168.40.0/24 |
    | 45 | WLC | 192.168.45.0/24 |
    | 50 | GASTEN | 192.168.50.0/24 |
    | 60 / 61 | VM-PRODUCTIE / VM-TEST | 192.168.60.0/24 / 192.168.61.0/24 |
    | 69 | HV-BEHEER | 192.168.69.0/24 |
    | 70 | OPSLAG | 192.168.70.0/24 |
    | 99 | BEHEER (native op uplinks) | 192.168.99.0/24 |
    | 150 | VOICE | 192.168.150.0/24 |
    | 999 | PARKEER | - |

    **SW1**
    | Poort | Apparaat | Ontwerp | Adres(sen) |
    |---|---|---|---|
    | E0/0 | uplink CORE | trunk, native 99 | - |
    | E0/1 | IP-telefoon + PC1 | data 10, voice 150, PortFast | 192.168.10.11 |
    | E0/2 | PRN1 printer | access 20, PortFast | 192.168.20.10 |
    | E0/3 | CAM1 camera | access 30, PortFast | 192.168.30.10 |
    | E1/0 | AP1 standalone | trunk, native 40, allowed 10,40,50, PortFast trunk | 192.168.40.11; SSID's 192.168.10.21 (V10), 192.168.50.21 (V50) |
    | E1/1 | AP2 lightweight | access 40, PortFast | 192.168.40.12 |
    | E1/2 - E1/3 | ongebruikt | shutdown, VLAN 999 | - |

    **SW-SRV**
    | Poort | Apparaat | Ontwerp | Adres(sen) |
    |---|---|---|---|
    | E0/0 | uplink CORE | trunk, native 99 | - |
    | E0/1 | HV1 hypervisor | trunk, native 69, allowed 60,61,69, PortFast trunk | 192.168.69.10; VM-WEB 192.168.60.11; VM-TEST 192.168.61.11 |
    | E0/2 - E0/3 | NAS1 | Port-channel 2, LACP active, access 70 | 192.168.70.10 |

    WLC1 (192.168.45.10) hangt aan CORE. EDGE geeft **echt internet** (test: 8.8.8.8).

    **Beperkingen van CML:** geen IP-telefoon en geen PoE. AP's, hypervisor en NAS zijn Linux-hosts die het verkeer nabootsen (VLAN-subinterfaces `eth0.X`, NAS met een LACP-bond).

    ## Inloggen
    - Routers en switches: console, geen wachtwoord.
    - Hosts (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Opdrachten
    1. Test alle meldingen en noteer de symptomen. (AP1-SSID's test je met `ping -I eth0.10 ...` en `ping -I eth0.50 ...`.)
    2. Zoek en herstel de 6 fouten. Houd een **foutenlog** bij:

    | # | Switch/poort | Symptoom | Oorzaak | Oplossing (commando's) | Hoe geverifieerd |
    |---|---|---|---|---|---|
    | 1 | | | | | |
    | 2 | | | | | |
    | 3 | | | | | |
    | 4 | | | | | |
    | 5 | | | | | |
    | 6 | | | | | |

    3. Oplevering: toon aan dat elk apparaat (en elk SSID en elke VM) zijn gateway en 8.8.8.8 bereikt, AP2 de WLC bereikt, en dat `show interfaces status`, `show interfaces trunk` en `show etherchannel summary` kloppen met het ontwerp.

    ### Reflectie
    1. Welke fout liet de switch er "goed" uitzien terwijl het niet werkte?
    2. Welke show-commando's gebruik je als eerste bij een klacht over één eindapparaat, en waarom?
    3. Maak een checklist (5 tot 8 punten) voor het opleveren van eindapparaat-poorten.

    Je docent bespreekt daarna je foutenlog.
  title: Lab 2.2.5 - Eindlab Zwembad De Golfslag
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
