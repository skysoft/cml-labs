        content: |-
          hostname EDGE
          no ip domain lookup
          !
          interface Ethernet0/0
           description Routed link naar CORE
           ip address 10.0.0.1 255.255.255.252
           ip nat inside
           no shutdown
          !
          interface Ethernet0/1
           description Internet (CML External Connector, NAT)
           ip address dhcp
           ip nat outside
           no shutdown
          !
          ip access-list standard NAT-INTERN
           permit 192.168.0.0 0.0.255.255
           permit 10.0.0.0 0.0.0.3
          !
          ip nat inside source list NAT-INTERN interface Ethernet0/1 overload
          !
          ip route 192.168.0.0 255.255.0.0 10.0.0.2
          !
          line con 0
           exec-timeout 0 0
           logging synchronous
          !
          end
