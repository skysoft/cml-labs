        content: |-
          hostname AP1
          USERNAME=cisco
          PASSWORD=cisco
          # Standalone AP: beheer ongetagd, SSID's als getagde VLAN's
          sed -i 's/iface eth0 inet dhcp/iface eth0 inet manual/' /etc/network/interfaces
          pkill udhcpc 2>/dev/null
          ip addr flush dev eth0
          ip link set dev eth0 up
          ip address add 192.168.40.11/24 dev eth0
          ip route add default via 192.168.40.1
          modprobe 8021q 2>/dev/null
          # SSID Personeel (VLAN 10): eigen routeringstabel, zodat het beheeradres los blijft
          ip link add link eth0 name eth0.10 type vlan id 10
          ip link set dev eth0.10 up
          ip address add 192.168.10.21/24 dev eth0.10
          ip route del 192.168.10.0/24 dev eth0.10
          ip route add 192.168.10.0/24 dev eth0.10 table 10
          ip route add default via 192.168.10.1 dev eth0.10 table 10
          ip rule add from 192.168.10.21 table 10
          # SSID Gasten (VLAN 50)
          ip link add link eth0 name eth0.50 type vlan id 50
          ip link set dev eth0.50 up
          ip address add 192.168.50.21/24 dev eth0.50
          ip route del 192.168.50.0/24 dev eth0.50
          ip route add 192.168.50.0/24 dev eth0.50 table 50
          ip route add default via 192.168.50.1 dev eth0.50 table 50
          ip rule add from 192.168.50.21 table 50
