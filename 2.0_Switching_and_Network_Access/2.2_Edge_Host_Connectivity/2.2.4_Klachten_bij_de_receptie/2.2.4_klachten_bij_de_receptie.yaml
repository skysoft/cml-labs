lab:
  description: CCNA 200-301 v2.0 - leerdoel 2.2. Troubleshootinglab eindapparaat-poorten
    (telefoon, AP's, IoT). Er zitten 4 fouten in dit lab.
  notes: |-
    # Lab 2.2.4 - Klachten bij de receptie

    **Leerdoel (CCNA 200-301 v2.0, 2.2):** Layer 2-poortinstellingen voor eindapparaten configureren en troubleshooten.

    ## Scenario
    Camping De Zeven Linden heeft een nieuwe switch (SW1) bij de receptie. Een stagiair heeft de poorten ingesteld. Sindsdien:
    - "De balie-pc (aangesloten achter de IP-telefoon) heeft geen netwerk."
    - "AP1 is niet meer te beheren, terwijl het wifi van AP1 gewoon werkt."
    - "AP2 meldt zich niet aan bij de wireless controller."
    - "De camera bij de slagboom is offline."
    De printer werkt wel.

    **Er zitten 4 fouten in dit lab.** CORE is correct; de fouten zitten op SW1.

    ## Ontwerp
    | VLAN | Naam | Subnet (gateway .1 op CORE) |
    |---|---|---|
    | 10 | PERSONEEL | 192.168.10.0/24 |
    | 20 | PRINTERS | 192.168.20.0/24 |
    | 30 | IOT | 192.168.30.0/24 |
    | 40 | AP-BEHEER | 192.168.40.0/24 |
    | 45 | WLC | 192.168.45.0/24 |
    | 50 | GASTEN | 192.168.50.0/24 |
    | 99 | BEHEER (native uplink) | 192.168.99.0/24 |
    | 150 | VOICE | 192.168.150.0/24 |

    | Poort SW1 | Apparaat | Ontwerp | Adres(sen) |
    |---|---|---|---|
    | E0/0 | uplink CORE | trunk, native 99 | - |
    | E0/1 | IP-telefoon + PC1 | data-VLAN 10, voice VLAN 150, PortFast | PC1 192.168.10.11 |
    | E0/2 | AP1 standalone | trunk, native 40, allowed 10,40,50, PortFast trunk | beheer 192.168.40.11; SSID's 192.168.10.21 (V10) en 192.168.50.21 (V50) |
    | E0/3 | AP2 lightweight | access VLAN 40, PortFast | 192.168.40.12 |
    | E1/0 | CAM1 (camera) | access VLAN 30, PortFast | 192.168.30.10 |
    | E1/1 | PRN1 (printer) | access VLAN 20, PortFast | 192.168.20.10 |

    WLC1 (192.168.45.10) hangt aan CORE.

    **Beperkingen van CML:** er is geen IP-telefoon (PC1 staat voor de pc achter de telefoon) en geen PoE. AP1 en AP2 zijn Linux-hosts die het verkeer van een AP nabootsen (AP1: `eth0.10` en `eth0.50` voor de SSID's).

    ## Inloggen
    - Switches: console, geen wachtwoord.
    - Hosts (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Testcommando's
    - PC1, CAM1, PRN1: `ping -c 2 <gateway>`
    - AP1: `ping -c 2 192.168.40.1`, `ping -c 2 -I eth0.10 192.168.10.1`, `ping -c 2 -I eth0.50 192.168.50.1`
    - AP2: `ping -c 2 192.168.45.10`
    - SW1: `show interfaces status`, `show interfaces <poort> switchport`, `show interfaces trunk`, `show vlan brief`

    ## Opdrachten
    1. Test de meldingen en noteer de symptomen.
    2. Zoek en herstel de 4 fouten. Houd een **foutenlog** bij:

    | # | Poort | Symptoom | Oorzaak | Oplossing (commando's) | Hoe geverifieerd |
    |---|---|---|---|---|---|
    | 1 | | | | | |
    | 2 | | | | | |
    | 3 | | | | | |
    | 4 | | | | | |

    3. Controleer aan het eind elke poort van SW1 tegen het ontwerp.

    Je docent bespreekt daarna je foutenlog.
  title: Lab 2.2.4 - Klachten bij de receptie
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
