lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 2.3. Validatielab: controleer de netwerkdocumentatie
    met CDP en LLDP. Er zitten 5 fouten in de documentatie.'
  notes: |-
    # Lab 2.3.2 - Overdracht van het netwerk

    **Leerdoel (CCNA 200-301 v2.0, 2.3):** de juistheid van netwerkdocumentatie controleren met CDP en LLDP.

    ## Scenario
    Logistiek bedrijf De Laadklep neemt het beheer over van een ander IT-bedrijf. Bij de overdracht hoort onderstaande documentatie. Jouw opdracht: **controleer of de documentatie klopt** met behulp van CDP en LLDP, en lever een gecorrigeerde versie op.

    **Er zitten 5 fouten in de documentatie.** Het netwerk zelf werkt; je hoeft niets aan de configuratie te veranderen (behalve eventueel LLDP/CDP-commando's om te kijken).

    De kabels zijn in deze CML-tekening bewust verborgen. De labels op het canvas zijn de stickers op de apparaten.

    ## Documentatie van het vorige IT-bedrijf

    ### Apparaten (beheer-VLAN 1, 10.10.0.0/24)
    | Apparaat | Rol | Beheeradres |
    |---|---|---|
    | EDGE | internetrouter | 10.10.0.1 |
    | SW-CORE | kernswitch | 10.10.0.2 |
    | SW-A | switch kantoor | 10.10.0.3 |
    | SW-B | switch magazijn | 10.10.0.4 |
    | R-LAB | testrouter | 10.10.0.21 |
    | R-VOIP | telefonie-router | 10.10.0.23 |

    ### Bekabeling
    | # | Van | Poort | Naar | Poort |
    |---|---|---|---|---|
    | 1 | EDGE | E0/0 | SW-CORE | E0/0 |
    | 2 | SW-CORE | E0/1 | SW-A | E0/0 |
    | 3 | SW-CORE | E0/2 | SW-B | E0/0 |
    | 4 | SW-CORE | E1/0 | R-VOIP | E0/0 |
    | 5 | SW-CORE | E1/1 | R-LAB | E0/0 |

    Op alle routers en switches staan CDP en LLDP aan.

    ## Inloggen
    - Routers en switches: console, geen wachtwoord.

    ## Opdrachten
    1. Controleer elke regel van beide tabellen met CDP en/of LLDP (`show cdp neighbors`, `show cdp neighbors detail`, `show lldp neighbors`, `show lldp neighbors detail`). Werk vanaf SW-CORE en log in op de andere apparaten als dat nodig is.
    2. Maak een **afwijkingenlijst**:

    | # | Wat staat er in de documentatie? | Wat is de werkelijkheid? | Met welk commando aangetoond? |
    |---|---|---|---|
    | 1 | | | |
    | 2 | | | |
    | 3 | | | |
    | 4 | | | |
    | 5 | | | |

    3. Lever een gecorrigeerde apparatentabel, bekabelingstabel en topologietekening op.

    ### Reflectie
    1. Welke afwijking kon je **niet** met alleen `show cdp neighbors` vinden, en welk commando had je daarvoor nodig?
    2. Eén van de afwijkingen kan in de praktijk problemen geven met spanning tree. Welke, en waarom?
    3. Hoe zou je voorkomen dat documentatie weer gaat afwijken van de werkelijkheid?

    Je docent bespreekt daarna je afwijkingenlijst.
  title: Lab 2.3.2 - Overdracht van het netwerk
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
