lab:
  description: CCNA 200-301 v2.0 - leerdoel 2.3. Troubleshootinglab CDP en LLDP. Er
    zitten 4 fouten in dit lab.
  notes: |-
    # Lab 2.3.3 - Gaten in de netwerkkaart

    **Leerdoel (CCNA 200-301 v2.0, 2.3):** de juistheid van netwerkdocumentatie controleren met CDP en LLDP.

    ## Scenario
    Drukkerij De Letterbak gebruikt een monitoringtool die elke nacht met CDP en LLDP een netwerkkaart tekent. Sinds een onderhoudsronde klopt die kaart niet meer: er ontbreken apparaten en verbindingen. Daarnaast meldt de beheerder:
    - "SW2 is niet meer te beheren via 10.20.99.3."

    **Er zitten 4 fouten in dit lab.**

    ## Beleid
    - **CDP** staat aan op alle Cisco-apparaten en op alle interne links.
    - **LLDP** staat aan op alle apparaten.
    - Op de link van EDGE naar de provider (EDGE E0/1) staan CDP en LLDP **uit**.
    - **SW-LEV** is een switch van een ander merk (nagebootst): die spreekt alleen LLDP, geen CDP.
    - Beheer-VLAN 99: 10.20.99.0/24. De trunk SW1-SW2 heeft native VLAN 99.

    ## Documentatie (klopt wel)
    | Apparaat | Beheeradres |
    |---|---|
    | EDGE | 10.20.99.1 |
    | SW1 | 10.20.99.2 |
    | SW2 | 10.20.99.3 |
    | R2 | 10.20.99.4 |
    | SW-LEV | 10.20.99.5 |

    | Van | Poort | Naar | Poort | Soort |
    |---|---|---|---|---|
    | EDGE | E0/0 | SW1 | E0/0 | access VLAN 99 |
    | SW1 | E0/1 | SW2 | E0/0 | trunk (native 99) |
    | SW1 | E0/2 | R2 | E0/0 | access VLAN 99 |
    | SW1 | E0/3 | SW-LEV | E0/0 | access VLAN 99 |
    | EDGE | E0/1 | provider (internet) | - | - |

    ## Inloggen
    - Routers en switches: console, geen wachtwoord.

    ## Handige commando's
    `show cdp`, `show cdp neighbors [detail]`, `show cdp interface`, `show lldp`, `show lldp neighbors [detail]`, `show lldp interface`, `show logging`, `show interfaces trunk`

    ## Opdrachten
    1. Vergelijk op elk apparaat `show cdp neighbors` en `show lldp neighbors` met de documentatie en het beleid. Noteer wat er ontbreekt.
    2. Zoek en herstel de 4 fouten. Houd een **foutenlog** bij:

    | # | Apparaat | Symptoom | Oorzaak | Oplossing (commando's) | Hoe geverifieerd |
    |---|---|---|---|---|---|
    | 1 | | | | | |
    | 2 | | | | | |
    | 3 | | | | | |
    | 4 | | | | | |

    3. Toon aan het eind aan dat elk apparaat de juiste buren ziet (CDP en/of LLDP, volgens het beleid) en dat SW2 bereikbaar is.

    ### Reflectie
    1. Welke fout werd pas zichtbaar nadat je een andere fout had opgelost, en waarom?
    2. Waarom zie je SW-LEV wel in LLDP maar nooit in CDP?

    Je docent bespreekt daarna je foutenlog.
  title: Lab 2.3.3 - Gaten in de netwerkkaart
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
