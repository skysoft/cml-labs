lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 2.3. Configuratie- en verkenningslab:
    netwerkdocumentatie opbouwen met CDP en LLDP.'
  notes: |-
    # Lab 2.3.1 - Wie zit waar?

    **Leerdoel (CCNA 200-301 v2.0, 2.3):** de juistheid van netwerkdocumentatie controleren met CDP en LLDP.

    ## Scenario
    Bij architectenbureau De Kaart is de netwerkbeheerder vertrokken zonder documentatie achter te laten. Jij krijgt alleen het beheeradres van switch **SW1** (192.168.1.2). Maak met CDP en LLDP een volledige en juiste documentatie van het netwerk.

    **Spelregel:** doe alsof je de topologie in CML niet ziet. Werk vanaf SW1 en gebruik alleen wat CDP en LLDP je vertellen. Pas als je een apparaat via CDP/LLDP gevonden hebt, mag je op de console van dat apparaat inloggen.

    ## Inloggen
    - Routers en switches: console, geen wachtwoord.
    - Hosts (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Opdrachten

    ### Deel 1 - Theorie
    1. Vergelijk CDP en LLDP: wie heeft ze bedacht, staan ze standaard aan op een Cisco-router/switch, wat zijn de standaardtimers (verzendinterval en holdtime)?
    2. Op welke OSI-laag werken CDP en LLDP? Kun je via CDP een apparaat zien dat twee switches verderop zit? Waarom (niet)?
    3. Welke informatie (TLV's) wisselen ze onder andere uit?

    ### Deel 2 - Documentatie opbouwen met CDP
    1. Bekijk op SW1 `show cdp neighbors` en `show cdp neighbors detail`.
    2. Log in op elk gevonden apparaat en herhaal dit, tot je alle netwerkapparaten hebt gevonden.
    3. Vul deze tabel in (één regel per kabel tussen twee netwerkapparaten):

    | Apparaat | Lokale poort | Buurapparaat | Poort van de buur | IP-adres buur | Capability / platform |
    |---|---|---|---|---|---|
    | | | | | | |

    4. Teken de topologie.
    5. PC1 en SRV1 zien jou niet in `show cdp neighbors`. Hoe kom je er toch achter op welke poort ze zitten? (tip: `show mac address-table`, `show arp` op EDGE)

    ### Deel 3 - Meer uit CDP halen
    1. Welke IOS-versie draait EDGE? Haal het antwoord uit SW1, zonder op EDGE in te loggen.
    2. Wat tonen `show cdp`, `show cdp interface` en `show cdp traffic`?
    3. Waarom staat bij *Platform* "Linux Unix"? (tip: CML)

    ### Deel 4 - LLDP
    1. Controleer met `show lldp` of LLDP aanstaat. Zet LLDP aan op **alle** routers en switches.
    2. Wacht ongeveer 30 seconden en bekijk `show lldp neighbors` op SW1. Welk extra apparaat zie je nu, en waarom zag CDP dat apparaat niet?
    3. Vergelijk de uitvoer van CDP en LLDP: capability-codes, hold-time en Port ID.
    4. Bekijk `show lldp neighbors Ethernet0/3 detail`. Welk besturingssysteem en welk beheeradres heeft dat apparaat?

    ### Deel 5 - Beveiliging
    De poort E0/1 van EDGE gaat naar de provider (internet).
    1. Waarom wil je daar geen CDP en LLDP?
    2. Zet CDP en LLDP uit op **alleen die interface** (niet op de hele router). Controleer met `show cdp interface Ethernet0/1` en `show lldp interface Ethernet0/1`.
    3. Waarom zet je CDP niet op de hele router uit?

    ### Deel 6 - Holdtime
    1. Zet op SW2 CDP uit op E0/0 (alleen die interface).
    2. Bekijk op SW1 een paar keer `show cdp neighbors`. Wat gebeurt er met de holdtime van SW2, en wanneer verdwijnt SW2 uit de lijst?
    3. Zet CDP op SW2 E0/0 weer aan.

    ### Deel 7 - Reflectie
    1. Welke informatie uit CDP zou een aanvaller kunnen gebruiken?
    2. In welke situatie kies je voor LLDP in plaats van CDP?

    Je docent bespreekt daarna je antwoorden.
  title: Lab 2.3.1 - Wie zit waar
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
