lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 2.5. Configuratie- en verkenningslab
    Rapid PVST+: rootverkiezing, poortrollen en -states, root primary/secondary per
    VLAN, cost en port-priority, failover.'
  notes: |-
    # Lab 2.5.1 - Wie is de baas?

    **Leerdoel (CCNA 200-301 v2.0, 2.5):** Rapid PVST+ configureren: root port, root bridge (primary/secondary) en andere poortnamen, port states en roles.

    ## Scenario
    Transportbedrijf De Snelweg heeft een nieuw switchnetwerk: twee distributieswitches (DSW1, DSW2) en een access-switch (ASW1). Alle switches zijn met elkaar verbonden (redundantie), en tussen DSW1 en DSW2 liggen zelfs **twee** kabels. Spanning tree draait in de standaardinstelling. De netwerkarchitect wil:
    - **DSW1** als root bridge voor **VLAN 10** (en reserve voor VLAN 20);
    - **DSW2** als root bridge voor **VLAN 20** (en reserve voor VLAN 10).
    Zo worden beide uplinks van ASW1 gebruikt (loadbalancing per VLAN).

    ## Netwerk
    ```
              SRV20 (V20) - E0/3 DSW1 E0/0 ==link A== E0/0 DSW2 E0/3 - SRV10 (V10)
                                 E0/2 ==link B== E0/2
                            DSW1 E0/1          DSW2 E0/1
                                    \          /
                               ASW1 E0/0    E0/1
                               ASW1 E0/2 PC1 (V10)   E0/3 PC2 (V20)
    ```
    | Host | Adres | VLAN |
    |---|---|---|
    | PC1 | 192.168.10.11/24 | 10 |
    | SRV10 | 192.168.10.100/24 | 10 |
    | PC2 | 192.168.20.11/24 | 20 |
    | SRV20 | 192.168.20.100/24 | 20 |

    Alle links tussen switches zijn trunks (VLAN 10 en 20). De hostpoorten hebben al PortFast (zie leerdoel 2.2).

    ## Inloggen
    - Switches: console, geen wachtwoord.
    - Hosts (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Opdrachten

    ### Deel 1 - Theorie
    1. Waaruit bestaat de bridge-ID, en hoe wordt de root bridge gekozen? Wat is de *sys-id-ext*?
    2. Hoe kiest een switch zijn root port (noem de drie tie-breakers in volgorde)?
    3. Welke poortrollen en -states kent RSTP? Wat is het verschil tussen een *alternate* en een *backup* port?
    4. Wat is de standaard path cost van een 10, 100 en 1000 Mbit/s-link (short method)?

    ### Deel 2 - De standaardsituatie analyseren
    1. Bekijk op elke switch `show spanning-tree vlan 10`. Welke switch is root, en waarom die? (Let op: in CML kan dat per keer verschillen.)
    2. Teken de topologie en zet bij elke poort de rol (Root, Desg, Altn) en de state (FWD, BLK).
    3. Welke kabels worden niet gebruikt voor VLAN 10? Waarom is dat een slecht ontwerp als de root een access-switch is?

    ### Deel 3 - Root bridge per VLAN
    1. Maak DSW1 root **primary** voor VLAN 10 en root **secondary** voor VLAN 20. Doe op DSW2 het omgekeerde.
    2. Controleer met `show spanning-tree vlan 10` en `show spanning-tree vlan 20` op alle switches. Welke uplink van ASW1 is nu per VLAN de root port?
    3. Bekijk `show running-config | include spanning-tree vlan`. Wat heeft `root primary` en `root secondary` eigenlijk geconfigureerd?

    ### Deel 4 - De dubbele link tussen DSW1 en DSW2
    1. Welke van de twee links (E0/0 of E0/2) gebruikt DSW2 voor VLAN 10 als root port, en waarom (welke tie-breaker)?
    2. Zorg dat DSW2 voor VLAN 10 de **andere** link gebruikt door op **DSW1** de port-priority van E0/2 voor VLAN 10 te verlagen. Waarom moet dat op DSW1 en niet op DSW2?
    3. Bonus: wat zou er gebeuren als je in plaats daarvan op DSW2 de cost van E0/0 verhoogt?

    ### Deel 5 - Failover
    1. Start op PC1 `ping -i 0.25 192.168.10.100` en stop in CML de link **DSW1 - ASW1** (rechtsklik op de link, *Stop*). Hoeveel pings gaan verloren? Bekijk `show spanning-tree vlan 10` op ASW1.
    2. Start de link weer. (In CML gaat de interface zelf niet down als je een link stopt; RSTP merkt de uitval doordat er geen BPDU's meer komen, na 3 x 2 s.)
    3. **Vergelijk:** zet op alle drie de switches `spanning-tree mode pvst` (klassieke STP) en herhaal de proef. Hoeveel pings gaan er nu verloren, en waarom? Zet daarna alles terug op `spanning-tree mode rapid-pvst`.
    4. **Vergelijk:** haal PortFast weg op de poort van PC1 (ASW1 E0/2) en herhaal de proef met rapid-pvst. Wat zie je? Zet PortFast terug.

    ### Deel 6 - Reflectie
    1. Waarom is het slim om de root bridge altijd zelf te kiezen in plaats van het aan de MAC-adressen over te laten?
    2. Wat is het voordeel van een verschillende root per VLAN?

    Je docent bespreekt daarna je antwoorden.
  title: Lab 2.5.1 - Wie is de baas
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
