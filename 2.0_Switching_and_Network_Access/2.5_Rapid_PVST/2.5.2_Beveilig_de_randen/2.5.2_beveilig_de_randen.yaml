lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 2.5. Configuratielab: PortFast, BPDU
    guard, root guard en loop guard.'
  notes: |-
    # Lab 2.5.2 - Beveilig de randen

    **Leerdoel (CCNA 200-301 v2.0, 2.5):** Rapid PVST+ configureren: PortFast, root guard, loop guard en BPDU guard.

    ## Scenario
    Bij ingenieursbureau De Brug is DSW1 bedoeld als root bridge voor VLAN 10 (priority 24576), met DSW2 als reserve (28672). Drie problemen:
    1. In het pand zit ook een **partnerbedrijf**. Hun switch (SW-PARTNER) hangt aan DSW1 E0/2. De partner heeft zijn switch prioriteit 0 gegeven...
    2. Een medewerker heeft in de vergaderruimte een **eigen switch** (SW-MEEGENOMEN) op de wandcontactdoos aangesloten (ASW1 E0/3), met zijn laptop erachter.
    3. De netwerkbeheerder is bang voor **eenrichtingsstoringen** op glasvezel: een link waarover nog wel data gaat, maar geen BPDU's meer aankomen.

    Jij beveiligt de randen van het netwerk.

    ## Netwerk
    ```
    SRV1 - E0/3 DSW1 E0/0 ---- E0/0 DSW2
    SW-PARTNER - E0/2 DSW1         DSW2 E0/1
                   DSW1 E0/1       /
                        ASW1 E0/0  E0/1
                        ASW1 E0/2 PC1    ASW1 E0/3 - SW-MEEGENOMEN - LAPTOP
    ```
    Alles in VLAN 10 (192.168.10.0/24): PC1 .11, LAPTOP .50, SRV1 .100. SW-PARTNER en SW-MEEGENOMEN zijn niet van jou: je mag ze bekijken, niet aanpassen.

    ## Inloggen
    - Switches: console, geen wachtwoord.
    - Hosts (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Opdrachten

    ### Deel 1 - Theorie
    1. Wat doen PortFast, BPDU guard, root guard en loop guard? Op welk soort poort zet je elk?
    2. Wat is het verschil tussen een poort die **err-disabled** is en een poort die **root-inconsistent** of **loop-inconsistent** is? Welke herstelt zichzelf?

    ### Deel 2 - Root guard
    1. Bekijk `show spanning-tree vlan 10` op DSW1. Wie is de root bridge? Is dat de bedoeling?
    2. Zet **root guard** op de juiste poort van DSW1.
    3. Bekijk opnieuw `show spanning-tree vlan 10`, `show spanning-tree inconsistentports` en `show logging`. Wie is nu root, en wat is de status van E0/2?

    ### Deel 3 - PortFast en BPDU guard
    1. Zet op ASW1 PortFast en BPDU guard op beide poorten naar eindapparaten (E0/2 en E0/3).
    2. Er gebeurt nog niets. Waarom niet? (tip: welke rol heeft de uplink van SW-MEEGENOMEN, en stuurt zo'n poort BPDU's?)
    3. Boots het inpluggen van de switch na: **herstart SW-MEEGENOMEN in CML** (rechtsklik, *Stop*, daarna *Start*). Tijdens het opstarten denkt die switch even dat hij root is en stuurt hij BPDU's.
    4. Bekijk `show interfaces status err-disabled` en `show logging` op ASW1. Wat is er gebeurd, en kan de laptop nog iets bereiken?
    5. Configureer automatisch herstel: `errdisable recovery cause bpduguard` en `errdisable recovery interval 30`. Bekijk `show errdisable recovery`. Na hoeveel tijd komt de poort terug? (Let op het verschil tussen het nieuwe interval en de timer die al liep.)
    6. Herstel de poort met de hand: "verwijder" de switch (stop in CML de link ASW1 E0/3 - SW-MEEGENOMEN) en geef daarna op ASW1 E0/3 `shutdown` en `no shutdown`.

    ### Deel 4 - Loop guard
    1. Bekijk op ASW1 `show spanning-tree vlan 10`. Welke rol heeft E0/1 (naar DSW2)?
    2. Zet **loop guard** op ASW1 E0/1.
    3. Boots een eenrichtingsstoring na: zet op **DSW2** E0/1 `spanning-tree bpdufilter enable` (DSW2 stuurt dan geen BPDU's meer naar ASW1, terwijl de link verder werkt).
    4. Bekijk op ASW1 `show spanning-tree vlan 10`, `show spanning-tree inconsistentports` en `show logging`.
    5. Haal de bpdufilter op DSW2 weg en kijk of ASW1 E0/1 zichzelf herstelt.
    6. Denkvraag (niet uitvoeren!): wat zou er met ASW1 E0/1 gebeuren als er geen loop guard op stond en DSW2 geen BPDU's meer stuurt?

    ### Deel 5 - Globale standaarden
    1. Bekijk wat `spanning-tree portfast default` en `spanning-tree portfast bpduguard default` doen (`show spanning-tree summary`). Op welke poorten werken ze wel en op welke niet?

    ### Deel 6 - Reflectie
    1. Waarom zet je root guard op de poort naar de partner en niet op de uplinks van ASW1?
    2. Waarom zet je loop guard nooit op een edge-poort (PortFast)?

    Je docent bespreekt daarna je antwoorden.
  title: Lab 2.5.2 - Beveilig de randen
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
