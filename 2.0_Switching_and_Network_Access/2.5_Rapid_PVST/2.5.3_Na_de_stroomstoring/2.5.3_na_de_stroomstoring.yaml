lab:
  description: CCNA 200-301 v2.0 - leerdoel 2.5. Troubleshootinglab Rapid PVST+. Er
    zitten 6 fouten in dit lab.
  notes: |-
    # Lab 2.5.3 - Na de stroomstoring

    **Leerdoel (CCNA 200-301 v2.0, 2.5):** Rapid PVST+ configureren en troubleshooten: root bridge, rollen en states, PortFast, root guard, loop guard en BPDU guard.

    ## Scenario
    Bij distributiecentrum De Pallet is na een stroomstoring een externe monteur bezig geweest met de switches. Sindsdien:
    - "PC1 heeft geen netwerk."
    - "PC3 (VLAN 10 op ASW2) heeft geen netwerk, terwijl PC2 ernaast (VLAN 20) wel werkt."
    - "De monitoring meldt dat ASW1 maar één werkende uplink heeft."
    - "Al het verkeer van VLAN 20 loopt via DSW1 in plaats van via DSW2."
    - "Na de stroomstoring duurde het bijna een minuut voordat het netwerk weer werkte. Dat hoort met onze switches een paar seconden te zijn."

    **Er zitten 6 fouten in dit lab.** Eén ervan merk je niet aan een klacht, maar alleen door elke poort met het ontwerp te vergelijken.

    ## Ontwerp
    - **Rapid PVST+** op alle switches.
    - **DSW1:** root primary voor VLAN 10, root secondary voor VLAN 20. **DSW2:** root primary voor VLAN 20, root secondary voor VLAN 10. ASW1 en ASW2 houden de standaardprioriteit.
    - **Hostpoorten:** PortFast + BPDU guard.
    - **Downlinks van DSW1/DSW2 naar ASW1/ASW2:** root guard.
    - Verder geen STP-aanpassingen (geen cost of port-priority).

    ## Netwerk
    ```
    SRV10 (V10) - E0/3 DSW1 E0/0 ------ E0/0 DSW2 E0/3 - SRV20 (V20)
                   DSW1 E0/1, E0/2      DSW2 E0/1, E0/2
                     |        \        /        |
                   ASW1 E0/0   ASW2 E0/0 / ASW1 E0/1   ASW2 E0/1
       ASW1: E0/2 PC1 (V10), E0/3 PC4 (V20)
       ASW2: E0/2 PC2 (V20), E0/3 PC3 (V10)
    ```
    Verbindingen: DSW1 E0/1 - ASW1 E0/0, DSW1 E0/2 - ASW2 E0/0, DSW2 E0/1 - ASW1 E0/1, DSW2 E0/2 - ASW2 E0/1. Alle links tussen switches zijn trunks (VLAN 10 en 20).

    | Host | Adres | VLAN |
    |---|---|---|
    | PC1 / PC3 / SRV10 | 192.168.10.11 / .13 / .100 | 10 |
    | PC2 / PC4 / SRV20 | 192.168.20.12 / .14 / .100 | 20 |

    ## Inloggen
    - Switches: console, geen wachtwoord.
    - Hosts (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Handige commando's
    `show spanning-tree vlan <nr>`, `show spanning-tree root`, `show spanning-tree summary`, `show spanning-tree inconsistentports`, `show interfaces status err-disabled`, `show spanning-tree interface <poort> detail`, `show logging`

    ## Opdrachten
    1. Test de klachten, en controleer daarna elke switch en elke poort tegen het ontwerp.
    2. Zoek en herstel de 6 fouten. Houd een **foutenlog** bij:

    | # | Switch/poort | Symptoom | Oorzaak | Oplossing (commando's) | Hoe geverifieerd |
    |---|---|---|---|---|---|
    | 1 | | | | | |
    | 2 | | | | | |
    | 3 | | | | | |
    | 4 | | | | | |
    | 5 | | | | | |
    | 6 | | | | | |

    3. Toon aan het eind met `show spanning-tree root` op elke switch aan dat de roots kloppen, en dat alle pc's hun server bereiken.

    ### Reflectie
    1. Welke fout werd juist door een **goede** beveiliging (uit het ontwerp) zichtbaar als storing?
    2. Waarom maakte fout 5 het herstel na de stroomstoring zo traag?

    Je docent bespreekt daarna je foutenlog.
  title: Lab 2.5.3 - Na de stroomstoring
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
