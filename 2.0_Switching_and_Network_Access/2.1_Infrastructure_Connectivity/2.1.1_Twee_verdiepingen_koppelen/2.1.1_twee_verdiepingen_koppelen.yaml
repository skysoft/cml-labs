      LAB 2.1.1 - TWEE VERDIEPINGEN KOPPELEN (configuratielab)
       VLAN 10 ADMINISTRATIE 192.168.10.0/24
       VLAN 20 VERKOOP       192.168.20.0/24
       VLAN 99 BEHEER/native 192.168.99.0/24
       Trunks: SW1 E0/1 - SW2 E0/1 en SW2 E0/0 - R1 (router-on-a-stick)
       Access: E0/2 = VLAN 10, E0/3 = VLAN 20 (op beide switches)
      Volledige opdracht: open de Lab Notes (tabblad Notes).
      Login hosts: cisco / cisco
