      LAB 2.1.6 - EINDLAB BOUWMARKT DE SPIJKER
       Er zitten 6 fouten in dit lab.
       DSW1 = multilayer switch, gateway voor VLAN 10/20/30/99
       DSW1 E0/0 routed 10.0.0.2/30 - EDGE 10.0.0.1 (internet)
