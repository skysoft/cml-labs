lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 2.1. Configuratielab: L2-LACP-EtherChannel
    (trunk) en L3-LACP-EtherChannel (routed).'
  notes: |-
    # Lab 2.1.3 - Meer bandbreedte naar de kern

    **Leerdoel (CCNA 200-301 v2.0, 2.1):** netwerkinfrastructuur verbinden: Layer 2/Layer 3 LACP port-channel (EtherChannel).

    ## Scenario
    Bij ingenieursbureau De Rekenlat zijn alle verbindingen tussen de switches **verdubbeld**: er ligt nu steeds een tweede kabel. Toch is er niets sneller geworden, en de beheerder ziet dat één van de twee kabels door spanning tree wordt geblokkeerd. Jouw taak is de dubbele verbindingen te bundelen met **LACP**:
    - tussen access-switch ASW1 en distributieswitch DSW1: een **L2-EtherChannel** die als trunk werkt;
    - tussen de distributieswitches DSW1 en DSW2 (beide multilayer switches): een **L3-EtherChannel** (routed link).

    VLAN's, SVI's en statische routes zijn al geconfigureerd.

    ## Verbindingen en ontwerp
    | Link | Poorten | Port-channel | Ontwerp |
    |---|---|---|---|
    | ASW1 - DSW1 | E0/0-1 aan beide kanten | Po1 | LACP (ASW1 active, DSW1 passive); trunk 802.1Q zonder DTP; native VLAN 99; allowed 10,20,99 |
    | DSW1 - DSW2 | E0/2-3 aan beide kanten | Po12 | LACP (beide active); routed: DSW1 10.0.12.1/30, DSW2 10.0.12.2/30 |

    ## Adressen
    | Apparaat | Interface | Adres | Opmerking |
    |---|---|---|---|
    | PC1 | ASW1 E0/2 (VLAN 10) | 192.168.10.11/24 | gateway .1 (DSW1) |
    | PC2 | ASW1 E0/3 (VLAN 20) | 192.168.20.11/24 | gateway .1 (DSW1) |
    | ASW1 | Vlan99 | 192.168.99.2/24 | gateway .1 (DSW1) |
    | DSW1 | Vlan10 / 20 / 99 | 192.168.10.1 / 20.1 / 99.1 | |
    | DSW2 | Vlan50 | 192.168.50.1/24 | serverlan |
    | SRV1 | DSW2 E0/0 (VLAN 50) | 192.168.50.10/24 | server |

    ## Inloggen
    - Switches: console, geen wachtwoord.
    - Hosts (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Opdrachten

    ### Deel 1 - Theorie
    1. Waarom levert een tweede kabel tussen twee switches zonder EtherChannel geen extra bandbreedte op?
    2. Welke combinaties van LACP-modi (`active`, `passive`) vormen een bundel? En wat doet `mode on`?
    3. Welke instellingen moeten op alle members van een bundel gelijk zijn?
    4. Wat is het verschil tussen een L2- en een L3-EtherChannel? Waar komt bij een L3-EtherChannel het IP-adres te staan?

    ### Deel 2 - Uitgangssituatie
    1. Bekijk op ASW1 én DSW1 `show spanning-tree vlan 1`. Welke switch is root, en welke poort is geblokkeerd?
    2. Bekijk op DSW1 `show ip interface brief` en `show ip route static`. Waarom zijn de SVI's down? Waarom staat de route naar 192.168.50.0/24 niet in de routingtabel?
    3. Ping vanaf PC1 naar zijn gateway en naar SRV1.

    ### Deel 3 - L2-EtherChannel ASW1 - DSW1
    1. Bundel E0/0-1 op ASW1 (LACP **active**) en op DSW1 (LACP **passive**) tot Po1.
    2. Configureer Po1 aan beide kanten als trunk volgens het ontwerp. Bekijk daarna de running-config van E0/0: wat valt je op?
    3. Controleer met `show etherchannel summary` en `show interfaces trunk`. Hoe ziet spanning tree de uplink nu (`show spanning-tree vlan 10`)?

    ### Deel 4 - L3-EtherChannel DSW1 - DSW2
    1. Maak van E0/2-3 op beide switches routed poorten, en bundel ze met LACP (**active**) tot Po12.
    2. Geef Po12 het IP-adres uit het ontwerp.
    3. Controleer met `show etherchannel summary` (let op de letters achter Po12) en `show ip interface brief`.

    ### Deel 5 - Verificatie en analyse
    1. Ping vanaf PC1 en PC2 naar SRV1. Controleer `show ip route static` op DSW1 opnieuw.
    2. Bekijk `show lacp neighbor` op DSW1. Welke kant is active, en welke passive?
    3. **Kabel eruit:**
       - Start op PC1 `ping 192.168.50.10` (zonder `-c`).
       - Stop in CML de link ASW1 E0/0 - DSW1 E0/0 (rechtsklik op de link, *Stop*).
       - Hoe lang duurt het voordat de ping weer lukt? Bekijk `show etherchannel summary` op ASW1.
       - Start de link daarna weer.
       *(Let op: in CML blijft de interface zelf "up" als je de link stopt; alleen LACP merkt dat er geen partner meer is.)*
    4. Zet op de members van Po1 aan beide kanten `lacp rate fast` en herhaal proef 3. Wat is het verschil? Bekijk ook `show lacp neighbor` (kolom *Flags*).
    5. Bekijk `show etherchannel load-balance`. Op basis waarvan wordt het verkeer verdeeld?

    ### Deel 6 - Reflectie
    1. Wat gebeurt er als beide kanten van een bundel op `passive` staan? Probeer het op Po1 (ASW1 op passive) en zet het daarna terug.
    2. Wat zou er bij proef 3 gebeurd zijn als de bundel met `channel-group ... mode on` was gemaakt? Waarom is `mode on` dus riskanter dan LACP?

    Je docent bespreekt daarna je antwoorden.
  title: Lab 2.1.3 - Meer bandbreedte naar de kern
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
