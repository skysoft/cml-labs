lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 2.4. Troubleshootinglab laag 3: vind
    de oorzaken met ping, extended ping en traceroute. Er zitten 4 fouten in dit lab.'
  notes: |-
    # Lab 2.4.3 - Onbereikbare vestigingen

    **Leerdoel (CCNA 200-301 v2.0, 2.4):** basisproblemen op laag 2 en 3 troubleshooten met show-commando's, ping, extended ping, traceroute en packet capture.

    ## Scenario
    Groothandel De Vrachtwagen heeft een hoofdkantoor (R1) en twee vestigingen: A (R3) en B (R4), verbonden via R2. Meldingen:
    - "PC1 kan SRV-A (192.168.3.10) niet bereiken. Vreemd: vanaf R1 zelf lukt een ping naar SRV-A wel."
    - "SRV-B (192.168.4.10) is onbereikbaar."
    - "De printer van vestiging B (192.168.5.10) is onbereikbaar."
    - "De back-upsoftware stuurt pakketten van 1400 bytes met het DF-bit naar vestiging B en krijgt foutmeldingen."

    **Er zitten 4 fouten in dit lab.** Gebruik vooral **ping, extended ping (met `source`, `size`, `df-bit`) en traceroute** om de plek van elk probleem te vinden, voordat je in de configuratie duikt.

    ## Ontwerp
    ```
    PC1 192.168.1.11 - E0/0 R1 E0/2 --10.0.12.0/30-- E0/0 R2 E0/1 --10.0.23.0/30-- E0/0 R3 E0/1 - SRV-A 192.168.3.10
                       R1 E0/1 = internet                  R2 E0/2 --10.0.24.0/30-- E0/0 R4 E0/1 - SRV-B 192.168.4.10
                                                                                       R4 E0/2 - PRN-B 192.168.5.10
    ```
    | Router | Interfaces |
    |---|---|
    | R1 | E0/0 192.168.1.1/24, E0/2 10.0.12.1/30, E0/1 DHCP (internet, NAT) |
    | R2 | E0/0 10.0.12.2, E0/1 10.0.23.1, E0/2 10.0.24.1 (alle /30) |
    | R3 | E0/0 10.0.23.2/30, E0/1 192.168.3.1/24 |
    | R4 | E0/0 10.0.24.2/30, E0/1 192.168.4.1/24, E0/2 192.168.5.1/24 |

    - **Routering (statisch):** R1 heeft een route naar elk vestigings-LAN via R2 en een default route naar internet. R2 heeft routes naar de LAN's van R3 en R4 en een default route naar R1. R3 en R4 hebben een default route naar R2.
    - **MTU:** alle links 1500 bytes.
    - Hosts gebruiken als gateway het .1-adres van hun LAN. R1 geeft **echt internet** (test: 8.8.8.8).

    ## Inloggen
    - Routers: console, geen wachtwoord.
    - Hosts (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Handig
    - IOS: `ping <adres> source <interface>`, `ping <adres> size <bytes> df-bit`, `traceroute <adres>`, of interactief: `ping` (extended commands: y). Stoppen: Ctrl-Shift-6.
    - Alpine: `ping -c 3 <adres>`, `traceroute -n <adres>`

    ## Opdrachten
    1. Test elke melding met ping en traceroute, vanaf PC1 én vanaf de routers (met verschillende bronadressen). Noteer bij elke melding **tot welke hop** het verkeer komt.
    2. Zoek en herstel de 4 fouten. Houd een **foutenlog** bij:

    | # | Apparaat | Symptoom | Gevonden met (ping/traceroute + uitvoer) | Oorzaak | Oplossing | Hoe geverifieerd |
    |---|---|---|---|---|---|---|
    | 1 | | | | | | |
    | 2 | | | | | | |
    | 3 | | | | | | |
    | 4 | | | | | | |

    ### Reflectie
    1. Waarom lukte de ping van R1 naar SRV-A wel, en die van PC1 niet?
    2. Hoe herken je een routinglus in de uitvoer van traceroute?
    3. Waar ging het verkeer naar de printer van vestiging B naartoe vóór het herstel? Hoe zag je dat?

    Je docent bespreekt daarna je foutenlog.
  title: Lab 2.4.3 - Onbereikbare vestigingen
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
