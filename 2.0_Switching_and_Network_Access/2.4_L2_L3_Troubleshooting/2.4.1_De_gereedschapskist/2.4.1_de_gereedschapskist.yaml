lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 2.4. Verkenningslab: show-commando''s,
    logs, (extended) ping, traceroute en packet capture op een werkend netwerk.'
  notes: |-
    # Lab 2.4.1 - De gereedschapskist

    **Leerdoel (CCNA 200-301 v2.0, 2.4):** basisproblemen op laag 2 en 3 troubleshooten met show-commando's (inclusief logs), ping, extended ping, traceroute en packet capture.

    ## Scenario
    Je begint als junior netwerkbeheerder bij adviesbureau De Kompasroos. Het netwerk **werkt**. Voordat je storingen gaat oplossen, leer je het gereedschap kennen op een netwerk waarvan je weet dat het goed is. Zo herken je later wat "normaal" is.

    ## Netwerk
    ```
    INTERNET - R1 (E0/1)
               R1 E0/0 192.168.1.1 - SW1 (192.168.1.2) - PC1 .11, PC2 .12
               R1 E0/2 10.0.12.1/30 - R2 E0/0 10.0.12.2
                                      R2 E0/1 10.0.23.1/30 - R3 E0/0 10.0.23.2
                                                             R3 E0/1 192.168.3.1 - SRV1 192.168.3.10 (webserver poort 80)
    ```
    Statische routering; R1 doet NAT naar het **echte internet** (test: 8.8.8.8).

    ## Inloggen
    - Routers en switches: console, geen wachtwoord.
    - Hosts (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Opdrachten

    ### Deel 1 - Theorie
    1. Noem de 8 syslog-severity-niveaus (0 t/m 7) met hun naam. Welk niveau hebben `%LINK-3-UPDOWN` en `%LINEPROTO-5-UPDOWN`?
    2. Wat betekenen bij een IOS-ping de tekens `!`, `.`, `U` en `M`?
    3. Hoe werkt traceroute? (tip: TTL)

    ### Deel 2 - Show-commando's
    1. Voer op R2 uit en leg in één zin uit wat je ziet: `show ip interface brief`, `show interfaces Ethernet0/1` (let op MTU, tellers en errors), `show ip route`, `show ip arp`, `show version | include uptime|Last reload`.
    2. Op SW1: `show mac address-table`. Op welke poort zit PC1?

    ### Deel 3 - Logs
    1. Bekijk `show logging` op R2. Welke instellingen staan bovenaan (console, buffer)?
    2. Zet de buffer op alleen **warnings en erger**: `logging buffered 8192 warnings`, en maak de buffer leeg met `clear logging`.
    3. Zet E0/3 van R2 uit en weer aan (`shutdown` / `no shutdown`). Welke meldingen staan er nu in `show logging`, en welke niet? Verklaar met de severity-niveaus.
    4. Zet de buffer terug: `logging buffered 8192 debugging`. Herhaal de proef.
    5. Welke melding verschijnt er als je de configuratie wijzigt? Waarom is die handig bij troubleshooting?

    ### Deel 4 - Ping en extended ping
    1. Ping vanaf R1 naar 192.168.3.10. Welk bronadres gebruikt R1?
    2. Ping opnieuw, maar nu met bronadres 192.168.1.1: `ping 192.168.3.10 source Ethernet0/0`. Probeer ook de interactieve versie: typ alleen `ping` en beantwoord de vragen (extended commands: y).
    3. **MTU-proef:** zet op R2 `ip mtu 1400` op E0/1. Ping vanaf R1:
       - `ping 192.168.3.10 size 1450 df-bit repeat 3`
       - `ping 192.168.3.10 size 1450 repeat 3`
       - `ping 192.168.3.10 size 1380 df-bit repeat 3`
       Verklaar de verschillen. Zet daarna `no ip mtu` op R2 E0/1.

    ### Deel 5 - Traceroute
    1. Vanaf R1: `traceroute 192.168.3.10`. Vanaf PC1: `traceroute -n 192.168.3.10` en `traceroute -n 8.8.8.8`.
    2. Waarom zie je bij hop 1 vanaf PC1 het adres 192.168.1.1, en bij hop 2 het adres 10.0.12.2?
    3. Wat betekenen regels met `* * *`?

    ### Deel 6 - Packet capture
    1. Start in CML een packet capture op de link **SW1 - PC1** (klik op de link, *Packet Capture* > *Start*).
    2. Voer op PC1 uit: `sudo ip neigh flush all`, `ping -c 2 192.168.3.10`, `wget -qO- http://192.168.3.10` en `echo | nc -w 2 192.168.3.10 81`.
    3. Stop de capture en bekijk de pakketten (in CML of download de pcap en open hem in Wireshark).
       - Welke twee ARP-pakketten zie je, en waarom zijn die nodig voor de ping?
       - Wat is de TTL van de ping-reply die bij PC1 aankomt? Hoeveel routers zijn er gepasseerd?
       - Zoek de TCP-handshake naar poort 80 (drie pakketten). Welke flags hebben ze?
       - Wat antwoordt SRV1 op de verbinding naar poort 81, en wat betekent dat?

    ### Deel 7 - Reflectie
    1. Welk gereedschap zou je als eerste pakken bij "de website doet het niet", en welk bij "grote bestanden kopiëren mislukt, kleine niet"?
    2. Waarom is een ping met een ander bronadres soms nodig om een probleem te vinden?

    Je docent bespreekt daarna je antwoorden.
  title: Lab 2.4.1 - De gereedschapskist
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
