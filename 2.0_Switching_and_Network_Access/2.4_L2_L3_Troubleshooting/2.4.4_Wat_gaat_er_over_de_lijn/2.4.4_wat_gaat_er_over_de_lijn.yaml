lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 2.4. Troubleshootinglab met packet capture:
    lees de pakketten om de oorzaak te vinden. Er zitten 4 fouten in dit lab.'
  notes: |-
    # Lab 2.4.4 - Wat gaat er over de lijn?

    **Leerdoel (CCNA 200-301 v2.0, 2.4):** basisproblemen troubleshooten met show-commando's, ping, traceroute en **packet capture output**.

    ## Scenario
    Bij opleidingsinstituut De Leergang zijn er vier klachten. De show-commando's op de routers zien er op het eerste gezicht goed uit. Jouw collega zegt: "Kijk gewoon wat er over de lijn gaat."
    - "PC2 kan niets buiten zijn eigen subnet bereiken; PC1 naast hem wel."
    - "PC3 krijgt geen IP-adres."
    - "Het intranet op SRV1 (http://192.168.50.10) werkt niet, maar SRV1 reageert wel op ping."
    - "De archiefserver SRV2 (192.168.30.10) is onbereikbaar."

    **Er zitten 4 fouten in dit lab.** Gebruik voor elke klacht een **packet capture** in CML en leg in je foutenlog vast welk pakket (of welk ontbrekend pakket) de oorzaak verraadde.

    ## Packet capture in CML
    Klik op een link, kies *Packet Capture* > *Start*, voer de test uit en stop de capture. Bekijk de pakketten in CML of download de pcap voor Wireshark. Kies de link zo dicht mogelijk bij het probleem.

    ## Ontwerp
    ```
    PC1, PC2 (VLAN 10), PC3 (VLAN 20) - SW1 - E0/0 R1 (trunk; .1 in VLAN 10 en 20)
                                               R1 E0/3 192.168.50.1 - SRV1 192.168.50.10 (intranet, http poort 80)
                                               R1 E0/1 10.0.12.1 --- R2 E0/0 10.0.12.2
                                                                     R2 E0/1 192.168.30.1 - SRV2 192.168.30.10
                                               R1 E0/2 = internet
    ```
    | Apparaat | Adres | Gateway |
    |---|---|---|
    | PC1 (SW1 E0/1, VLAN 10) | 192.168.10.11/24 | 192.168.10.1 |
    | PC2 (SW1 E0/2, VLAN 10) | 192.168.10.12/24 | 192.168.10.1 |
    | PC3 (SW1 E0/3, VLAN 20) | via DHCP | 192.168.20.1 |
    | SRV1 | 192.168.50.10/24 | 192.168.50.1 |
    | SRV2 | 192.168.30.10/24 | 192.168.30.1 |

    - De **DHCP-server** voor VLAN 20 is **R2** (centrale DHCP-server). R1 moet DHCP-verzoeken uit VLAN 20 doorsturen naar R2 (10.0.12.2).
    - Routering statisch; R1 heeft **echt internet** (test: 8.8.8.8).

    ## Inloggen
    - Routers en switches: console, geen wachtwoord.
    - Hosts (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Opdrachten
    1. Maak voor elke klacht een capture op de juiste link terwijl je de fout reproduceert. Handige tests: `ping`, `wget -qO- http://192.168.50.10`, `echo | nc -w 2 <adres> <poort>`; op PC3 loopt de DHCP-client vanzelf.
    2. Zoek en herstel de 4 fouten. Houd een **foutenlog** bij:

    | # | Klacht | Link van de capture | Wat zag je in de capture? | Oorzaak | Oplossing | Hoe geverifieerd |
    |---|---|---|---|---|---|---|
    | 1 | | | | | | |
    | 2 | | | | | | |
    | 3 | | | | | | |
    | 4 | | | | | | |

    ### Reflectie
    1. Wat is het verschil tussen "geen antwoord" en een TCP-RST? Wat betekent elk?
    2. Welk adres stond er als afzender in het ICMP-bericht bij de SRV2-klacht, en wat vertelt dat je?

    Je docent bespreekt daarna je foutenlog.
  title: Lab 2.4.4 - Wat gaat er over de lijn
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
