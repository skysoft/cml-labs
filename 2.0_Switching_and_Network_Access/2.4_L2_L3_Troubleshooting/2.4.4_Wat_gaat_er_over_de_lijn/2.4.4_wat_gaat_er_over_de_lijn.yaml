      LAB 2.4.4 - WAT GAAT ER OVER DE LIJN?
       Er zitten 4 fouten in dit lab.
       Gereedschap: PACKET CAPTURE (klik op een link >
       Packet Capture > Start), daarna ping/wget/nc.
       VLAN 10 PC1/PC2, VLAN 20 PC3 (DHCP via R2)
       SRV1 intranet 192.168.50.10, SRV2 192.168.30.10
      Ontwerp en opdracht: open de Lab Notes (tabblad Notes).
      Login hosts: cisco / cisco
