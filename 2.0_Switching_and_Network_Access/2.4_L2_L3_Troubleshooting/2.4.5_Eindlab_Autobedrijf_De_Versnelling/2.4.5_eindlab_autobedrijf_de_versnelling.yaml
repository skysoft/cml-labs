lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 2.4. Integraal eindlab: show-commando''s,
    logs, (extended) ping, traceroute en packet capture. Er zitten 6 fouten in dit
    lab.'
  notes: |-
    # Lab 2.4.5 - Eindlab Autobedrijf De Versnelling

    **Leerdoel (CCNA 200-301 v2.0, 2.4):** basisproblemen op laag 2 en 3 troubleshooten met show-commando's (inclusief logs), ping, extended ping, traceroute en packet capture.

    ## Scenario
    Autobedrijf De Versnelling heeft een kantoor en een werkplaats (VLAN 10 en 20 op R1) en een serverruimte achter R2 met het dealer-managementsysteem **DMS**. Na een onderhoudsweekend:
    - "De beheerder kan SW2 niet bereiken (192.168.99.3)."
    - "PC2 in de werkplaats heeft geen netwerk."
    - "Niemand bereikt het DMS (192.168.30.200)."
    - "Het exporteren van grote DMS-rapporten mislukt (de software stuurt pakketten van 1450 bytes met het DF-bit)."
    - "De DMS-webinterface (http://192.168.30.200) opent niet."

    **Er zitten 6 fouten in dit lab.** Voor elke fout is een ander gereedschap het handigst. Vermeld in je foutenlog steeds **welk gereedschap** de fout aantoonde.

    ## Ontwerp
    ```
    INTERNET - R1 E0/2
    R1 E0/0 (trunk: .10 192.168.10.1, .20 192.168.20.1, .99 native 192.168.99.1) - SW1 E0/0
       SW1 E0/1 PC1 (VLAN 10), SW1 E0/2 - SW2 E0/0 (trunk, native 99)
       SW2 E0/1 PC2 (VLAN 20), SW2 E0/2 PC3 (VLAN 20)
    R1 E0/1 10.0.12.1/30 --- R2 E0/0 10.0.12.2/30
                              R2 E0/1 192.168.30.1/24 - SRV-DMS 192.168.30.200 (web op poort 80)
    ```
    | Apparaat | Adres | VLAN |
    |---|---|---|
    | PC1 | 192.168.10.11/24 | 10 |
    | PC2 | 192.168.20.11/24 | 20 |
    | PC3 | 192.168.20.12/24 | 20 |
    | SW1 / SW2 | 192.168.99.2 / .3 | 99 |
    | SRV-DMS | 192.168.30.200/24, gateway .1 | - |

    - **R1:** route naar 192.168.30.0/24 via R2, default route naar internet (NAT).
    - **R2:** routes naar de LAN's 192.168.10.0/24, 192.168.20.0/24 en 192.168.99.0/24 via R1. **Geen** default route (het DMS mag niet het internet op).
    - Alle links: MTU 1500. Alle trunks: native VLAN 99.

    ## Inloggen
    - Routers en switches: console, geen wachtwoord.
    - Hosts (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Opdrachten
    1. Reproduceer elke klacht en kies bewust je gereedschap: `show logging`, show-commando's, ping/extended ping (`source`, `size`, `df-bit`), traceroute, of een packet capture in CML.
    2. Zoek en herstel de 6 fouten. Houd een **foutenlog** bij:

    | # | Apparaat | Symptoom | Gereedschap + wat je zag | Oorzaak | Oplossing | Hoe geverifieerd |
    |---|---|---|---|---|---|---|
    | 1 | | | | | | |
    | 2 | | | | | | |
    | 3 | | | | | | |
    | 4 | | | | | | |
    | 5 | | | | | | |
    | 6 | | | | | | |

    3. Oplevering: alle pc's bereiken elkaar, 8.8.8.8 en het DMS (ook met 1450 bytes + DF vanaf R1), de webinterface van het DMS werkt, en beide switches zijn beheerbaar.

    ### Reflectie
    1. Welke fout verborg een andere fout?
    2. Welk gereedschap zou je voortaan als eerste gebruiken bij (a) "één pc doet het niet", (b) "een hele vestiging is onbereikbaar", (c) "een applicatie werkt niet maar ping wel"?

    Je docent bespreekt daarna je foutenlog.
  title: Lab 2.4.5 - Eindlab Autobedrijf De Versnelling
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
