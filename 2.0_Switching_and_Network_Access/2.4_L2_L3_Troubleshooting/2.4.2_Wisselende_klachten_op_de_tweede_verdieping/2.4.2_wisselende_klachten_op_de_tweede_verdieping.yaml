lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 2.4. Troubleshootinglab laag 2: vind
    de oorzaken met show-commando''s en logs. Er zitten 4 fouten in dit lab.'
  notes: |-
    # Lab 2.4.2 - Wisselende klachten op de tweede verdieping

    **Leerdoel (CCNA 200-301 v2.0, 2.4):** basisproblemen op laag 2 en 3 troubleshooten met show-commando's (inclusief logs), ping, extended ping, traceroute en packet capture.

    ## Scenario
    Bij notariskantoor De Zegelring komen de klachten door elkaar binnen:
    - "PC1 heeft sinds vanochtend helemaal geen netwerk."
    - "PC2 kan de printer en het internet niet bereiken."
    - "PC3 komt niet meer buiten het eigen VLAN: geen internet en de kantoor-pc's zijn onbereikbaar."
    - "De printer (192.168.20.20) is voor niemand bereikbaar."
    - "De beheerder kan SW2 niet meer bereiken op 192.168.99.3."

    **Er zitten 4 fouten in dit lab.** Werk methodisch: kijk **eerst in de logs en show-commando's** voordat je iets verandert, en schrijf bij elke fout op met welk commando of welke logmelding je hem vond.

    ## Ontwerp
    | VLAN | Naam | Subnet | Gateway (R1, router-on-a-stick) |
    |---|---|---|---|
    | 10 | KANTOOR | 192.168.10.0/24 | 192.168.10.1 |
    | 20 | SECRETARIAAT | 192.168.20.0/24 | 192.168.20.1 |
    | 99 | BEHEER (native) | 192.168.99.0/24 | 192.168.99.1 |

    | Apparaat | Aangesloten op | VLAN | Adres |
    |---|---|---|---|
    | PC1 | SW2 E0/1 | 10 | 192.168.10.11 |
    | PC2 | SW2 E0/2 | 10 | 192.168.10.12 |
    | PC3 | SW1 E0/2 | 20 | 192.168.20.11 |
    | PRN1 (printer) | SW1 E0/3 | 20 | 192.168.20.20 |
    | SW1 / SW2 | Vlan99 | 99 | 192.168.99.2 / .3 |

    Verbindingen: R1 E0/0 - SW1 E0/0 (trunk), SW1 E0/1 - SW2 E0/0 (trunk). Alle trunks: native VLAN 99. R1 geeft **echt internet** (test: 8.8.8.8).

    ## Inloggen
    - Routers en switches: console, geen wachtwoord.
    - Hosts (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**.

    ## Handige commando's
    `show logging`, `show ip interface brief`, `show interfaces status`, `show mac address-table`, `show ip arp`, `show interfaces trunk`, `show vlan brief`; op de hosts: `ip addr`, `ip neigh` (ARP-tabel), `sudo ip neigh flush all`

    ## Opdrachten
    1. Verzamel eerst informatie: bekijk op **elk** netwerkapparaat `show logging`. Noteer elke opvallende melding.
    2. Zoek en herstel de 4 fouten. Houd een **foutenlog** bij:

    | # | Apparaat | Symptoom | Gevonden met (commando/logmelding) | Oorzaak | Oplossing | Hoe geverifieerd |
    |---|---|---|---|---|---|---|
    | 1 | | | | | | |
    | 2 | | | | | | |
    | 3 | | | | | | |
    | 4 | | | | | | |

    ### Reflectie
    1. Welke fout(en) vond je dankzij de logs, en welke met show-commando's?
    2. Bekijk op PC3 `ip neigh` vóór het herstel. Waarom stuurde PC3 zijn verkeer naar het verkeerde apparaat? En waarom moest je na het herstel misschien nog even wachten (of de ARP-tabel legen)?

    Je docent bespreekt daarna je foutenlog.
  title: Lab 2.4.2 - Wisselende klachten op de tweede verdieping
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
