lab:
  description: 'CCNA 200-301 v2.0 - leerdoel 1.3. Troubleshootlab: vind en herstel
    de storing zodat het netwerk weer overeenkomt met de documentatie.'
  notes: |-
    # Lab 1.3.3 - Wisselende storingen kantoor-LAN

    **Leerdoel (CCNA 200-301 v2.0, 1.3):** IPv4-adresconfiguratie, -toewijzing en subnetting troubleshooten.

    ## Scenario
    Het kantoor-LAN 192.168.30.0/24 hangt aan router R1. Werkplekken en servers hebben een statisch adres, gasten en nieuwe laptops krijgen hun adres via DHCP van R1. Het adres 198.51.100.1 op R1 (Loopback1) staat voor "het internet".

    Sinds vorige week komen er vreemde, wisselende klachten binnen:
    - *PC1:* "Het internet (198.51.100.1) werkt soms wel en soms niet."
    - *PC2:* "Mijn verbinding valt steeds weg. Soms antwoordt er wel iets, soms niet."
    - *SRV1-beheerder:* "Sinds die nieuwe laptop (PC5) is aangesloten, is mijn fileserver af en toe onbereikbaar."

    Er zitten **3 fouten** in het netwerk.

    ## Adresplan (de documentatie klopt)
    | Apparaat | Interface | IP-adres | Masker | Gateway |
    |---|---|---|---|---|
    | R1 | E0/0 (LAN) | 192.168.30.1 | /24 | - |
    | R1 | Loopback1 ("internet") | 198.51.100.1 | /32 | - |
    | SW1 | Vlan1 (beheer) | 192.168.30.2 | /24 | 192.168.30.1 |
    | PC1 | eth0 | 192.168.30.11 | /24 | 192.168.30.1 |
    | PC2 | eth0 | 192.168.30.12 | /24 | 192.168.30.1 |
    | PC3 | eth0 | 192.168.30.13 | /24 | 192.168.30.1 |
    | PC4 | eth0 | 192.168.30.14 | /24 | 192.168.30.1 |
    | SRV1 | eth0 | 192.168.30.50 | /24 | 192.168.30.1 |
    | PC5 | eth0 | DHCP | /24 | via DHCP |

    Afspraak voor DHCP: R1 deelt **alleen .100 t/m .200** uit. Alle andere adressen zijn gereserveerd voor statische apparaten.

    ## Inloggen
    - R1 en SW1: console, geen wachtwoord.
    - PC's en server (Alpine Linux): gebruiker **cisco** / wachtwoord **cisco**. Gebruik `sudo` voor wijzigingen.

    ## Opdrachten

    ### Deel 1 - Documentatie analyseren
    Bereken voor het LAN het netwerkadres, het bruikbare bereik en het broadcastadres. Welke adressen zijn volgens de afspraken statisch, en welke dynamisch?

    ### Deel 2 - Symptomen verzamelen
    Ping vanaf elke host naar 198.51.100.1, SRV1 en de andere hosts, met `ping -c 20`. Noteer per test het percentage packet loss.

    ### Deel 3 - Verkennen en vergelijken
    Maak een tabel met per host het IP-adres, het MAC-adres en de switchpoort, en vergelijk die met het adresplan.
    - Host: `ip addr show eth0`, `ip route`, `ip neigh`
    - R1: `show ip interface brief`, `show running-config`, `show ip arp`, `show logging`, `show ip dhcp binding`, `show ip dhcp pool`
    - SW1: `show mac address-table`, `show interfaces status`

    ### Deel 4 - Fouten vinden en herstellen
    Noteer voor elke fout:
    1. het symptoom
    2. het apparaat en het commando waarmee je de fout vond
    3. de oorzaak
    4. het herstelcommando

    Handige commando's:
    ```
    # Linux-host
    sudo ip addr add|del <ip>/<prefix> dev eth0
    sudo ip route add|del default via <gateway>
    sudo ip neigh flush dev eth0                                 # ARP-cache legen
    sudo ip addr flush dev eth0 && sudo udhcpc -i eth0 -n -q     # DHCP-lease opnieuw aanvragen
    # R1
    clear arp-cache
    clear ip dhcp binding *
    ```

    ### Deel 5 - Verificatie
    - `ping -c 20 198.51.100.1` vanaf elke host geeft 0% packet loss.
    - `show logging` op R1 toont geen nieuwe foutmeldingen.
    - Alle adressen komen overeen met het adresplan en de DHCP-afspraken.

    ### Deel 6 - Reflectie
    1. Welke fouten heb je gevonden? Geef per fout het commando dat de doorslag gaf.
    2. Welke fout was het lastigst te vinden, en waarom?
    3. Waarom waren de storingen in dit lab wisselend in plaats van constant?
    4. Hoe had deze storing voorkomen kunnen worden?

    Je docent bespreekt daarna nog een aantal verdiepingsvragen met je.
  title: Lab 1.3.3 - Wisselende storingen kantoor-LAN
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
