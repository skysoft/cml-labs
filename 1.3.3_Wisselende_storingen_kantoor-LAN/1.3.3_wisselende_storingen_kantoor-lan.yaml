      LAB 1.3.3 - WISSELENDE STORINGEN KANTOOR-LAN
      Adresplan: LAN 192.168.30.0/24, GW R1 .1, SW1 beheer .2
       PC1 .11  PC2 .12  PC3 .13  PC4 .14  SRV1 .50
       PC5 = DHCP (bereik .100 t/m .200)
       "Internet"-test: 198.51.100.1 (Loopback1 op R1)
      Er zitten 3 fouten in dit netwerk. Vind ze, herstel ze
      en verifieer met ping -c 20 (0% loss).
      Volledige opdracht: open de Lab Notes (tabblad Notes).
      Login PC's/server: cisco / cisco (sudo voor wijzigingen)
